# Every push to main and every pull request: lint, tests and a typecheck.
# The suites need the network only to install, and no API key.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Question_Intelligence/Backend
    steps:
      # Checked out under its own name, the way the platform lays repos side by side.
      - uses: actions/checkout@v4
        with:
          path: Question_Intelligence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Question_Intelligence/Backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # ruff pinned so a new release's rules never turn main red on their own.
          python -m pip install -e ".[dev]" "ruff==0.17.1"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
