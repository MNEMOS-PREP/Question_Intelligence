  testing_and_debugging__q2:
    stem: During a production outage you notice a spike in latency for a specific API endpoint. Walk me
      through how you would debug the issue using logs, metrics, and a minimal reproducible test.
    modality: verbal
    round_types:
    - systems_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:testing_and_debugging
      weight: 0.7
    - id: concept:caching_and_locality
      weight: 0.15
    reference_answer: First I’d look at the deployment timeline to see if a recent change coincides with
      the spike. Then I’d pull the service logs for that endpoint, filtering for errors or unusually long
      request times, and check the latency metrics – especially the 95th-percentile histogram – to confirm
      the pattern. If the logs show cache-miss warnings or repeated DB calls, I’d suspect a caching issue,
      perhaps a key-eviction or stale data causing extra work. To verify, I’d craft a minimal curl request
      that mimics the failing payload and run it against a staging copy of the service, watching the same
      logs and metrics. If the reproducer shows the same delay, I can pinpoint the offending component
      and either roll back the change or apply a hot-fix, then monitor the metrics to ensure latency returns
      to baseline.
    key_points:
    - id: kp_1
      statement: 'Outlines a systematic approach: check recent deployments, examine logs for errors, and
        look at latency histograms.'
      required: true
    - id: kp_2
      statement: Considers whether a cache miss or eviction pattern could cause the latency spike.
      required: true
    - id: kp_3
      statement: Describes creating a small reproducer (e.g., curl with same payload) to isolate the problem.
      required: false
    - id: kp_4
      statement: Mentions rolling back or disabling the offending change if needed.
      required: false
    hint_ladder:
    - What observability data helps you narrow down where time is spent?
    - How can you isolate the problem with a tiny test request?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
