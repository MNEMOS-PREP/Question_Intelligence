    drafted_at: '2026-10-07'
  compilation_and_interpretation__q1:
    stem: You notice a Java application’s startup time spikes after a recent code change; the JIT compiler
      seems to be re-compiling many methods. What could be causing this behavior?
    modality: verbal
    round_types:
    - systems_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:compilation_and_interpretation
      weight: 0.7
    - id: concept:testing_and_debugging
      weight: 0.15
    reference_answer: A likely cause is that the recent change altered method signatures or added enough
      new bytecode to overflow the JIT’s code cache. When the cache fills, the VM evicts older compiled
      code, forcing it to re-compile methods on the next execution, which shows up as a startup spike.
      Additionally, tiered compilation may reset its profiling data if the bytecode layout changes, causing
      methods to start again in the interpreter stage before being hot-compiled. Turning off the JIT temporarily
      or inspecting the compilation log with -XX:+PrintCompilation can verify whether the methods are
      being re-compiled repeatedly.
    key_points:
    - id: kp_1
      statement: Identifies that profile-guided optimizations or tiered compilation may be invalidated
        by changed bytecode signatures.
      required: true
    - id: kp_2
      statement: Explains that adding or removing methods can increase the size of the code cache, causing
        previous compiled code to be evicted and re-compiled.
      required: true
    - id: kp_3
      statement: Mentions that disabling the JIT or using -XX:+PrintCompilation can confirm the re-compilation
        pattern.
      required: false
    hint_ladder:
    - Think about what the JIT stores about compiled methods.
    - What happens when the code cache runs out of space?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  compilation_and_interpretation__q2:
    stem: Compare static linking performed by a traditional compiler with dynamic linking used by an interpreter’s
      runtime. What are the main trade-offs for performance and deployment?
    modality: verbal
    round_types:
    - systems_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:compilation_and_interpretation
      weight: 0.7
    - id: concept:computer_architecture_basics
      weight: 0.15
    reference_answer: Static linking embeds all required code into the final binary, so at launch the
      OS can load and run it without any symbol lookup, giving the fastest start-up and consistent performance.
      However, the executable is larger and any library update requires recompiling the whole program.
      Dynamic linking, used by many interpreters and JIT runtimes, loads shared objects at run-time, allowing
      multiple programs to share the same memory pages and letting developers patch or upgrade libraries
      without rebuilding the application. The downside is a small runtime cost for resolving symbols and
      possible version-mismatch issues, which can affect start-up latency and introduce indirection overhead
      during execution.
    key_points:
    - id: kp_1
      statement: Static linking produces a single executable, eliminating runtime symbol resolution and
        thus faster start-up and predictable performance.
      required: true
    - id: kp_2
      statement: Dynamic linking reduces binary size, enables shared library reuse, and allows updates
        without recompiling the whole program, but adds runtime lookup overhead.
      required: true
    - id: kp_3
      statement: Mentions that interpreters typically load bytecode and resolve symbols on demand, offering
        flexibility at the cost of slower execution compared to fully compiled code.
      required: false
    hint_ladder:
    - Consider what happens at load time versus execution time.
    - Think about binary size versus the ability to update components independently.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  testing_and_debugging__q1:
    stem: You are adding a new feature to a legacy codebase and decide to write unit tests first. Explain
      why starting with tests helps you catch bugs early and how you would choose representative test
      cases.
    modality: verbal
    round_types:
    - systems_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:testing_and_debugging
      weight: 0.7
    reference_answer: 'Starting with unit tests forces you to think about the contract of the new feature
      before you write any implementation. That contract becomes a safety net: once the code is added,
      the tests verify it works and will catch any future regression. To pick good test cases, I would
      include a happy-path scenario, edge values (like zero, max size, empty input), and error cases such
      as invalid arguments or resource failures. By covering these categories, the suite quickly surfaces
      bugs that would otherwise appear only during integration or in production, letting me debug early
      and confidently refactor the legacy code.'
    key_points:
    - id: kp_1
      statement: Describes that writing tests before code defines expected behavior and creates a safety
        net for regressions.
      required: true
    - id: kp_2
      statement: Mentions selecting test cases that cover typical, boundary, and error-handling paths.
      required: true
    - id: kp_3
      statement: Explains that failing tests give immediate feedback, reducing debugging time later.
      required: false
    hint_ladder:
    - What does a test define before code exists?
    - Think about typical, boundary, and error inputs.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
