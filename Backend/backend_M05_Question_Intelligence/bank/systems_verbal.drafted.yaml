  caching_and_locality__q2:
    stem: Explain why a write-through cache can improve read latency but may hurt write throughput, and
      when you would prefer a write-back policy instead.
    modality: verbal
    round_types:
    - systems_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:caching_and_locality
      weight: 0.7
    - id: concept:memory_management
      weight: 0.15
    reference_answer: With a write-through cache, every write operation updates both the cache line and
      the underlying storage immediately. This guarantees that the persistent copy is always current,
      but the write latency now includes the slower store access, reducing overall write throughput. Reads,
      however, are fast because the data is already cached, avoiding the store round-trip. A write-back
      cache, by contrast, writes only to the cache and marks the line dirty, flushing to the backing store
      later in batches. This removes the store latency from the critical path, boosting write throughput,
      but it introduces a window where a crash could lose recent updates. You’d pick write-back when you
      have a write-heavy workload and can tolerate brief inconsistency—for example, logging or analytics
      pipelines that buffer data before persisting to disk.
    key_points:
    - id: kp_1
      statement: States that write-through updates the backing store on every write, guaranteeing consistency
        but adding the store’s write latency to each operation.
      required: true
    - id: kp_2
      statement: Notes that reads benefit because the data is already in the cache, eliminating a round-trip
        to main memory or disk.
      required: true
    - id: kp_3
      statement: Explains that write-back defers writes, batching them in the cache, which raises write
        throughput at the risk of data loss on failure.
      required: true
    - id: kp_4
      statement: Provides a scenario where write-back is preferable, such as high-write workloads with
        tolerable staleness or when the backing store is a slow disk.
      required: false
    hint_ladder:
    - Separate the path of a read from that of a write.
    - Consider what happens if the system crashes after a write.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
