items:
  computer_architecture_basics__q1:
    stem: In a simple 5-stage pipeline, why does a branch instruction often cause a stall, and what hardware
      technique can reduce that penalty?
    modality: verbal
    round_types:
    - systems_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:computer_architecture_basics
      weight: 0.7
    reference_answer: When a branch reaches the decode stage, the processor does not yet know whether
      the branch will be taken or what the target address is. Meanwhile the fetch stage continues pulling
      the next sequential instruction, which may be wrong. Those fetched instructions occupy pipeline
      slots and must be flushed once the branch resolves, causing a stall. Branch prediction mitigates
      this by guessing the outcome and target early – a static scheme always assumes not-taken or taken,
      while a dynamic predictor learns patterns and speculatively fetches the predicted target. Correct
      predictions keep the pipeline full; a misprediction still forces a flush, but the average stall
      is much smaller.
    key_points:
    - id: kp_1
      statement: Explains that the pipeline fetches sequential instructions while the branch outcome is
        being resolved, leading to wasted work.
      required: true
    - id: kp_2
      statement: Describes branch prediction (static or dynamic) as a technique to fetch the likely target
        early, reducing stalls.
      required: true
    - id: kp_3
      statement: Mentions that misprediction still incurs a penalty because wrong instructions must be
        flushed.
      required: false
    hint_ladder:
    - Think about what the pipeline has fetched when the branch target is not yet known.
    - Consider a method that guesses the target before it is resolved.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
