  computer_architecture_basics__q2:
    stem: You notice a program running slower on a new CPU despite the same clock speed; the instruction
      mix is unchanged. What architectural factors could explain the slowdown?
    modality: verbal
    round_types:
    - systems_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:computer_architecture_basics
      weight: 0.7
    - id: concept:caching_and_locality
      weight: 0.15
    reference_answer: Even with the same clock, a newer CPU may have a deeper or wider pipeline, different
      cache sizes, or a different branch predictor. If the new chip has smaller L1/L2 caches or higher
      latency, memory accesses will stall more often, slowing the program. Likewise, a wider pipeline
      can increase the number of cycles an instruction spends in flight, and if the branch predictor is
      weaker, more mispredictions cause flushes. Any of these architectural changes—especially cache hierarchy—can
      degrade effective throughput despite identical clock rates.
    key_points:
    - id: kp_1
      statement: Mentions that cache hierarchy differences (size, latency, associativity) can increase
        memory access stalls.
      required: true
    - id: kp_2
      statement: Notes that pipeline depth or width changes can affect instruction throughput per cycle.
      required: false
    - id: kp_3
      statement: References possible differences in branch predictor quality or execution unit availability.
      required: false
    hint_ladder:
    - Think about resources beyond clock frequency that affect how fast instructions retire.
    - One factor relates to how quickly data is fetched from memory.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  caching_and_locality__q1:
    stem: In a high-traffic web service you notice the cache hit rate dropping after a recent deployment;
      what could cause this and how would you investigate?
    modality: verbal
    round_types:
    - systems_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:caching_and_locality
      weight: 0.7
    - id: concept:testing_and_debugging
      weight: 0.15
    reference_answer: A sudden drop in hit rate usually means the service is no longer looking up the
      same keys that were cached. A deployment might have changed the request-parameter order, added a
      version prefix, or altered the TTL logic, so the generated cache key no longer matches existing
      entries. I would first diff the code to see any key-construction changes, then instrument a few
      requests to log the keys before and after the change. Checking cache logs for miss reasons and running
      a small-scale A/B test can confirm the culprit. Once identified, I’d either revert the key change,
      adjust the invalidation policy, or update the TTL to bring the hit rate back up.
    key_points:
    - id: kp_1
      statement: Identifies possible causes such as changed cache keys, altered TTLs, or data-format incompatibility
        introduced by the deployment.
      required: true
    - id: kp_2
      statement: 'Describes a systematic debugging approach: check deployment diff, monitor key generation,
        examine logs for cache misses, and run a controlled A/B test.'
      required: true
    - id: kp_3
      statement: Mentions restoring hit rate by fixing the root cause (e.g., reverting key schema or updating
        invalidation logic).
      required: false
    hint_ladder:
    - Think about what the cache actually stores and how the service looks it up.
    - What artefacts change when you deploy new code?
