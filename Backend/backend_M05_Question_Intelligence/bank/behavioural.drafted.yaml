      interviewer to show you’re evaluating the role and company fit?
    modality: verbal
    round_types:
    - behavioural
    difficulty_band: intro
    time_budget_s: 150
    concepts:
    - id: concept:closing_questions
      weight: 0.7
    - id: concept:active_listening
      weight: 0.15
    reference_answer: A good closing question could be, “I’m excited about the work you described on the
      new AI platform. Could you share what the team’s top priorities are for the next six months and
      how success will be measured?” This shows the candidate listened, links to something discussed,
      and gauges whether the role’s challenges match their aspirations. It also signals they’re thinking
      ahead about impact and fit.
    key_points:
    - id: kp_1
      statement: Mentions asking about the team’s current priorities or upcoming projects, showing interest
        in immediate impact.
      required: true
    - id: kp_2
      statement: References a specific aspect of the company culture or growth trajectory that the candidate
        discovered during the interview.
      required: true
    - id: kp_3
      statement: Explains how the answer would help the candidate decide whether the role aligns with
        their career goals.
      required: false
    hint_ladder:
    - Tie the question to something the interviewer just mentioned.
    - Focus on future work, metrics, or culture rather than salary.
