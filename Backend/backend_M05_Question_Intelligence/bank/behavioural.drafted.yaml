  closing_questions__q2:
    stem: Imagine the interview is wrapping up and you have a chance to ask a question that reveals how
      the company supports employee growth. What would you ask and why?
    modality: verbal
    round_types:
    - behavioural
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:closing_questions
      weight: 0.7
    - id: concept:clarifying_questions
      weight: 0.15
    reference_answer: I’d ask, “Can you tell me how engineers typically advance here – for example, are
      there formal mentorship programs or tuition-reimbursement for certifications?” I’m asking because
      I want a role where I can keep sharpening my skills and eventually take on more responsibility.
      Understanding the growth path helps me see if the company’s trajectory aligns with my five-year
      plan.
    key_points:
    - id: kp_1
      statement: Proposes a question about mentorship, learning resources, or career progression paths.
      required: true
    - id: kp_2
      statement: Explains why knowing about growth opportunities matters to the candidate’s long-term
        plans.
      required: true
    - id: kp_3
      statement: Shows the candidate is evaluating fit beyond the immediate role.
      required: false
    hint_ladder:
    - Think of a question that uncovers support structures like training or promotion cycles.
    - Mention the candidate’s own career objectives briefly.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
