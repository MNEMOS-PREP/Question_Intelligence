      weight: 0.7
    - id: concept:thinking_aloud
      weight: 0.15
    - id: concept:answer_structuring
      weight: 0.15
    reference_answer: I would first acknowledge that I haven’t worked with that exact technology, saying
      something like, “I’m not familiar with X, but I can walk through how I’d approach it.” Then I’d
      think aloud, breaking the problem into pieces I do know—like the input, constraints, and possible
      algorithms. I’d ask a clarifying question if something is ambiguous, and outline a concrete next
      step, such as sketching a pseudo-code or researching the API after the interview. Finally, I’d summarise
      my proposed approach and note what I’d validate next, showing I can handle uncertainty with a structured
      plan.
    key_points:
    - id: kp_1
      statement: Starts by briefly acknowledging the gap (“I’m not familiar with that exact scenario”)
        and expresses willingness to explore.
      required: true
    - id: kp_2
      statement: Uses thinking-aloud to break the problem into known components, showing logical reasoning.
      required: true
    - id: kp_3
