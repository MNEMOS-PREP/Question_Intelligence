  thinking_aloud__q1:
    stem: Tell me about a time you had to solve a technical problem while thinking aloud with a teammate;
      what was your approach and how did you keep the conversation productive?
    modality: verbal
    round_types:
    - behavioural
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:thinking_aloud
      weight: 0.7
    - id: concept:active_listening
      weight: 0.15
    - id: concept:answer_structuring
      weight: 0.15
    reference_answer: In my internship I was debugging a memory leak in a microservice while paired with
      a senior engineer. I started by stating the symptom, then walked through the code path I was inspecting,
      vocalising each hypothesis—"maybe the connection pool isn’t closed"—and asked, "Does that align
      with what you saw in the logs?" He confirmed and added his observation about a recent config change.
      I paused after each step to let him interject, and when he suggested an alternative, I paraphrased
      his point to show I was listening. Together we identified an unclosed file handle, fixed it, and
      the service’s memory usage dropped by 30 %. The whole session lasted 20 minutes and demonstrated
      how thinking aloud, combined with active listening, keeps problem-solving efficient.
