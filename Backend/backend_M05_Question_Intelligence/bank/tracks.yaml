# =============================================================================
#  INTERVIEW TRACKS — what a student can pick (2026-10-07)
#
#  One per round type. Which tracks EXIST is not decided here: `GET
#  /v1/bank/tracks` offers a round type only when the bank holds items for it,
#  so a track nobody has written questions for is never offered. This file
#  only says what each one is called and how it is grouped on the setup page,
#  and — `kind`, technical unless it says otherwise — which kind of
#  interviewer runs it.
#  No `items:` key, so the bank loader reads nothing from it.
# =============================================================================

groups: [Core CS, Software engineering, Data, AI and ML, Infrastructure and security, Business and aptitude, HR]

tracks:
  dsa_verbal:
    title: Data structures and algorithms
    group: Core CS
    blurb: Arrays to graphs, out loud — why it works, what it costs, when it breaks.
  os_verbal:
    title: Operating systems
    group: Core CS
    blurb: Processes and threads, scheduling, memory, synchronisation, deadlocks.
  dbms_verbal:
    title: Databases (DBMS and SQL)
    group: Core CS
    blurb: Keys and normal forms, indexes, transactions, joins and query plans.
  cn_verbal:
    title: Computer networks
    group: Core CS
    blurb: The layers, TCP and UDP, DNS, HTTP, routing and congestion.
  oop_verbal:
    title: OOP and language fundamentals
    group: Core CS
    blurb: Classes and interfaces, polymorphism, memory and exceptions, design patterns.
  systems_verbal:
    title: Computer systems and practice
    group: Core CS
    blurb: Compilers, caches and the machine underneath, and engineering habits.
  ml_verbal:
    title: Machine learning
    group: AI and ML
    blurb: Framing a problem, metrics, overfitting, and the classic models' trade-offs.
  dl_verbal:
    title: Deep learning
    group: AI and ML
    blurb: Networks and backprop, CNNs, sequence models, transformers and LLMs.
  behavioural:
    title: HR and behavioural
    group: HR
    # Who runs it: M06 seats an HR interviewer for a behavioural part.
    kind: behavioural
    blurb: Your own experiences, told with a situation, what you did, and the result.

  # 2026-11-12: the tracks career goals need (M22, Follow Your Goal). Each is
  # an area an interviewer would name; M22's role catalogue mixes them.
  frontend_verbal:
    title: Frontend engineering
    group: Software engineering
    blurb: The browser, JavaScript, a framework, state, performance and accessibility.
  backend_verbal:
    title: Backend engineering
    group: Software engineering
    blurb: APIs, authentication, caching, queues, services and the frameworks behind them.
  system_design_verbal:
    title: System design
    group: Software engineering
    blurb: Scale, replication and sharding, consistency, reliability, and designing a system end to end.
  languages_verbal:
    title: Programming languages
    group: Software engineering
    blurb: Python, Java, JavaScript, TypeScript, C, C++, Go and C# — the language itself, in depth.
  mobile_verbal:
    title: Mobile development
    group: Software engineering
    blurb: App lifecycle, Android, iOS and cross-platform apps that survive a bad network.
  testing_verbal:
    title: Testing and QA
    group: Software engineering
    blurb: Test design, automation, API and performance testing, and finding the bug first.
  data_eng_verbal:
    title: Data engineering
    group: Data
    blurb: Pipelines, warehouses, Spark, streaming, orchestration and data quality.
  analytics_verbal:
    title: Analytics and statistics
    group: Data
    blurb: Statistics, experiments, SQL for analysis, spreadsheets and dashboards.
  ai_apps_verbal:
    title: Applied AI and LLMs
    group: AI and ML
    blurb: RAG, prompting, agents, fine-tuning and evaluation, vision and NLP, and models in production.
  devops_verbal:
    title: DevOps and cloud
    group: Infrastructure and security
    blurb: Linux, containers, Kubernetes, CI/CD, observability and the cloud.
  security_verbal:
    title: Cybersecurity
    group: Infrastructure and security
    blurb: Cryptography, web security, secure code, incidents and offensive testing.
  embedded_verbal:
    title: Embedded and hardware
    group: Infrastructure and security
    blurb: Microcontrollers, RTOS, protocols, digital design, signals, control and robotics.
  product_verbal:
    title: Product, design and business
    group: Business and aptitude
    blurb: Product sense, metrics, UX, requirements, cases and talking to clients.
  aptitude_verbal:
    title: Aptitude and reasoning
    group: Business and aptitude
    blurb: Quantitative and logical reasoning and estimation, reasoned out loud.
