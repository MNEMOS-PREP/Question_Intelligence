  gx_topo_intro:
    c: [topological_sort]
    d: intro
    t: conceptual
    f: "ordering with dependencies"
    q: "What is a topological order of tasks, and why can't you find one when the dependencies contain a cycle?"
    a: "A topological order lists tasks so that every task comes after all the tasks it depends on, like taking prerequisite courses before advanced ones. One way to build it: repeatedly pick a task with no remaining prerequisites, output it, and remove its outgoing edges. If the dependencies form a cycle, for example A needs B, B needs C and C needs A, then no task in the cycle ever has zero prerequisites, so the process gets stuck before outputting every task. That stuck state is how you detect the cycle."
    k: ["!Defines a topological order as each task after all its dependencies", "Describes repeatedly removing a task with no remaining prerequisites", "!Explains that tasks in a cycle never become free", "Says getting stuck detects the cycle"]
    h: ["In a cycle, which task could go first?"]
    fu: ["Several tasks have no prerequisites at the same moment. Does it matter which you pick?", "How would you tell the user which tasks form the cycle?"]
    m: "Any graph can be ordered topologically if you start from the right node."
    s: ["Uses a concrete prerequisite example", "Explains cycle detection"]

  gx_shortest_intro:
    c: [shortest_paths]
    d: intro
    t: conceptual
    f: "choosing a shortest path algorithm"
    q: "When do you use BFS, Dijkstra's algorithm or Bellman-Ford to find shortest paths?"
    a: "BFS finds shortest paths when every edge has the same cost, because it explores in layers of distance; it is O(V plus E). Dijkstra's algorithm handles different non-negative edge weights by always settling the closest unsettled vertex, using a priority queue, O(E log V). It fails with negative weights, because a later negative edge could make a settled distance smaller. Bellman-Ford handles negative weights by relaxing every edge V minus 1 times, O(V times E), and can detect a negative cycle when another round still improves something."
    k: ["!Says BFS suits graphs where all edges have equal cost", "!Says Dijkstra handles non-negative weights with a priority queue", "!Says Bellman-Ford handles negative weights and detects negative cycles", "States approximate costs of each"]
    h: ["What changes when the roads have different lengths?"]
    fu: ["Edge weights are only 0 or 1. Is there something faster than Dijkstra?", "Why exactly does a negative edge break Dijkstra's settled distances?"]
    m: "Dijkstra's algorithm works for any graph, including negative edges."
    s: ["Matches each algorithm to its condition", "Explains the negative-edge failure"]

  gx_mst_intro:
    c: [minimum_spanning_tree]
    d: intro
    t: conceptual
    f: "what a spanning tree is"
    q: "A company must lay cable to connect all its offices at the lowest total cost. Why is this a minimum spanning tree problem, and how would Kruskal's algorithm solve it?"
    a: "A spanning tree connects all vertices with no cycles, using exactly V minus 1 edges; any cycle would include a redundant cable. The minimum spanning tree is the one with the lowest total weight, which is exactly the cheapest way to connect every office. Kruskal's algorithm sorts all possible cables by cost and adds them cheapest first, skipping any cable that would connect two offices already connected, which would form a cycle. A union-find structure checks that quickly. Sorting dominates, so it costs O(E log E)."
    k: ["!Defines a spanning tree as connecting all vertices without cycles", "Says a cycle would mean a redundant connection", "!Describes Kruskal adding the cheapest edges that do not form a cycle", "Mentions union-find for the cycle check"]
    h: ["Why would a cheapest network never contain a loop?"]
    fu: ["The cheapest network is not unique. When can that happen?", "Is the minimum spanning tree also the shortest path between every pair of offices?"]
    m: "The minimum spanning tree gives the shortest path between any two offices."
    s: ["Explains why cycles are wasteful", "Distinguishes MST from shortest paths"]

  gx_union_find_intro:
    c: [union_find]
    d: intro
    t: conceptual
    f: "disjoint sets"
    q: "What problem does a union-find structure solve, and what are its two operations?"
    a: "It keeps track of elements split into groups that only ever merge, such as which computers are connected after cables are added. Find returns a representative of the element's group, so two elements are in the same group when their representatives are equal. Union merges two groups by linking one representative under the other. Internally each element points to a parent, and the root is the representative. With union by rank and path compression, which flattens the paths found along the way, both operations run in nearly constant amortised time."
    k: ["!Says it tracks groups that merge, answering whether two elements are in the same group", "!Names find and union and what each does", "Describes parent pointers with the root as representative", "Mentions union by rank and path compression for near-constant time"]
    h: ["How would you check whether two computers are already connected?"]
    fu: ["Groups also need to split apart sometimes. Does union-find still fit?", "You also need to know how many computers are in each network at any time. What extra field would you keep?"]
    m: "Union-find stores the full list of members for every group and searches it."
    s: ["Uses a concrete connectivity example", "Knows the two optimisations"]

  gx_scc_intro:
    c: [strongly_connected_components]
    d: intro
    t: conceptual
    f: "mutual reachability"
    q: "What is a strongly connected component in a directed graph, and why would a social or web graph care about them?"
    a: "A strongly connected component is a maximal set of vertices where every vertex can reach every other one by following edge directions. In a follower graph it is a group where influence can travel around in both directions; in the web graph it is a cluster of pages that all link to each other through some path. Collapsing each component into a single node turns any directed graph into a directed acyclic graph, which makes problems like ordering or reachability easier. Kosaraju's or Tarjan's algorithm finds all components in O(V plus E)."
    k: ["!Defines it as a maximal set where every vertex reaches every other along directed edges", "Gives a meaningful real-world interpretation", "!Says collapsing components gives a directed acyclic graph", "Names Kosaraju or Tarjan with linear time"]
    h: ["Can every page in the set reach every other page?"]
    fu: ["Two components exist, and one edge is added between them in each direction. What happens?", "Why is the condensed graph always free of cycles?"]
    m: "Any two connected vertices are in the same strongly connected component."
    s: ["Explains the condensation into a DAG", "Gives a real interpretation"]

  gx_bits_subsets_hard:
    c: [bit_manipulation, combinatorics]
    d: hard
    t: design
    f: "bitmasks as sets"
    q: "You must try every subset of 20 tasks to find the best team assignment. How can an integer's bits represent a subset, and what does iterating over all of them cost?"
    a: "Number the tasks 0 to 19 and let bit i of an integer mean task i is chosen, so every integer from 0 to 2 to the power 20 minus 1 is exactly one subset. Looping over that range visits all subsets, about ten lakh of them. Checking whether task i is in a mask is mask AND 1 shifted left by i, adding it is OR, and the number of tasks is the popcount. If each subset needs O(n) work, the total is about 2 crore operations, fine for 20 tasks but impossible near 40. Bitmask dynamic programming over subsets reuses results between masks."
    k: ["!Maps each task to a bit so each integer represents one subset", "!States there are 2 to the power n subsets", "Gives bit operations for membership and adding an element", "Estimates the total cost and its limit around n of 20 to 25"]
    h: ["How many integers fit in 20 bits?"]
    fu: ["How would you loop over only the subsets of a given mask?", "With 40 tasks this is too slow. How could splitting into two halves help?"]
    m: "Using bits makes trying every subset polynomial time."
    s: ["Gives the operations precisely", "Estimates the feasible size"]

  gx_number_theory_sieve_hard:
    c: [number_theory]
    d: hard
    t: optimisation
    f: "smallest prime factor sieve"
    q: "You must factorise up to ten lakh different numbers, each below one crore. How would you make every factorisation fast?"
    a: "Precompute the smallest prime factor of every number up to one crore with a sieve: for each prime p, mark multiples of p, starting at p squared, that do not yet have a smallest factor. With that array, factorising any n is just repeated division by its smallest prime factor, which takes O(log n) steps because each division at least halves n. The sieve costs about O(N log log N) time and O(N) memory, roughly 40 megabytes for one crore integers, acceptable once and then every query is quick. Trial division up to the square root per query would be far slower at this volume."
    k: ["!Precomputes the smallest prime factor for every number up to the limit", "!Factorises by repeatedly dividing by the smallest prime factor in O(log n) steps", "States sieve time and memory cost", "Compares with trial division per query"]
    h: ["What if you already knew each number's smallest prime factor?"]
    fu: ["Memory is limited to a few megabytes. What would you give up?", "Numbers now go up to ten to the power twelve. What changes?"]
    m: "Factorising each number by trial division is fast enough at any volume."
    s: ["Estimates memory concretely", "Explains why factorisation is logarithmic"]

  gx_modular_intro:
    c: [modular_arithmetic]
    d: intro
    t: conceptual
    f: "why answers are given modulo a prime"
    q: "Many coding problems ask for the answer modulo ten to the power nine plus seven. Why, and which operations can you safely do under that modulus?"
    a: "The true answers, such as counts of arrangements, grow far beyond what 64-bit integers can hold, so the problem asks for the remainder to keep numbers small and comparable. Addition, subtraction and multiplication can be reduced at every step: the remainder of a sum or product equals the remainder of the remainders, as long as each intermediate product fits, which is why the modulus is chosen below about two to the power 30. Subtraction needs adding the modulus back to avoid negatives. Division is not direct; you multiply by a modular inverse, which exists because the modulus is prime."
    k: ["!Explains the modulus keeps huge results within integer range", "!Says addition and multiplication can be reduced at every step", "Mentions fixing negative results after subtraction", "!Says division needs a modular inverse, which exists because the modulus is prime"]
    h: ["What happens to a 64-bit integer if you compute 30 factorial?"]
    fu: ["Two numbers below the modulus are multiplied in a 32-bit integer. What goes wrong?", "The modulus is no longer prime. What happens to division?"]
    m: "You can divide under a modulus exactly like ordinary numbers."
    s: ["Explains why intermediate products must fit", "Handles subtraction and division correctly"]

  gx_combinatorics_intro:
    c: [combinatorics]
    d: intro
    t: conceptual
    f: "permutations versus combinations"
    q: "What is the difference between permutations and combinations? Use choosing a team versus arranging a podium as your example."
    a: "A combination counts selections where order does not matter, and a permutation counts arrangements where it does. Choosing a team of 3 from 10 people is a combination: 10 choose 3, which is 10 times 9 times 8 divided by 3 factorial, 120 teams. Awarding gold, silver and bronze to 3 of those 10 is a permutation: 10 times 9 times 8, which is 720, because the same three people in different positions count as different outcomes. Each team corresponds to 3 factorial, or 6, podiums, which is why the counts differ by that factor."
    k: ["!Says combinations ignore order and permutations count it", "!Computes 10 choose 3 as 120 and the ordered count as 720", "Explains the counts differ by the number of orderings of the chosen people"]
    h: ["Is gold-silver-bronze the same outcome as bronze-silver-gold?"]
    fu: ["The same person can win more than one medal. How does the count change?", "Two of the ten people refuse to be on the same team. How would you count teams now?"]
    m: "Permutations and combinations give the same number when you pick the same people."
    s: ["Computes both correctly", "Explains the 3 factorial relationship"]
