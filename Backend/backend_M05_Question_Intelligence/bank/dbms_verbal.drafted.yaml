  query_optimisation__q2:
    stem: During a production incident you run EXPLAIN ANALYZE on a slow report query and see a ‘Sort’
      operation costing 70% of total time. What options does the optimizer have to avoid this sort, and
      what trade-offs do they involve?
    modality: verbal
    round_types:
    - dbms_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:query_optimisation
      weight: 0.7
    - id: concept:aggregation_and_grouping
      weight: 0.15
    - id: concept:indexing
      weight: 0.15
    reference_answer: When the plan shows a Sort taking most of the cost, the optimizer could have chosen
      an index that matches the ORDER BY clause, turning the sort into an index-ordered scan, which saves
      time but requires the index to exist and stay up-to-date. Alternatively, it could replace the sort-based
      aggregation with a hash aggregate; this avoids ordering but needs enough work_mem and may produce
      nondeterministic row order. Parallel sorting is another option – it speeds up the operation but
      consumes extra CPU cores and may increase contention. Finally, redesigning the query to read from
      a materialized view that stores pre-sorted or pre-aggregated results eliminates the sort altogether,
      trading storage and data latency for query speed.
    key_points:
    - id: kp_1
      statement: The optimizer can use an index that already provides the required order, eliminating
        the explicit sort.
      required: true
    - id: kp_2
      statement: It may rewrite the query to use a GROUP BY with a hash aggregate, which avoids sorting
        but uses more memory.
      required: true
    - id: kp_3
      statement: Enabling parallelism can speed up the sort but increases CPU usage and may affect other
        workloads.
      required: false
    - id: kp_4
      statement: Forcing a materialized view or pre-aggregated table removes the sort entirely at the
        cost of storage and freshness.
      required: false
    hint_ladder:
    - What physical operators can produce ordered output without an explicit sort?
    - Consider memory-intensive alternatives to sorting.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  transactions_acid__q1:
    stem: A client reports that after a power outage their banking application showed duplicate debit
      entries for a single transaction; what could have gone wrong in the transaction processing?
    modality: verbal
    round_types:
    - dbms_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:transactions_acid
      weight: 0.7
    - id: concept:isolation_levels
      weight: 0.15
    - id: concept:concurrency_control
      weight: 0.15
    reference_answer: The most likely culprit is a breach of atomicity during recovery. When the power
      went out, the transaction may have been in the commit phase but not yet flushed to stable storage.
      After restart, the recovery manager replayed the log entry, thinking the commit hadn't happened,
      and then applied the transaction again, resulting in two debit rows. Proper durability ensures the
      commit record is persisted before acknowledging success, and atomicity guarantees the whole transaction
      is either fully applied or not at all. A robust redo/undo mechanism with idempotent writes prevents
      such duplicate entries.
    key_points:
    - id: kp_1
      statement: The loss of atomicity caused a partially completed transaction to be written twice.
      required: true
    - id: kp_2
      statement: Durability guarantees that once a commit is recorded, the change survives crashes.
      required: true
    - id: kp_3
      statement: If the system performed a redo without proper idempotence, it could replay the same commit,
        leading to duplication.
      required: false
    - id: kp_4
      statement: Isolation levels do not directly cause duplicate commits, but a mis-configured recovery
        routine can bypass them.
      required: false
    hint_ladder:
    - Think about what guarantees ACID provides when a failure occurs.
    - Consider which ACID property ensures the system can recover to a consistent state.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  transactions_acid__q2:
    stem: During a high-traffic sale you notice the total sales amount occasionally differs from the sum
      of individual order totals; which ACID property is being violated and why?
    modality: verbal
    round_types:
    - dbms_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:transactions_acid
      weight: 0.7
    - id: concept:isolation_levels
      weight: 0.15
    reference_answer: The discrepancy points to a breach of isolation. While each order transaction may
      be atomic, concurrent sessions reading the orders table can see rows that are only partially committed
      or miss rows that are about to be committed, leading to non-repeatable reads or phantom rows in
      the aggregate query. As a result, the total sales figure can be out of sync with the sum of individual
      orders. Raising the isolation level to serializable (or using explicit locking around the aggregation)
      ensures that the total is calculated on a consistent snapshot, eliminating the mismatch.
    key_points:
    - id: kp_1
      statement: The isolation property is being violated, allowing non-repeatable reads or phantom reads.
      required: true
    - id: kp_2
      statement: Concurrent updates to the orders table can interleave, causing the aggregate query to
        see a partially committed state.
      required: false
    - id: kp_3
      statement: Ensuring a serializable isolation level would make the aggregate reflect a consistent
        snapshot.
      required: true
    - id: kp_4
      statement: Atomicity guarantees each individual order is fully recorded, but does not protect the
        consistency of a derived total across transactions.
      required: false
    hint_ladder:
    - Focus on how concurrent transactions interact with each other.
    - Recall which ACID facet prevents intermediate states from being visible.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  concurrency_control__q1:
    stem: In a high-traffic e-commerce site, you notice occasional deadlocks causing order failures. Explain
      why deadlocks occur under Two-Phase Locking and how you would detect and resolve them without stopping
      the system.
    modality: verbal
    round_types:
    - dbms_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:concurrency_control
      weight: 0.7
    - id: concept:isolation_levels
      weight: 0.15
    - id: concept:concurrency_synchronisation
      weight: 0.15
    reference_answer: Deadlocks arise when two or more transactions each hold a lock the other needs,
      forming a cycle in the wait-for graph. With Strict Two-Phase Locking every transaction keeps its
      exclusive locks until it commits, so if T1 locks row A and then requests row B while T2 already
      holds B and asks for A, they wait forever. The lock manager can periodically build a wait-for graph
      from the lock table; a cycle indicates a deadlock. The usual remedy is to pick a victim—often the
      youngest or the one that has done the least work—abort it, roll back its changes, and release its
      locks, letting the other transaction proceed. Some systems also use timeout-based detection as a
      lightweight fallback.
    key_points:
    - id: kp_1
      statement: Deadlocks happen when two transactions hold locks the other needs, creating a cyclic
        wait.
      required: true
    - id: kp_2
      statement: Under Strict 2PL each transaction holds exclusive locks until commit, which can form
        cycles.
      required: true
    - id: kp_3
      statement: Detection can be done via a wait-for graph built from lock manager data.
      required: false
    - id: kp_4
      statement: Resolution typically aborts the youngest transaction (or the one with least work) and
        releases its locks.
      required: false
    hint_ladder:
    - Think about the lock acquisition order and what the lock manager can observe.
    - What practical metric helps choose which transaction to abort?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  concurrency_control__q2:
    stem: Your database uses MVCC for reads. A client reports that a long-running report sees stale data
      even after a recent commit. What guarantees does MVCC give, why might the report be stale, and how
      can you adjust isolation to avoid this?
    modality: verbal
    round_types:
    - dbms_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:concurrency_control
      weight: 0.7
    - id: concept:isolation_levels
      weight: 0.15
    reference_answer: 'MVCC gives snapshot isolation, meaning a transaction works on a version of the
      data that existed when it began. If a reporting query starts a few minutes before another transaction
      commits new order rows, the report continues to read the older snapshot, so it appears stale even
      though the data is now committed. To see the fresh data you either need to restart the report after
      the commit or raise the isolation level: READ-COMMITTED will fetch the latest committed version
      for each statement, while SERIALIZABLE or a true read-your-writes mode forces the transaction to
      see all prior commits. Adjusting the client to begin a new transaction after the update or using
      a newer snapshot resolves the issue.'
    key_points:
    - id: kp_1
      statement: 'MVCC provides snapshot isolation: each transaction sees the database state as of its
        start timestamp.'
      required: true
    - id: kp_2
      statement: A long-running report started before the committing transaction will continue to see
        the older snapshot, appearing stale.
      required: true
    - id: kp_3
      statement: Switching to a stricter isolation level such as REPEATABLE READ with read-committed semantics,
        or restarting the report after the commit, eliminates the staleness.
      required: false
    - id: kp_4
      statement: Alternatively, using a ‘read-your-writes’ or SERIALIZABLE level forces the report to
        see the latest committed version.
      required: false
    hint_ladder:
    - Recall what MVCC’s snapshot is tied to – transaction start time.
    - Which isolation level discards the snapshot on each statement?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  isolation_levels__q1:
    stem: In a high-traffic e-commerce site, a user reports that after adding an item to the cart, the
      same item sometimes disappears when they view the cart again. What isolation level issue could cause
      this, and why?
    modality: verbal
    round_types:
    - dbms_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:isolation_levels
      weight: 0.7
    - id: concept:concurrency_control
      weight: 0.15
    reference_answer: The symptom points to a non-repeatable read. Under READ COMMITTED each SELECT sees
      only committed data, but it does not lock the rows for the duration of the transaction. So a second
      SELECT on the cart can see a change made by another transaction that added or removed the item after
      the first read, making the item appear to disappear. Using REPEATABLE READ would hold shared locks
      on the rows read, guaranteeing that the same rows return the same values throughout the transaction,
      eliminating this issue. If new rows could appear (phantoms), SNAPSHOT ISOLATION would be needed.
    key_points:
    - id: kp_1
      statement: The problem is likely a non-repeatable read caused by using READ COMMITTED.
      required: true
    - id: kp_2
      statement: Another concurrent transaction committed a change to the cart row after the first read,
        so the second read sees a different value.
      required: true
    - id: kp_3
      statement: Upgrading to REPEATABLE READ would prevent the item from disappearing in the same session.
      required: false
    - id: kp_4
      statement: If phantom rows are involved (new rows inserted), SNAPSHOT ISOLATION would also help.
      required: false
    hint_ladder:
    - Think about a transaction that reads a row and another that modifies it.
    - Consider what guarantees the isolation level provides for repeat reads.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  isolation_levels__q2:
    stem: During a nightly batch job you notice that some rows are being double-counted in a summary report,
      even though the query uses SUM. Which isolation level behavior explains this, and what trade-off
      does fixing it involve?
    modality: verbal
    round_types:
    - dbms_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:isolation_levels
      weight: 0.7
    - id: concept:transactions_acid
      weight: 0.15
    - id: concept:aggregation_and_grouping
      weight: 0.15
    reference_answer: The issue is a phantom read. The batch job runs a SUM over a set of rows while another
      transaction is inserting new rows into the same range. Under REPEATABLE READ or READ COMMITTED the
      aggregator can read the range, then the insert becomes visible, and the aggregator may read the
      range again or the optimizer may scan twice, causing the new rows to be added twice. SERIALIZABLE
      isolation locks the whole range, preventing any inserts until the transaction completes, thus eliminating
      the phantom. However, this stricter level reduces concurrency and can increase lock contention,
      potentially extending the batch runtime.
    key_points:
    - id: kp_1
      statement: The double-counting arises from a phantom read occurring under REPEATABLE READ or READ
        COMMITTED.
      required: true
    - id: kp_2
      statement: Another concurrent transaction inserts new detail rows that become visible to the aggregation
        after it has already read a partial set, causing the same rows to be summed twice.
      required: true
    - id: kp_3
      statement: Switching to SERIALIZABLE prevents phantoms by locking the range, ensuring the aggregation
        sees a stable set.
      required: false
    - id: kp_4
      statement: The trade-off is reduced concurrency and higher locking overhead, which may lengthen
        the batch window.
      required: true
    hint_ladder:
    - Think about a transaction that inserts rows while another transaction aggregates them.
    - What does SERIALIZABLE guarantee versus REPEATABLE READ?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  nosql_vs_relational__q1:
    stem: Your team is building a real-time analytics dashboard that must ingest millions of events per
      second and serve low-latency queries; would you choose a document store or a relational DB, and
      why?
    modality: verbal
    round_types:
    - dbms_verbal
    difficulty_band: hard
    time_budget_s: 180
    concepts:
    - id: concept:nosql_vs_relational
      weight: 0.7
    - id: concept:aggregation_and_grouping
      weight: 0.15
    - id: concept:indexing
      weight: 0.15
    reference_answer: For a high-throughput, low-latency analytics pipeline I would pick a document-oriented
      NoSQL store such as MongoDB or Couchbase. These databases shard data horizontally, letting us scale
      writes across many nodes and keep insertion latency sub-millisecond. They also support flexible
      schemas, so each event can carry different fields without costly ALTER TABLE operations. Indexes
      can be built on the most-queried attributes, and built-in aggregation pipelines let us compute rolling
      counts or histograms without joining tables. A relational DB would struggle with the write volume
      and schema evolution, unless we heavily partition and tune, which adds operational complexity. Hence
      the document store better matches the CAP trade-off of high availability and partition tolerance
      needed for continuous ingestion.
    key_points:
    - id: kp_1
      statement: Highlights horizontal sharding and write scalability of document stores.
      required: true
    - id: kp_2
      statement: Mentions flexible schema handling for evolving event payloads.
      required: true
    - id: kp_3
      statement: Notes built-in aggregation pipelines and indexing for low-latency queries.
      required: false
    - id: kp_4
      statement: Explains why a relational DB would need heavy partitioning and be operationally more
        complex.
      required: false
    hint_ladder:
    - Think about write volume, schema flexibility, and the CAP theorem.
    - Consider built-in aggregation features versus SQL GROUP BY.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  nosql_vs_relational__q2:
    stem: In a microservice that stores user sessions, you notice occasional stale reads after a node
      failure; what consistency model is the key-value store providing, and how could you adjust it to
      guarantee fresh reads?
    modality: verbal
    round_types:
    - dbms_verbal
    difficulty_band: hard
    time_budget_s: 180
    concepts:
    - id: concept:nosql_vs_relational
      weight: 0.7
    - id: concept:transactions_acid
      weight: 0.15
    - id: concept:isolation_levels
      weight: 0.15
    reference_answer: The stale reads indicate the key-value store is operating under eventual consistency
      – after a partition or node failure, replicas diverge and reads may return older values until replication
      catches up. To guarantee fresh reads you can switch to a strong consistency mode, such as read-your-writes
      or linearizable reads, by directing reads to the primary replica or using quorum reads (R + W >
      N). This may increase latency but ensures the session data is up-to-date. Alternatively, you could
      enable write-through caching with version stamps and perform a read-repair on miss. The trade-off
      is moving from high availability toward consistency in the CAP triangle.
    key_points:
    - id: kp_1
      statement: Identifies eventual consistency as the default model causing stale reads.
      required: true
    - id: kp_2
      statement: Proposes quorum reads or primary-only reads to achieve strong consistency.
      required: true
    - id: kp_3
      statement: Mentions the CAP trade-off of sacrificing availability/latency for consistency.
      required: false
    - id: kp_4
      statement: Suggests read-repair or version stamping as additional mechanisms.
      required: false
    hint_ladder:
    - Recall the CAP theorem axes for a key-value store.
    - What read/write quorum settings give you linearizability?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
