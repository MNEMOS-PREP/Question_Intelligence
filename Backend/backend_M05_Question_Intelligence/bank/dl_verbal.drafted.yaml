items:
  neural_network_basics__q1:
    stem: In a multilayer perceptron, why do we place a non-linear activation after each linear layer
      instead of stacking many linear layers alone?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:neural_network_basics
      weight: 0.7
    - id: concept:backpropagation
      weight: 0.15
    reference_answer: If you stack several linear layers without any non-linearity, the whole network
      is still just a single linear map because matrix multiplication is associative; you can multiply
      all weight matrices together into one. That means the model can only represent linear relationships,
      no matter how deep it is. By inserting a non-linear activation—ReLU, sigmoid, tanh—after each linear
      transform, the composition becomes a piecewise-non-linear function, dramatically expanding the hypothesis
      space. This allows the network to learn complex patterns such as decision boundaries that are curved.
      Moreover, activations introduce gradient variation that prevents all neurons from receiving identical
      updates, which is essential for effective back-propagation.
    key_points:
    - id: kp_1
      statement: A stack of only linear layers collapses to a single linear transformation, limiting expressiveness.
      required: true
    - id: kp_2
      statement: Non-linear activations enable the network to approximate complex, non-linear functions.
      required: true
    - id: kp_3
      statement: Activations also break symmetry during weight updates, helping back-propagation to learn
        useful features.
      required: false
    hint_ladder:
    - Think about the function space the network can represent.
    - Consider what happens to gradients when only linear operations are used.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  neural_network_basics__q2:
    stem: You notice the training loss of a small MLP decreasing but the validation loss staying flat.
      What could be happening and how would you address it?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: intro
    time_budget_s: 240
    concepts:
    - id: concept:neural_network_basics
      weight: 0.7
    - id: concept:optimisers
      weight: 0.15
    reference_answer: When the training loss keeps dropping but the validation loss plateaus, the network
      is likely overfitting—learning patterns that exist only in the training set. The validation set,
      which the model hasn't seen, shows no improvement because those patterns don’t generalise. To combat
      this, you can reduce model capacity (fewer hidden units or layers), add regularisation such as L2
      weight decay or dropout, or augment the training data to increase diversity. Early stopping based
      on validation loss is another practical fix. Simply tweaking the optimizer or learning rate won’t
      solve the core issue unless it indirectly reduces over-fitting.
    key_points:
    - id: kp_1
      statement: 'The model is overfitting: it memorises training data while failing to generalise.'
      required: true
    - id: kp_2
      statement: Possible remedies include adding regularisation (L2, dropout), gathering more data, or
        reducing model capacity.
      required: true
    - id: kp_3
      statement: Adjusting the learning rate or optimizer alone does not directly fix a flat validation
        loss.
      required: false
    hint_ladder:
    - Think about the gap between training and validation performance.
    - What regularisation or data-related techniques can close that gap?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  backpropagation__q1:
    stem: During training you notice that after a few epochs the loss plateaus and the gradients for the
      earlier layers become extremely small. What is happening in the backpropagation process, and how
      can you address it?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: hard
    time_budget_s: 180
    concepts:
    - id: concept:backpropagation
      weight: 0.7
    - id: concept:optimisers
      weight: 0.15
    reference_answer: When the loss stops improving and the earlier layers receive near-zero gradients,
      the network is suffering from the vanishing gradient problem. In backpropagation each layer’s gradient
      is the product of the local derivative and the gradient from the next layer; if many of those local
      derivatives are less than one—common with sigmoid or tanh— the product shrinks exponentially as
      it moves backward, leaving the first layers unable to learn. To fix it, you can replace saturating
      activations with ReLU-like functions, add residual or skip connections, use He/Xavier initialization,
      or insert batch-norm layers. These changes keep the gradient magnitude larger, allowing the whole
      network to keep updating effectively.
    key_points:
    - id: kp_1
      statement: The vanishing gradient problem arises because repeated multiplication of derivatives
        (often <1) across many layers shrinks the gradient signal.
      required: true
    - id: kp_2
      statement: Using activation functions with better gradient flow (e.g., ReLU) or employing residual
        connections can mitigate the issue.
      required: true
    - id: kp_3
      statement: Alternative strategies include careful weight initialization, batch normalization, or
        switching to architectures like LSTM/ResNet that preserve gradients.
      required: false
    - id: kp_4
      statement: Adjusting the learning rate alone will not solve vanishing gradients if the chain-rule
        product is near zero.
      required: false
    hint_ladder:
    - Think about how the chain rule propagates error through many layers.
    - What architectural tweaks help preserve gradient magnitude?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  backpropagation__q2:
    stem: Explain why, in a computational graph, backpropagation computes the gradient of the loss with
      respect to each parameter only once, and what would happen if you naïvely recomputed gradients for
      each node separately.
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: hard
    time_budget_s: 180
    concepts:
    - id: concept:backpropagation
      weight: 0.7
    - id: concept:neural_network_basics
      weight: 0.15
    reference_answer: Backpropagation treats the computational graph as a directed acyclic graph and applies
      the chain rule in a reverse topological order. When it reaches a node, it has already computed the
      gradient of the loss with respect to that node’s output, so it can multiply by the local derivative
      and store the result. Because each node’s gradient is saved, any upstream node that depends on it
      can reuse the same value instead of recomputing it. This dynamic-programming approach makes the
      overall cost proportional to the number of edges. If you naïvely recomputed the gradient for every
      parent separately, you would revisit the same sub-graph many times, causing exponential time growth
      and unnecessary memory overhead, which is why backpropagation’s single-pass reuse is essential.
    key_points:
    - id: kp_1
      statement: 'Backpropagation uses dynamic programming: each node stores its local gradient and reuses
        it for all upstream dependencies, ensuring each partial derivative is computed once.'
      required: true
    - id: kp_2
      statement: Re-computing gradients per node would lead to exponential time complexity because the
        same sub-graph would be visited many times.
      required: true
    - id: kp_3
      statement: The reuse of intermediate gradients is what makes the algorithm linear in the number
        of edges of the graph.
      required: false
    - id: kp_4
      statement: Without this reuse, memory usage would also explode due to repeated storage of intermediate
        results.
      required: false
    hint_ladder:
    - Recall the concept of dynamic programming in graph algorithms.
    - Consider the number of times a shared sub-expression would be evaluated without caching.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  optimisers__q1:
    stem: You notice that during training a CNN the loss plateaus after a few epochs when using plain
      SGD, but switching to Adam speeds up convergence. Explain why Adam can overcome this plateau.
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:optimisers
      weight: 0.7
    - id: concept:gradient_descent
      weight: 0.15
    - id: concept:training_deep_networks
      weight: 0.15
    reference_answer: Adam combines momentum and RMS-prop ideas. It keeps an exponential moving average
      of the gradients (first moment) and of the squared gradients (second moment). By dividing the momentum-corrected
      gradient by the square-root of the corrected second moment, each weight gets its own adaptive step
      size. Early in training the bias-correction terms make these estimates reliable, so parameters with
      tiny gradients receive larger updates, while those with large gradients are dampened. This adaptive
      scaling lets Adam escape flat regions where plain SGD, with a single global learning rate, would
      stall, thus accelerating convergence on the CNN.
    key_points:
    - id: kp_1
      statement: Adam adapts individual learning rates per parameter using first-moment (mean) and second-moment
        (uncentered variance) estimates.
      required: true
    - id: kp_2
      statement: The momentum-like term helps smooth noisy gradients, allowing the optimizer to move through
        shallow regions where SGD may get stuck.
      required: true
    - id: kp_3
      statement: Bias-correction terms prevent the moments from being biased toward zero in early steps,
        giving a more accurate step size early on.
      required: false
    - id: kp_4
      statement: Adam’s effective learning rate can be larger for parameters with small gradients, preventing
        the plateau caused by uniformly small updates in SGD.
      required: true
    hint_ladder:
    - Think about how Adam modifies the learning rate per parameter.
    - Recall the role of momentum and the variance estimate.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  optimisers__q2:
    stem: In a production LLM service you observe sudden spikes in validation loss after a recent deployment,
      even though training loss remains low. What optimizer-related issues could cause this, and how would
      you debug them?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:optimisers
      weight: 0.7
    - id: concept:large_language_models
      weight: 0.15
    - id: concept:ml_deployment_and_monitoring
      weight: 0.15
    reference_answer: Two common optimizer-related culprits are a bad learning-rate schedule and stale
      optimizer state. If the warm-up or decay schedule was changed or omitted during the last deployment,
      the model may take too large steps on new data, causing the validation loss to jump while training
      loss stays low because the model still fits the recent minibatches. Likewise, Adam stores momentum
      and variance buffers; re-using a checkpoint without resetting these buffers can give incorrect adaptive
      steps, especially after a domain shift. To debug, I would first verify the learning-rate schedule
      used at inference time, then reload the checkpoint with fresh optimizer state or explicitly zero-out
      the moments, and finally plot gradient norms and effective learning rates on a validation batch
      to confirm the fix.
    key_points:
    - id: kp_1
      statement: A mismatched learning-rate schedule (e.g., forgetting to reset or using a too-high warm-up)
        can cause over-fitting to recent mini-batches, inflating validation loss.
      required: true
    - id: kp_2
      statement: Stateful optimizers like Adam retain moment estimates; if the optimizer state is inadvertently
        reused across fine-tuning runs, stale moments can lead to inappropriate step sizes.
      required: true
    - id: kp_3
      statement: Checking the optimizer checkpoint for correct hyper-parameters and re-initialising moments
        if needed is a primary debugging step.
      required: false
    - id: kp_4
      statement: Monitoring gradient norms and learning-rate values during inference can reveal if the
        optimizer is still being applied inadvertently.
      required: false
    hint_ladder:
    - Consider what parts of Adam persist beyond a single epoch.
    - Think about how learning-rate schedules are handled during fine-tuning vs. inference.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  training_deep_networks__q1:
    stem: In a deep CNN you notice training loss decreasing but validation loss starts increasing after
      a few epochs; what mechanisms can you employ to diagnose and mitigate this behavior?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: hard
    time_budget_s: 180
    concepts:
    - id: concept:training_deep_networks
      weight: 0.7
    - id: concept:optimisers
      weight: 0.15
    - id: concept:regularisation
      weight: 0.15
    reference_answer: 'When validation loss climbs while training loss still falls, the model is overfitting
      the training set. The first step is to stop training early—track validation loss and halt when it
      stops improving. Next, increase regularisation: add dropout layers to randomly deactivate neurons,
      or apply L2 weight decay to penalise large weights. Reducing model capacity, such as fewer filters
      or layers, also helps. Finally, check training dynamics: batch normalization can keep activations
      in a stable range and prevent hidden exploding or vanishing gradients, and proper weight initialization
      ensures gradients start in a useful scale. Together these steps curb overfitting and stabilise learning.'
    key_points:
    - id: kp_1
      statement: Identifies overfitting as the primary cause of rising validation loss while training
        loss continues to drop.
      required: true
    - id: kp_2
      statement: Mentions early stopping to halt training when validation loss stops improving.
      required: true
    - id: kp_3
      statement: Suggests adding regularisation such as dropout or weight decay to reduce model capacity.
      required: false
    - id: kp_4
      statement: Recommends monitoring gradient norms or using batch normalization to stabilise training
        and avoid hidden exploding/vanishing gradients.
      required: false
    hint_ladder:
    - Think about what the gap between training and validation indicates.
    - Consider both model capacity and training dynamics.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  training_deep_networks__q2:
    stem: During back-propagation you observe that gradients in the early layers are near zero while later
      layers have large updates; explain why this happens and what initialization or architectural tricks
      can alleviate it.
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:training_deep_networks
      weight: 0.7
    - id: concept:backpropagation
      weight: 0.15
    - id: concept:optimisers
      weight: 0.15
    reference_answer: 'The phenomenon arises because each layer’s gradient is the product of the next
      layer’s gradient and the local derivative. If the weights are small or activations saturate, those
      derivatives are < 1, so multiplying many of them drives the gradient toward zero in the first layers
      – the vanishing gradient problem. Conversely, large weights produce derivatives > 1, causing exploding
      gradients in deeper layers. Proper weight initialization fixes the scale: Xavier (Glorot) initialization
      for sigmoid/tanh activations and He initialization for ReLU keep the variance of activations and
      gradients roughly constant across layers. Adding batch normalization also normalises activations,
      preventing saturation, and residual connections give shortcuts for gradients, both helping gradient
      flow.'
    key_points:
    - id: kp_1
      statement: Explains that repeated multiplication of derivatives less than one causes vanishing gradients
        in early layers.
      required: true
    - id: kp_2
      statement: Describes how large weight magnitudes can lead to exploding gradients in deeper layers.
      required: true
    - id: kp_3
      statement: Recommends using He or Xavier initialization to keep activation variances balanced across
        layers.
      required: true
    - id: kp_4
      statement: Mentions batch normalization or residual connections as architectural ways to preserve
        gradient flow.
      required: false
    hint_ladder:
    - Recall how repeated multiplication of small derivatives affects earlier layers.
    - Think about the role of weight scale at the start of training.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  convolutional_networks__q1:
    stem: In a CNN you notice that after adding a second convolutional layer, the training loss stops
      decreasing while validation loss keeps improving; what could be happening and how would you verify
      it?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:convolutional_networks
      weight: 0.7
    - id: concept:backpropagation
      weight: 0.15
    - id: concept:training_deep_networks
      weight: 0.15
    reference_answer: When the second convolutional layer is added, the model starts learning higher-level
      representations. If the training loss plateaus while validation loss still drops, it often means
      the new layer is learning useful features but the earlier layers are no longer being updated effectively
      – either because gradients are diminishing or the learning rate is too low for deeper weights. To
      confirm, I would plot the gradient norms of each layer, visualise the activation maps of the first
      and second conv layers on a few samples, and check if the earlier layers’ weights are changing.
      If gradients are tiny, I might add batch-norm or residual links, or warm-up the learning rate. If
      the layers are simply redundant, I could prune or reduce depth.
    key_points:
    - id: kp_1
      statement: The network may be over-parameterised, causing the earlier layers to learn redundant
        features while deeper layers capture more abstract patterns.
      required: true
    - id: kp_2
      statement: Training loss stagnation can stem from vanishing gradients or learning-rate issues in
        deeper layers.
      required: true
    - id: kp_3
      statement: Verification steps include visualising feature maps of each layer, checking gradient
        magnitudes, and possibly reducing depth or adding residual connections.
      required: true
    hint_ladder:
    - Think about what each layer learns and how gradients flow.
    - Consider visualising activations or checking weight updates.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  convolutional_networks__q2:
    stem: Your team wants to replace a large fully-connected classifier at the end of a CNN with a global
      average pooling layer; what trade-offs does this involve and when is it advantageous?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:convolutional_networks
      weight: 0.7
    - id: concept:optimisers
      weight: 0.15
    - id: concept:transfer_learning
      weight: 0.15
    reference_answer: Replacing the dense head with global average pooling cuts the parameter count from
      millions to a few thousand, which reduces over-fitting and speeds up training, especially on limited
      data. It also makes the model more lightweight for deployment. However, GAP collapses each feature
      map to a single number, so any spatial cues that the fully-connected layer could exploit are lost
      – this can hurt tasks like object detection or fine-grained classification. In practice, when fine-tuning
      a pretrained ImageNet model for classification on a modest dataset, GAP is often beneficial because
      the convolutional backbone already encodes strong semantic maps and the reduced head simplifies
      optimisation. If you need precise localisation, you’d keep a small dense head or add attention mechanisms
      instead.
    key_points:
    - id: kp_1
      statement: Global average pooling drastically reduces the number of parameters, lowering over-fitting
        risk and memory footprint.
      required: true
    - id: kp_2
      statement: It discards spatial location details, which can hurt performance on tasks needing fine-grained
        localization.
      required: true
    - id: kp_3
      statement: Using GAP aligns well with transfer-learning from models trained on ImageNet, as the
        preceding convolutional features are already spatially aggregated.
      required: false
    - id: kp_4
      statement: Training may become faster and more stable because fewer weights need to be optimised,
        but the model may lose capacity to learn complex decision boundaries.
      required: false
    hint_ladder:
    - Compare parameter count and spatial information retention.
    - Think about how this change interacts with pretrained models.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  sequence_models__q1:
    stem: You are debugging a language-model RNN that suddenly starts producing repetitive loops after
      a few timesteps; what could be causing this behavior and how would you diagnose and fix it?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:sequence_models
      weight: 0.7
    - id: concept:backpropagation
      weight: 0.15
    - id: concept:optimisers
      weight: 0.15
    reference_answer: When an RNN begins to repeat the same token over and over, the most common culprit
      is that gradients are either vanishing or exploding, so the network can’t learn long-range dependencies.
      I would first look at the gradient norms during training – if they are near zero or blowing up,
      that confirms the problem. Applying gradient clipping helps with exploding gradients, but for vanishing
      gradients the architecture needs more memory, so I’d switch to LSTM or GRU cells, maybe add residual
      connections, and ensure proper initialization. After the change I’d re-track hidden-state statistics
      and the loss curve to see the repetitions disappear.
    key_points:
    - id: kp_1
      statement: Identifies vanishing or exploding gradients as a root cause of loss of information over
        long sequences.
      required: true
    - id: kp_2
      statement: Mentions checking gradient norms or using gradient clipping to confirm the issue.
      required: true
    - id: kp_3
      statement: Proposes replacing plain RNN cells with LSTM/GRU or adding residual connections to mitigate
        the problem.
      required: true
    - id: kp_4
      statement: Suggests monitoring hidden-state activations or loss curves to verify the fix.
      required: false
    hint_ladder:
    - Think about how information propagates through time steps.
    - What diagnostics show the health of gradients?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  sequence_models__q2:
    stem: In a production speech-to-text pipeline you replace a vanilla RNN with a bidirectional LSTM;
      what trade-offs does this introduce in terms of latency, accuracy, and resource usage?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:sequence_models
      weight: 0.7
    - id: concept:ml_deployment_and_monitoring
      weight: 0.15
    reference_answer: A bidirectional LSTM looks at the whole sequence, so it can correct mistakes that
      a forward-only RNN would miss, typically improving the word-error rate by a few percent. However,
      it doubles the hidden-state size, so you end up with roughly twice the parameters and compute, which
      raises memory usage and power draw. More importantly, you can’t emit a transcription until the backward
      pass has seen the end of the audio, so latency grows by the length of the utterance or the chosen
      chunk size. In a real-time service you’d have to trade that accuracy gain for added delay, perhaps
      by using streaming-friendly approximations, pruning, or quantisation to keep the resource budget
      in check.
    key_points:
    - id: kp_1
      statement: Explains that bidirectional LSTMs see future context, usually boosting word-error rate.
      required: true
    - id: kp_2
      statement: Notes that processing both directions doubles the number of parameters and compute, increasing
        memory and CPU/GPU load.
      required: true
    - id: kp_3
      statement: 'Describes the latency impact: you must wait for the entire utterance before the backward
        pass can finish, which adds end-to-end delay.'
      required: true
    - id: kp_4
      statement: Mentions possible mitigations such as chunked streaming or model pruning to keep latency
        acceptable.
      required: false
    hint_ladder:
    - Consider what information the backward direction needs.
    - Think about what changes when you double hidden units.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  embeddings__q1:
    stem: In a sentiment analysis model you notice that the word "great" and "terrible" have very close
      embedding vectors after training. Why might this happen and how would you address it?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:embeddings
      weight: 0.7
    - id: concept:training_deep_networks
      weight: 0.15
    reference_answer: If "great" and "terrible" end up close, it usually means the model hasn't seen enough
      contrasting contexts or the loss isn’t penalising that similarity. An imbalanced corpus where positive
      and negative examples share many surrounding words can push the vectors together. To fix it, you
      could augment the data with more balanced sentiment examples, switch to a pretrained embedding that
      already captures polarity, or add a regulariser like a contrastive or triplet loss that explicitly
      pushes opposite-sentiment words apart. Also double-check that the labels are correct and that the
      loss function is appropriate for classification.
    key_points:
    - id: kp_1
      statement: Explains that embeddings are learned from co-occurrence statistics and may collapse opposite
        sentiment words if the training data is imbalanced or noisy.
      required: true
    - id: kp_2
      statement: Mentions possible remedies such as increasing data diversity, using pretrained sentiment-aware
        embeddings, or adding a contrastive loss/regularisation.
      required: true
    - id: kp_3
      statement: Notes that checking the loss function and label quality can reveal why the model is not
        separating polarity.
      required: false
    hint_ladder:
    - Think about how the training data distribution influences vector positions.
    - What extra signal could you give the model to separate opposite meanings?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  embeddings__q2:
    stem: During inference a recommendation system uses an embedding layer to map user IDs to vectors,
      but you observe that a newly added user gets a zero vector and no recommendations. What is happening
      and how can you fix it?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: intro
    time_budget_s: 150
    concepts:
    - id: concept:embeddings
      weight: 0.7
    - id: concept:ml_deployment_and_monitoring
      weight: 0.15
    reference_answer: The zero vector means the system is looking up an ID that never got a learned embedding
      – the user was absent from the training set, so the embedding table returns its default entry, usually
      all zeros. To resolve this you can allocate a new row for the user and initialise it (randomly or
      with the mean of existing user vectors), or apply a cold-start method that derives a vector from
      the user’s profile or similar users. In production you should also add a guard that detects unseen
      IDs and triggers the fallback logic rather than silently returning zeros.
    key_points:
