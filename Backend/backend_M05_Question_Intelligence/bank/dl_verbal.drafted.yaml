  large_language_models__q1:
    stem: In a retrieval-augmented generation (RAG) pipeline, why does adding a vector store improve factual
      accuracy compared to using the LLM alone?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:large_language_models
      weight: 0.7
    - id: concept:embeddings
      weight: 0.15
    reference_answer: A vector store holds embeddings of external documents that can be queried at inference
      time. Because the LLM’s weights are frozen after pre-training, it only knows what was present in
      its training data, which quickly becomes stale. By encoding the query, retrieving the nearest document
      vectors, and feeding those passages into the prompt, the model can ground its response in up-to-date
      facts. This reduces hallucination and improves factual correctness, though the final answer still
      depends on how well the prompt merges the retrieved text with the model’s generation capability.
    key_points:
    - id: kp_1
      statement: The vector store provides up-to-date external knowledge that the LLM’s static parameters
        may not contain.
      required: true
    - id: kp_2
      statement: Similarity search retrieves the most relevant documents, reducing hallucination by grounding
        the generation.
      required: true
    - id: kp_3
      statement: The LLM still needs to fuse retrieved passages, so prompt design and the model’s reasoning
        ability affect final accuracy.
      required: false
    hint_ladder:
    - Think about what information the model has baked into its weights versus what can be looked up at
      run time.
    - Recall how similarity search works with embeddings.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  large_language_models__q2:
    stem: During fine-tuning a 7-billion-parameter LLM on a domain-specific dataset, you notice the loss
      plateaus early. What are three possible reasons and how would you address each?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:large_language_models
      weight: 0.7
    - id: concept:optimisers
      weight: 0.15
    - id: concept:training_deep_networks
      weight: 0.15
    reference_answer: One common cause is an inappropriate learning rate – a high LR can cause the optimizer
      to jump over minima, while a very low LR stalls progress. I would experiment with a smaller LR,
      add a warm-up phase, or switch to a cosine decay schedule. Second, the fine-tuning corpus might
      be too tiny or homogeneous, giving the model insufficient signal; I’d enlarge the dataset, apply
      augmentation, or increase batch size to improve gradient estimates. Third, aggressive regularisation
      such as high weight decay or full-parameter fine-tuning can lead to catastrophic forgetting; switching
      to low-rank adapters or reducing weight decay lets the model retain its general knowledge while
      adapting to the new domain.
    key_points:
    - id: kp_1
      statement: Learning rate is too high or too low; adjust schedule or try a smaller base LR with warm-up.
      required: true
    - id: kp_2
      statement: Dataset is too small or lacks diversity; augment data or increase batch size to provide
        richer gradients.
      required: true
    - id: kp_3
      statement: Catastrophic forgetting or over-regularisation; reduce weight decay or use a lower-rank
        adapter instead of full fine-tuning.
      required: true
    hint_ladder:
    - Consider optimizer hyper-parameters and regularisation first.
    - What aspects of the data itself could limit learning?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  ml_deployment_and_monitoring__q1:
    stem: You notice a sudden drop in prediction accuracy of a deployed model after a week in production;
      what steps would you take to diagnose and remediate the issue?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:ml_deployment_and_monitoring
      weight: 0.7
    reference_answer: First, I would look at the monitoring dashboard to see if any alerts have fired—especially
      data-drift or concept-drift metrics like population stability index or KL divergence. I’d pull a
      sample of recent request payloads and compare feature distributions to the training set, using histograms
      or statistical tests. If the features have shifted, that points to drift; if the model’s confidence
      scores have changed without feature shift, I’d suspect concept drift or a model-version issue. I’d
      also verify infrastructure health—CPU, memory, latency spikes, or container restarts. Depending
      on the root cause, I might retrain the model on the newest data, enable incremental updates, roll
      back to the previous stable version, and tighten alerts to catch future drifts earlier.
    key_points:
    - id: kp_1
      statement: Checks real-time monitoring dashboards for data drift, feature distribution changes,
        and prediction latency.
      required: true
    - id: kp_2
      statement: Compares recent input feature statistics with training set statistics using statistical
        tests or visualizations.
      required: true
    - id: kp_3
      statement: Identifies whether the drop is due to data drift, concept drift, or infrastructure issues
        (e.g., increased latency, container restarts).
      required: true
    - id: kp_4
      statement: 'Proposes remediation: retrain with recent data, implement incremental learning, add
        alerts, or roll back to a stable version.'
      required: true
    hint_ladder:
    - Think about data that the model sees versus the data it was trained on.
    - Consider both monitoring metrics and possible model-side actions.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  ml_deployment_and_monitoring__q2:
    stem: Explain the trade-offs between batch inference and real-time serving for a recommendation model,
      and when you would choose one over the other.
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:ml_deployment_and_monitoring
      weight: 0.7
    - id: concept:large_language_models
      weight: 0.15
    reference_answer: Batch inference runs on a schedule—say nightly—generating a static set of recommendations
      that are stored in a cache. It’s cheap because you can use spot instances or GPUs in bulk, and monitoring
      is straightforward since you only need to track job success and data freshness. However, the recommendations
      can be stale and can’t react to a user’s immediate behavior. Real-time serving, on the other hand,
      invokes the model for each request, delivering up-to-the-second personalization. This requires low-latency
      APIs, autoscaling, and more sophisticated monitoring of latency, error rates, and model drift. It
      also costs more due to always-on compute. I’d pick batch for use-cases like daily email newsletters
      or pre-computed rankings where a few-hour lag is acceptable, and real-time for in-app suggestions,
      search re-ranking, or any scenario where the user’s current context dramatically changes the optimal
      result.
    key_points:
    - id: kp_1
      statement: Describes batch inference as periodic, cost-effective, suitable for cold-start or offline
        recommendation generation.
      required: true
    - id: kp_2
      statement: Describes real-time serving as low-latency, on-demand inference that can incorporate
        the latest user context.
      required: true
    - id: kp_3
      statement: 'Discusses trade-offs: batch has higher latency but lower compute cost and simpler monitoring;
        real-time has higher infrastructure complexity, need for autoscaling, and tighter SLAs.'
      required: true
    - id: kp_4
      statement: 'Provides a decision rule: choose batch when recommendations can be stale (e.g., nightly
        email digests) and real-time when personalization must reflect immediate user actions (e.g., in-app
        suggestions).'
      required: true
    hint_ladder:
    - Consider latency requirements, cost, and freshness of recommendations.
    - Think about how the serving architecture impacts scaling and monitoring.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
