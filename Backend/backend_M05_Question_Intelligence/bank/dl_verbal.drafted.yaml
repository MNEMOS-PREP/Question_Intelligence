  attention_and_transformers__q1:
    stem: In a transformer encoder, why does multi-head self-attention improve representation learning
      compared to a single attention head?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:attention_and_transformers
      weight: 0.7
    - id: concept:embeddings
      weight: 0.15
    - id: concept:sequence_models
      weight: 0.15
    reference_answer: Multi-head attention splits the model dimension into several smaller heads, each
      with its own linear projections for queries, keys and values. Because each head operates in a different
      learned sub-space, it can attend to distinct patterns—one head might capture short-range syntactic
      dependencies, another long-range semantic links. The outputs of all heads are concatenated and linearly
      transformed back to the original dimension, so the model retains the full representational capacity
      while benefiting from multiple perspectives. A single head would need a much larger dimension to
      encode the same variety, which is less efficient and gives weaker gradient flow for learning diverse
      features.
    key_points:
    - id: kp_1
      statement: Each head projects the same input into a different sub-space, allowing the model to capture
        multiple types of relationships (e.g., syntactic, semantic) in parallel.
      required: true
    - id: kp_2
      statement: The concatenated outputs preserve the original dimensionality while aggregating diverse
        information, which a single head cannot achieve without increasing dimension.
      required: true
    - id: kp_3
      statement: Multi-head attention also provides a richer gradient signal during back-propagation,
        helping earlier layers learn more robust embeddings.
      required: false
    hint_ladder:
    - Think about the dimensionality of queries/keys/values and the diversity of sub-spaces.
    - Consider what each head can focus on simultaneously.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  attention_and_transformers__q2:
    stem: During inference you notice that a transformer-based language model generates repetitive text
      after a few sentences. What could be causing this behaviour and how would you mitigate it?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:attention_and_transformers
      weight: 0.7
    - id: concept:large_language_models
      weight: 0.15
    - id: concept:ml_deployment_and_monitoring
      weight: 0.15
    reference_answer: The model is likely over-confident on a narrow set of next-token probabilities,
      so after a few steps it keeps picking the same high-probability tokens, leading to loops. This can
      stem from exposure bias during training or from aggressive decoding settings like a low temperature
      or greedy decoding. To fix it, you can raise the temperature, switch to stochastic decoding such
      as top-k or nucleus (top-p) sampling, and optionally add a repetition penalty that discounts logits
      of tokens that appeared in the recent window. In production you would also monitor the distribution
      of logits and adjust these hyper-parameters to keep the output diverse.
    key_points:
    - id: kp_1
      statement: Repetition often arises from a high probability mass on a small set of tokens, caused
        by exposure bias or a low temperature during sampling.
      required: true
    - id: kp_2
      statement: Mitigation strategies include increasing sampling temperature, applying nucleus (top-p)
        or top-k sampling, or adding a repetition penalty that reduces logits for recently generated tokens.
      required: true
    - id: kp_3
      statement: Monitoring token-level statistics in production can help detect and tune these hyper-parameters
        before deployment.
      required: false
    hint_ladder:
    - Recall how the model’s probability distribution is sampled.
    - Think about the role of attention scores and token logits in generating the next token.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  transfer_learning__q1:
    stem: You have a small dataset of medical images for a rare disease. How would you use a pretrained
      convolutional network to improve performance, and what are the key decisions you must make during
      fine-tuning?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:transfer_learning
      weight: 0.7
    - id: concept:convolutional_networks
      weight: 0.15
    - id: concept:backpropagation
      weight: 0.15
    reference_answer: I would start with a model like ResNet-50 that’s been trained on ImageNet. First
      I replace its final fully-connected layer with a new head sized for the number of disease classes.
      Then I freeze the early convolutional blocks—those capture generic edges and textures—and only fine-tune
      the later blocks and the new head. I use a small learning rate (e.g., 1e-4) for the frozen-to-unfrozen
      transition and a slightly higher rate for the new head, often with a learning-rate scheduler. Because
      the dataset is tiny, I add aggressive augmentation (rotation, scaling, contrast) and monitor validation
      loss to stop early. This approach leverages the rich low-level features from the large source domain
      while adapting higher-level representations to the medical images.
    key_points:
    - id: kp_1
      statement: Chooses a model pretrained on a large, related domain (e.g., ImageNet) and replaces the
        final classification head with one matching the medical task.
      required: true
    - id: kp_2
      statement: Explains freezing early layers to retain generic feature extractors while fine-tuning
        later layers to adapt to domain-specific patterns.
      required: true
    - id: kp_3
      statement: Mentions using a lower learning rate for pretrained layers and a higher rate for the
        new head to avoid destroying learned weights.
      required: true
    - id: kp_4
      statement: Notes additional tricks such as data augmentation, regularisation, or early stopping
        to compensate for limited data.
      required: false
    hint_ladder:
    - Think about which layers to freeze and which to train.
    - Consider learning-rate adjustments and data augmentation.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  transfer_learning__q2:
    stem: During production you notice a pretrained language model’s predictions drifting after a month
      of new user queries. What could be causing this, and how would you address it using transfer-learning
      techniques?
    modality: verbal
    round_types:
    - dl_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:transfer_learning
      weight: 0.7
    - id: concept:large_language_models
      weight: 0.15
    - id: concept:ml_deployment_and_monitoring
      weight: 0.15
    reference_answer: 'The most likely cause is a distribution shift: users are asking about topics, slang,
      or entities that weren’t common when the model was originally fine-tuned. To fix it, I would pull
      a recent, representative sample of queries, label a small set with the correct intents or responses,
      and fine-tune the pretrained transformer on this data. I’d freeze the lower-level attention layers—since
      they capture basic language structure—and only train the top-few transformer blocks plus the task-specific
      head, using a modest learning rate to prevent forgetting. After fine-tuning, I’d run an A/B test
      and track metrics like accuracy and latency to ensure the updated model restores performance without
      harming earlier cases.'
    key_points:
    - id: kp_1
      statement: Identifies data distribution shift (new vocabulary, topics, or user behaviour) as the
        root cause of drift.
      required: true
    - id: kp_2
      statement: Proposes collecting a recent, labeled subset of user queries for continued fine-tuning.
      required: true
    - id: kp_3
      statement: Recommends freezing most of the transformer layers and updating only the top few layers
        or a task-specific head to avoid catastrophic forgetting.
      required: true
    - id: kp_4
      statement: Describes setting up a monitoring pipeline (e.g., performance metrics, A/B test) to validate
        that the adapted model improves the drift without degrading earlier behavior.
      required: false
    hint_ladder:
