      weight: 0.7
    reference_answer: A 404 Not Found tells us that the HTTP request reached the server and was correctly
      formed, but the server has no representation for the URI you asked for. It’s not a client-side syntax
      error or a server failure; the resource simply isn’t present at that path. The client should verify
      the endpoint, maybe query a different URL, or present a user-friendly error. The network stack worked
      fine – the issue is purely about resource existence.
    key_points:
