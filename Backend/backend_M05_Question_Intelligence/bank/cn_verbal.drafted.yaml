  http_and_rest__q2:
    stem: During a load test you notice that POST requests to create new orders are returning 429 Too
      Many Requests; how would you explain why this happens and what steps you could take to mitigate
      it while keeping the API RESTful?
    modality: verbal
    round_types:
    - cn_verbal
    difficulty_band: core
    time_budget_s: 240
    concepts:
    - id: concept:http_and_rest
      weight: 0.7
    - id: concept:network_security_basics
      weight: 0.15
    reference_answer: A 429 Too Many Requests response means the server has enforced a rate-limit policy
      because the client sent more POST calls than allowed in a given window. This is a protective measure
      to prevent overload and can also deter abuse, tying into basic network security. To stay RESTful,
      the client should respect the Retry-After header, implement exponential back-off, and possibly batch
      or throttle requests. On the server side you could tune the quota, use leaky-bucket or token-bucket
      algorithms, and ensure the endpoint remains stateless and idempotent where applicable.
    key_points:
    - id: kp_1
      statement: Identifies that 429 signals the server is applying rate limiting because the client exceeded
        a configured request quota.
      required: true
    - id: kp_2
      statement: Describes that rate limiting protects the service from overload and can be part of a
        security strategy against abuse.
      required: false
    - id: kp_3
      statement: Suggests mitigation actions such as exponential back-off, retry-after header handling,
        or adjusting client request patterns, while preserving statelessness of the API.
      required: true
    - id: kp_4
      statement: Mentions that the API should still be idempotent where appropriate and that the client
        can cache the Retry-After value.
      required: false
    hint_ladder:
    - What does the 4xx class of codes represent?
    - Think about how a client can react to a Retry-After header.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  https_and_tls__q1:
    stem: A client connects to https://example.com and you notice the TLS handshake takes noticeably longer
      than usual; what could cause this delay and how would you investigate it?
    modality: verbal
    round_types:
    - cn_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:https_and_tls
      weight: 0.7
    - id: concept:network_security_basics
      weight: 0.15
    reference_answer: The delay can stem from several handshake phases. First, DNS lookup or the TCP three-way
      handshake may be slow, especially on a congested link. Once the TCP connection is up, the client
      sends a ClientHello; if the server presents a large certificate chain or the client must fetch revocation
      data via OCSP or CRL, that adds time. Lack of session resumption forces a full handshake, which
      is longer. To debug, I’d capture the flow with Wireshark to see where the pause occurs, test the
      server with openssl s_client -tls1_2 -servername example.com, check whether OCSP stapling is enabled,
      and verify the certificate chain size. On the client side I’d ensure the root store is up-to-date
      and test on a different network to rule out latency.
    key_points:
    - id: kp_1
      statement: Identifies that DNS resolution, TCP three-way handshake, or certificate validation can
        add latency before TLS negotiation.
      required: true
    - id: kp_2
      statement: Mentions possible server-side issues such as large certificate chain, OCSP/CRL checks,
        or lack of session resumption.
      required: true
    - id: kp_3
      statement: 'Suggests practical debugging steps: capture traffic with Wireshark/tcpdump, check server
        logs, test with openssl s_client, and verify OCSP stapling.'
      required: false
    - id: kp_4
      statement: Notes that client-side problems like outdated root store or slow network can also contribute.
      required: false
    hint_ladder:
    - Think about each step of the TLS handshake and what external factors can affect them.
    - Consider both client-side and server-side configurations.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  https_and_tls__q2:
    stem: In a microservice architecture, one service calls another over HTTPS and you notice occasional
      "certificate pinning" failures after a deployment; why does this happen and what strategy would
      you use to avoid it?
    modality: verbal
    round_types:
    - cn_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:https_and_tls
      weight: 0.7
    - id: concept:http_and_rest
      weight: 0.15
    reference_answer: Certificate pinning makes the client accept only a known certificate or its public
      key. When the service is redeployed, the TLS termination may get a new cert—perhaps from an automated
      renewal—so the pinned value no longer matches, and the client aborts the request. To avoid this,
      I’d pin to the issuing CA’s public key instead of the leaf certificate, or use a key-rotation approach
      where the new cert is deployed alongside the old one and the client is allowed to accept either
      for a transition period. Another option is to implement a fallback to the system trust store after
      a configurable number of pin failures, balancing security with availability.
    key_points:
    - id: kp_1
      statement: Explains that pinning ties the client to a specific server certificate or public key,
        so rotating certificates breaks the check.
      required: true
    - id: kp_2
      statement: Describes how automated certificate renewal (e.g., Let’s Encrypt) or rolling updates
        can replace the cert, causing failures.
      required: true
    - id: kp_3
      statement: Proposes a mitigation such as pinning to the CA’s public key, using a trust-on-first-use
        fallback, or implementing a key-rotation strategy with overlapping certificates.
      required: false
    - id: kp_4
      statement: Mentions the trade-off between strict security and operational flexibility.
      required: false
    hint_ladder:
    - Recall what certificate pinning validates.
    - Think about what changes during a deployment.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  sockets__q1:
    stem: In a microservice you notice that occasional client requests hang for several seconds before
      timing out; you suspect the socket handling code. What could cause these hangs and how would you
      diagnose and fix them?
    modality: verbal
    round_types:
    - cn_verbal
    difficulty_band: hard
    time_budget_s: 180
    concepts:
    - id: concept:sockets
      weight: 0.7
    - id: concept:tcp_reliability
      weight: 0.15
    - id: concept:network_security_basics
      weight: 0.15
    reference_answer: The hangs are usually a symptom of the server thread blocking on a socket operation.
      If accept() or recv() is called in blocking mode without a timeout, a client that disconnects or
      stops sending will leave the thread stuck, and subsequent requests queue up. Another common cause
      is the listen backlog filling up because the process cannot accept fast enough, or the OS limit
      on open file descriptors being reached, which makes new connections wait. To diagnose, I would enable
      socket-level logging, inspect /proc/sys/net/core/somaxconn and ulimit -n, and use netstat or ss
      to see sockets in LISTEN, ESTABLISHED, or TIME_WAIT. The fix is to set non-blocking mode or use
      select/poll/epoll with a reasonable timeout, configure SO_RCVTIMEO, increase the backlog, and ensure
      the process raises its FD limit. Also handling SIGPIPE and checking for zero-byte reads avoids accidental
      hangs.
    key_points:
    - id: kp_1
      statement: Blocking accept()/recv() without a timeout can make the thread wait indefinitely if the
        peer stops sending.
      required: true
    - id: kp_2
      statement: Exhausted file descriptor limit or backlog queue full can cause new connections to be
        delayed.
      required: true
    - id: kp_3
      statement: Using select/poll or setting socket options like SO_RCVTIMEO and SO_REUSEADDR mitigates
        the issue.
      required: true
    - id: kp_4
      statement: Checking for half-closed connections and handling SIGPIPE prevents unexpected termination.
      required: false
    hint_ladder:
    - Think about what happens after accept() returns.
    - Consider both blocking behavior and resource limits.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  sockets__q2:
    stem: Your team needs to expose a secure REST endpoint over HTTPS on a Linux server that already runs
      a TCP service on port 443. How can you make both services coexist using sockets?
    modality: verbal
    round_types:
    - cn_verbal
    difficulty_band: core
    time_budget_s: 150
    concepts:
    - id: concept:sockets
      weight: 0.7
    - id: concept:https_and_tls
      weight: 0.15
    - id: concept:tcp_vs_udp
      weight: 0.15
    reference_answer: You cannot have two independent processes both binding to 0.0.0.0:443 directly.
      The usual solution is to bind one service to a different IP address on the same machine, leaving
      port 443 free for HTTPS. If that isn’t possible, you place a TLS-terminating reverse proxy (like
      Nginx or HAProxy) on port 443; it performs the TLS handshake, then based on ALPN or the HTTP request
      path forwards the traffic either to the HTTPS backend or to the raw TCP service on a different internal
      port. Another option is to use SO_REUSEPORT with careful load-balancing logic, but that is rarely
      recommended. In practice, the proxy approach cleanly separates the protocols while keeping a single
      public port.
    key_points:
    - id: kp_1
      statement: You can bind the existing TCP service to a specific IP address and bind the HTTPS listener
        to another IP (or use different IP families).
      required: true
    - id: kp_2
      statement: Alternatively, use a single listener and implement Application-Layer Protocol Negotiation
        (ALPN) or a proxy (e.g., Nginx) that inspects the first bytes to route to the correct backend.
      required: true
    - id: kp_3
      statement: If both must share the exact same IP and port, you need a TLS-terminating reverse proxy
        that terminates HTTPS and forwards plain TCP to the other service.
      required: false
    - id: kp_4
      statement: Setting SO_REUSEPORT allows multiple processes to bind to the same port, but they must
        coordinate to avoid race conditions.
      required: false
    hint_ladder:
    - Think about how the kernel distinguishes traffic before the application sees it.
    - Consider using a multiplexing technique at the socket layer.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  network_security_basics__q1:
    stem: You notice that a web server you manage is suddenly receiving a flood of requests from many
      IPs, overwhelming the service. Explain how a firewall can be configured to mitigate this attack
      and what limitations it might have.
    modality: verbal
    round_types:
    - cn_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:network_security_basics
      weight: 0.7
    - id: concept:ip_addressing
      weight: 0.15
    reference_answer: A firewall can be set to drop traffic from suspicious source IP ranges or to rate-limit
      connections per IP, effectively throttling a flood. By enabling stateful inspection, it only permits
      packets that belong to an established TCP handshake, discarding stray SYN packets typical of a SYN-flood.
      You can also create rules that block traffic to the service port unless it originates from known
      clients. However, if attackers spoof IPs or use legitimate ports, the firewall alone may not stop
      the flood; you’d need upstream DDoS mitigation, traffic scrubbing, or an intrusion-prevention system.
      So the firewall mitigates the symptom but has limits against sophisticated volumetric attacks.
    key_points:
    - id: kp_1
      statement: Describes setting up inbound rule blocks based on source IP ranges or rate-limiting thresholds.
      required: true
    - id: kp_2
      statement: Mentions using stateful inspection to allow only established connections and drop new
        SYN floods.
      required: true
    - id: kp_3
      statement: Notes that firewalls cannot stop attacks that spoof IPs or use legitimate ports, requiring
        upstream DDoS protection.
      required: false
    hint_ladder:
    - Think about rule granularity – IP, port, and connection state.
    - Consider what traffic a firewall sees versus what an attacker can disguise.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  network_security_basics__q2:
    stem: During a code review you find that a team stored user passwords using a simple hash function
      without a salt. Explain why this is insecure and how adding a salt and using a stronger construction
      improves security.
    modality: verbal
    round_types:
    - cn_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:network_security_basics
      weight: 0.7
    reference_answer: A plain hash like SHA-256 of a password is deterministic, so an attacker can compute
      a rainbow table of common passwords and compare hashes directly. Without a salt, every user with
      the same password has the same stored hash, making bulk cracking trivial. Adding a unique random
      salt to each password means the hash input differs per user, so pre-computed tables are useless;
      the attacker must recompute hashes for each salt. Moreover, using a purpose-built password-hashing
      algorithm such as bcrypt, scrypt, or Argon2 adds computational cost and memory hardness, dramatically
      slowing brute-force attempts. Together, salt and a strong hash protect against both dictionary and
      large-scale offline attacks.
    key_points:
    - id: kp_1
      statement: States that unsalted hashes allow pre-computed rainbow table attacks.
      required: true
    - id: kp_2
      statement: Explains that a unique per-user salt makes each hash distinct, preventing reuse of pre-computed
        tables.
      required: true
    - id: kp_3
      statement: Mentions using a slow, memory-hard hash (e.g., bcrypt, scrypt, Argon2) to raise brute-force
        cost.
      required: false
    hint_ladder:
    - Recall what a rainbow table does.
    - Think about the properties of a good password-hashing function.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
