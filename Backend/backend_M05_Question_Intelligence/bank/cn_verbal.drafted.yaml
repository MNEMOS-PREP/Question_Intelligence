  dns__q1:
    stem: A client on your laptop tries to open https://example.com but the browser hangs after the DNS
      lookup; what could cause the DNS resolution to fail in this scenario?
    modality: verbal
    round_types:
    - cn_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:dns
      weight: 0.7
    - id: concept:network_security_basics
      weight: 0.15
    reference_answer: The most common cause is a mis-configured recursive resolver – the client may be
      pointing to a DNS server that is offline, has the wrong IP, or is blocked by a corporate firewall.
      In that case the resolver never gets a response, so the browser waits indefinitely. Another possibility
      is that a firewall or DNS-filtering device is dropping UDP/53 packets, effectively cutting off the
      lookup. If the resolver does get a response but the authoritative servers for example.com are down
      or returning SERVFAIL, the client will also see a hang because it cannot retrieve the final A or
      AAAA record. Any of these issues break the DNS resolution step, causing the browser to stall before
      establishing the TLS connection.
    key_points:
    - id: kp_1
      statement: The resolver might be using an incorrect or unreachable recursive DNS server (mis-configured
        DNS settings).
      required: true
    - id: kp_2
      statement: A DNS response could be blocked or tampered with by a firewall or DNS-based filtering,
        preventing the client from receiving an answer.
      required: true
    - id: kp_3
      statement: Cache poisoning or expired TTL could cause the resolver to repeatedly query a dead authoritative
        server.
      required: false
    - id: kp_4
      statement: If the domain's authoritative name servers are down, the resolver cannot obtain the final
        A/AAAA record.
      required: false
    hint_ladder:
    - Think about the steps a resolver performs after receiving a query.
    - Consider both configuration and external factors.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  dns__q2:
    stem: Compare iterative and recursive DNS queries from the perspective of a recursive resolver – when
      would you prefer one over the other?
    modality: verbal
    round_types:
    - cn_verbal
    difficulty_band: core
    time_budget_s: 240
    concepts:
    - id: concept:dns
      weight: 0.7
    reference_answer: A recursive query asks the resolver to fetch the final answer, so the resolver contacts
      the root, the TLD, and the authoritative name servers in sequence, returning the A/AAAA record to
      the client. This hides the lookup complexity from the client and typically gives lower overall latency
      for the client, but it puts the processing and network load on the resolver and on the upstream
      DNS hierarchy. An iterative query, on the other hand, returns a referral – the IP of the next server
      – and the client (or a forwarding resolver) follows the chain itself. Iterative mode is lighter
      on the resolver and can be useful for forwarders or when you want to distribute load across the
      DNS tree, but it adds round-trip latency for the client and requires the client to understand referrals.
      In practice, recursive queries are the default for end-user resolvers, while iterative queries are
      used internally by DNS servers and for special low-resource scenarios.
    key_points:
    - id: kp_1
      statement: In a recursive query the resolver does all the work, contacting root, TLD, and authoritative
        servers on behalf of the client.
      required: true
    - id: kp_2
      statement: In an iterative query the resolver returns a referral to the client, which then contacts
        the next server itself.
      required: true
    - id: kp_3
      statement: Recursive queries reduce client complexity and latency for the client, but increase load
        on the resolver and on the DNS infrastructure.
      required: false
    - id: kp_4
      statement: Iterative queries are useful for DNS servers that act as forwarders or for low-power
        devices that prefer minimal processing.
      required: false
    hint_ladder:
    - Recall who does the work in each mode.
    - Think about network load and latency.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  http_and_rest__q1:
    stem: A client receives a 404 response from a REST endpoint after sending a GET request; what does
      this status code indicate about the request and the server's handling of the resource?
    modality: verbal
    round_types:
