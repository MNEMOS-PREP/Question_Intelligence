  exception_handling__q1:
    stem: In a large Java service you notice that a NullPointerException is bubbling up and crashing the
      thread. Explain how you would redesign the code to handle this exception more gracefully, and what
      role a finally block could play.
    modality: verbal
    round_types:
    - oop_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:exception_handling
      weight: 0.7
    - id: concept:abstraction_and_interfaces
      weight: 0.15
    reference_answer: A NullPointerException means we accessed an object reference that was null. First,
      we should guard against it by checking the reference or using Optional before dereferencing. In
      the service method we can place the risky call inside a try block, catch NullPointerException (or
      better, a more specific custom exception) to log the error and return a safe fallback or propagate
      a controlled error response. A finally block is useful to close any resources—like streams, database
      connections, or to release a lock—so they are always cleaned up regardless of success or exception.
      Optionally, we could abstract the operation behind an interface and inject a mock that never returns
      null, improving testability.
    key_points:
    - id: kp_1
      statement: Identifies the cause of NullPointerException (e.g., dereferencing a null reference) and
        suggests checking for null or using Optional.
