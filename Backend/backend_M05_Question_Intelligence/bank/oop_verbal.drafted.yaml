  exception_handling__q2:
    stem: Compare checked and unchecked exceptions in Java. When would you choose to create a custom checked
      exception versus an unchecked one, considering API design and client code impact?
    modality: verbal
    round_types:
    - oop_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:exception_handling
      weight: 0.7
    - id: concept:design_patterns
      weight: 0.15
    reference_answer: Checked exceptions are subclasses of Exception (except RuntimeException) that the
      compiler requires the caller to either catch or declare. Unchecked exceptions extend RuntimeException
      and need not be declared or caught. Use checked exceptions for conditions that a reasonable caller
      can recover from, like a FileNotFoundException when opening a file, because the API forces the caller
      to consider the failure. Use unchecked exceptions for programming errors—invalid arguments, null
      pointers—where recovery isn’t expected. If you have a domain-specific error that the client should
      handle, such as a BusinessRuleViolation, you’d create a custom checked exception to make the contract
      explicit. For errors that indicate bugs or unrecoverable states, a custom unchecked exception keeps
      the API cleaner.
    key_points:
    - id: kp_1
      statement: Defines checked exceptions as those the compiler forces callers to handle or declare,
        and unchecked exceptions as RuntimeException subclasses not enforced.
      required: true
    - id: kp_2
      statement: Explains that checked exceptions are suitable for recoverable conditions that callers
        are expected to handle, such as I/O errors.
      required: true
    - id: kp_3
      statement: States that unchecked exceptions are appropriate for programming errors like illegal
        arguments or null dereference, where recovery is not realistic.
      required: true
    - id: kp_4
      statement: Justifies creating a custom checked exception when you want to signal a domain-specific,
        recoverable problem and force API users to handle it, otherwise prefers unchecked for simplicity.
      required: false
    hint_ladder:
    - Recall the compiler’s role with each type.
    - Consider the client’s responsibility to handle the error.
