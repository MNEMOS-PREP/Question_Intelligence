  memory_model_gc__item_1:
    stem: In a long-running Java service you notice the heap usage keeps growing even though you never
      allocate large objects manually. What could be happening with the garbage collector, and how would
      you investigate and fix it?
    modality: verbal
    round_types:
    - oop_verbal
    difficulty_band: hard
    time_budget_s: 180
    concepts:
    - id: concept:memory_model_gc
      weight: 0.7
    - id: concept:memory_management
      weight: 0.15
    reference_answer: If the heap keeps growing, it usually means some objects are not being reclaimed.
      In generational GC, objects that survive several young-generation collections are promoted to the
      old generation. If those objects are unintentionally retained—perhaps via static collections, thread-local
      caches, or listeners—they will accumulate and fill the old generation, causing long full GCs or
      OOM. I would first enable GC logging or use jstat/VisualVM to see promotion rates and pause times.
      If I see a high promotion count, I’d investigate the code paths that hold references, replace strong
      references with WeakReference or clear caches, and possibly tune the old-gen size. After the fix,
      heap usage should stabilise and pause times drop.
    key_points:
    - id: kp_1
      statement: Explains that objects surviving many young-generation collections get promoted to the
        old generation, which may fill up if they are unintentionally retained.
      required: true
    - id: kp_2
      statement: Describes using JVM monitoring tools (e.g., jstat, VisualVM) or GC logs to see promotion
        rates and pause times.
      required: true
    - id: kp_3
      statement: Suggests fixing the leak by removing strong references (e.g., clearing caches, using
        WeakReference) or tuning GC parameters.
      required: true
    - id: kp_4
      statement: Mentions that a high allocation rate combined with insufficient old-gen size can cause
        frequent full GCs and OOM.
      required: false
    hint_ladder:
    - Think about generations and objects that survive many collections.
    - Consider tools or JVM flags that reveal GC activity.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  memory_model_gc__item_2:
    stem: Compare reference counting with tracing garbage collection in terms of handling cyclic data
      structures and runtime overhead. When would you prefer one over the other in a language design?
    modality: verbal
    round_types:
    - oop_verbal
    difficulty_band: core
    time_budget_s: 150
    concepts:
    - id: concept:memory_model_gc
      weight: 0.7
    - id: concept:memory_management
      weight: 0.15
    reference_answer: Reference counting increments and decrements a counter on every pointer assignment,
      so reclamation happens immediately when the count drops to zero. This gives deterministic cleanup
      but fails on cyclic structures—each object in a cycle still has a non-zero count, so the memory
      leaks. Tracing garbage collectors, on the other hand, start from root references and mark all reachable
      objects; anything unmarked, including entire cycles, is reclaimed. The trade-off is that tracing
      incurs periodic pause-times and extra CPU to walk the heap, whereas reference counting adds constant
      overhead to every write. Designers might pick reference counting for real-time or embedded systems
      where pause-free operation is critical, and augment it with a cycle-detector, while choosing tracing
      for general-purpose languages where cycles are common and occasional pauses are acceptable.
    key_points:
    - id: kp_1
      statement: States that reference counting cannot reclaim cycles because each object in the cycle
        has a non-zero count.
      required: true
    - id: kp_2
      statement: Notes that tracing GC can detect and collect cycles by traversing reachable objects from
        roots.
      required: true
    - id: kp_3
      statement: Mentions that reference counting incurs constant-time overhead on every pointer write,
        while tracing incurs periodic stop-the-world pauses.
      required: true
    - id: kp_4
      statement: Suggests using reference counting in low-latency or embedded environments where deterministic
        reclamation is needed, and tracing when cycles are common or pause-time budgets are acceptable.
      required: false
    hint_ladder:
    - Recall that reference counting updates counts on every pointer assignment.
    - Think about what happens when objects reference each other.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
