    f: "checks that catch bad data"
    q: "What does data quality mean for a data pipeline, and what simple checks would you add to one?"
    a: "Data is good quality when it is fit for its use. The usual dimensions are completeness, with no missing required values; validity, with correct types, formats and ranges; uniqueness, with no duplicate records; consistency, where values agree across tables and foreign keys point to real rows; and freshness, where data arrives on time. Simple checks cover these: compare row counts with the expected or previous load, check key columns for nulls, check that ids are unique, check ranges such as no negative prices, check that references match, and check the latest timestamp. Tools such as dbt tests or Great Expectations run them automatically, and a failing check should stop the load or alert someone before bad data reaches dashboards."
