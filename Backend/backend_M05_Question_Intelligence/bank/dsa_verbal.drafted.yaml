  graphs_representation__q2:
    stem: You are debugging a program that stores a directed graph in an adjacency matrix but crashes
      when the graph has more than 5000 vertices. What is the likely cause and how would you fix it?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:graphs_representation
      weight: 0.7
    - id: concept:space_complexity
      weight: 0.15
    reference_answer: The crash is most likely due to running out of memory. An adjacency matrix for 5000
      vertices needs 5000 × 5000 entries; even with a single byte per entry that’s about 25 MB, and with
      ints it’s over 100 MB, which can exceed the process heap or stack limits. The fix is to move to
      a sparse representation, such as an adjacency list, which stores only existing edges and uses O(V+E)
      space. If the graph is still dense, you could compress the matrix using a bitset or allocate it
      on the heap instead of the stack, but the usual solution is to replace the matrix with a list.
    key_points:
    - id: kp_1
      statement: Identifies that an adjacency matrix for 5000 vertices needs 25 million boolean/int entries,
        consuming ~100 MB or more, leading to memory exhaustion.
