  edit_distance__q2:
    stem: Your production service stores user passwords after applying a custom edit-distance based similarity
      check to prevent weak passwords. Suddenly you notice many login attempts failing even for correct
      passwords. What could be going wrong in the edit-distance implementation?
    modality: verbal
    round_types:
