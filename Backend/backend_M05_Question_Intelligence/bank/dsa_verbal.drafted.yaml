  dp_on_trees__tree_dp_rerooting_to_compute_max_distanc:
    stem: You have a tree with N nodes, each edge weight 1. How would you compute for every node the sum
      of distances to all other nodes in O(N) using a DP-on-trees approach?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:dp_on_trees
      weight: 0.7
    - id: concept:graph_traversal_dfs
      weight: 0.15
    - id: concept:time_complexity
      weight: 0.15
    reference_answer: 'Start by rooting the tree at any node, say 1. In the first DFS we compute two arrays:
      sz[u] – number of nodes in u''s subtree, and dp[u] – sum of distances from u to nodes in its subtree.
      dp[u] = Σ(dp[child] + sz[child]) because each node in a child''s subtree is one edge farther from
      u. After the first pass, dp[1] gives the total distance sum for the root. In the second DFS we reroot:
      when we move the root from u to its child v, the distance to every node in v''s subtree decreases
      by 1 (size = sz[v]) and to all other nodes increases by 1 (N-sz[v]). So ans[v] = ans[u] + (N - 2*sz[v]).
      Propagate this formula to all children. Both traversals are linear, O(N) time and O(N) memory, yielding
      the required sum for every node.'
    key_points:
    - id: kp_1
      statement: First DFS computes subtree sizes and the total distance sum for an arbitrary root (e.g.,
        node 1).
      required: true
    - id: kp_2
      statement: 'Second DFS reroots: when moving from parent u to child v, distance sum for v = sum_u
        + (N - 2*size_v).'
      required: true
    - id: kp_3
      statement: Both passes run in O(N) time and O(N) space, giving the answer for every node.
      required: true
    - id: kp_4
      statement: Explain why the formula adjusts by adding N-size_v and subtracting size_v.
      required: false
    hint_ladder:
    - 'Think of a two-pass DP: one bottom-up, one top-down.'
    - What information can you reuse when you move the root from a parent to a child?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  dp_on_trees__tree_dp_maximum_independent_set_on_a_tre:
    stem: A company wants to select a set of employees represented by nodes in a hierarchy tree such that
      no manager and direct report are both chosen, maximizing total skill score. How would you solve
      this with tree DP?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:dp_on_trees
      weight: 0.7
    - id: concept:recursion
      weight: 0.15
    - id: concept:dynamic_programming
      weight: 0.15
    reference_answer: 'We treat the hierarchy as a rooted tree. For each node u we keep two values: dp[u][0]
      – best total skill when u is excluded, and dp[u][1] – best total when u is included. If we include
      u we cannot take any child, so dp[u][1] = skill[u] + Σ dp[child][0]. If we exclude u we may either
      take or skip each child, giving dp[u][0] = Σ max(dp[child][0], dp[child][1]). We compute these bottom-up
      with a post-order DFS, starting from leaves where dp[leaf][1]=skill[leaf] and dp[leaf][0]=0. After
      processing the whole tree, the answer is max(dp[root][0], dp[root][1]). The traversal visits each
      edge once, so the algorithm runs in O(N) time and uses O(N) extra space.'
    key_points:
    - id: kp_1
      statement: Define dp[u][0] as the maximum score in u's subtree when u is NOT selected, dp[u][1]
        when u IS selected.
      required: true
    - id: kp_2
      statement: 'Transition: dp[u][1] = score[u] + Σ dp[child][0]; dp[u][0] = Σ max(dp[child][0], dp[child][1]).'
      required: true
    - id: kp_3
      statement: Perform a post-order DFS to fill the DP tables, then answer is max(dp[root][0], dp[root][1]).
      required: true
    - id: kp_4
      statement: Complexity is O(N) time and O(N) space.
      required: false
    hint_ladder:
    - 'Consider two states for each node: taken or not taken.'
    - What sub-problem values do you need from children to compute the parent's states?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  greedy__greedy_vs_dp_trade_off:
    stem: You have a set of jobs, each with a deadline and profit, and you can schedule at most one job
      per day. Why does the greedy algorithm that picks the highest-profit job fitting the latest possible
      slot give the optimal total profit?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:greedy
      weight: 0.7
    - id: concept:interval_scheduling
      weight: 0.15
    - id: concept:sorting
      weight: 0.15
    reference_answer: The greedy choice works because the job with the highest profit that still fits
      a free day cannot be replaced by any other job without losing profit. Suppose an optimal schedule
      differs; take the first day where it doesn’t use the greedy job. That day must contain a lower-profit
      job, and the greedy job must be scheduled later or not at all. By swapping the two, we keep all
      deadlines satisfied and increase (or keep) total profit. Repeating this exchange transforms any
      optimal schedule into the greedy one, proving optimality. The algorithm sorts jobs by profit and
      slots each in the latest free day before its deadline, guaranteeing the maximum achievable profit.
    key_points:
    - id: kp_1
      statement: Shows that choosing the highest-profit job that can still meet its deadline never harms
        the ability to schedule remaining jobs.
      required: true
    - id: kp_2
      statement: 'Uses an exchange argument: any optimal schedule can be transformed to the greedy schedule
        without decreasing profit.'
      required: true
    - id: kp_3
      statement: Mentions that after sorting jobs by profit descending, we place each in the latest free
        slot before its deadline, which ensures maximal utilization of early slots for lower-profit jobs.
      required: false
    hint_ladder:
    - Think about how you could modify an optimal schedule to include the greedy choice.
    - What happens to the feasibility of deadlines when you swap a lower-profit job with a higher-profit
      one?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
