    reference_answer: I would pre-compute a Sieve of Eratosthenes up to 10⁷. The sieve marks multiples
      of each prime, running in O(N log log N) time and O(N) space for a boolean array – about ten megabytes
      for 10⁷. Once built, checking if a number is prime is just a direct array lookup, O(1). If we store
      the list of primes we can also binary-search it in O(log N). The main trade-off is the upfront memory
      and preprocessing time, but for a server that stays up for long periods the constant-time queries
      more than justify the ~10 MB cost.
    key_points:
