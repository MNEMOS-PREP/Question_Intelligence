      weight: 0.7
    - id: concept:arrays
      weight: 0.15
    reference_answer: To rotate an N×N matrix 90 degrees clockwise in place, I would first transpose the
      matrix – swap element (i, j) with (j, i) for all i < j – which turns rows into columns. Then I would
      reverse each row, swapping the first and last column elements in that row. This two-step process
      moves every element exactly once per step, so the overall time is O(N^2). Because we only use a
      few index variables and do the swaps in the original array, the extra space is O(1). The approach
      relies on the matrix being square; otherwise we’d need to allocate a new matrix to hold the rotated
      result.
    key_points:
