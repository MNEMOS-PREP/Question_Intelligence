  stacks__q1:
    stem: In a recursive depth-first search you notice the call stack growing beyond limits and causing
      a crash; how would you replace the recursion with an explicit stack, and what are the trade-offs?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:stacks
      weight: 0.7
    - id: concept:graph_traversal_dfs
      weight: 0.15
    - id: concept:arrays
      weight: 0.15
    reference_answer: To eliminate the recursion you create an explicit stack, push the source vertex,
      and then loop while the stack isn’t empty. Inside the loop you pop the top node, mark it visited,
      and push its adjacent unvisited neighbours onto the stack – typically in reverse order so that the
      leftmost neighbour is processed first, mimicking recursive DFS. This turns the call-stack into heap-allocated
      storage, so you avoid stack-overflow for deep graphs. The trade-off is that you now manage the stack
      yourself, which adds a few lines of code and may use slightly more memory than the call stack, but
      you gain control over the traversal and can easily add extra state if needed.
    key_points:
    - id: kp_1
      statement: Describes initializing an empty stack and pushing the start node.
      required: true
    - id: kp_2
      statement: 'Explains the loop: pop a node, process it, then push its unvisited neighbours in reverse
        order to preserve DFS order.'
      required: true
    - id: kp_3
      statement: Mentions that the explicit stack uses heap memory, avoiding stack-overflow but may use
        more memory overall.
      required: false
    - id: kp_4
      statement: Notes that recursion has implicit backtracking and cleaner code, while the manual stack
        makes the algorithm iterative and easier to control.
      required: false
    hint_ladder:
    - Think about the order in which nodes are pushed and popped.
    - Consider memory usage versus call-stack overhead.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
