    concepts:
    - id: concept:bit_manipulation
      weight: 0.7
    - id: concept:arrays
      weight: 0.15
    reference_answer: 'To clear permission k, first build a mask with a 1 at that position: 1 << k. Then
      invert the mask: ~(1 << k). Finally AND this with the current permission integer: perms = perms
      & ~(1 << k). This forces that bit to 0 while leaving all others untouched. Using XOR would flip
      the bit, which explains why the bug appeared when the wrong operator was used.'
