    reference_answer: I would treat the grid as a graph where each cell with value 1 is a node and edges
      connect orthogonal neighbours. Starting from the top-left, whenever I encounter an unvisited 1 I
      launch a DFS (or BFS) that recursively/iteratively visits all 1s reachable via up, down, left, right,
      marking them visited. After the flood-fill finishes I increment the island count. This continues
      until every cell is processed. Each cell is visited at most once, giving O(R·C) time, and the extra
      space is the recursion stack or queue, O(R·C) in the worst case when the whole grid is one island.
      This approach is simple, works for any grid size, and directly captures the connectivity definition
      of an island.
    key_points:
