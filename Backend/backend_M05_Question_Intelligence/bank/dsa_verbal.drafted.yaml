    reference_answer: 'If the hash of the pattern is recomputed for each shift, the inner loop runs over
      M characters each time, turning the algorithm into O(N·M), which defeats the purpose of Rabin-Karp.
      The fix is to compute the pattern hash once, then maintain a rolling hash for the current text window:
      subtract the contribution of the outgoing character, multiply by the base, add the incoming character,
      and take modulus. This update is O(1), so scanning the whole text is O(N). Combined with the one-time
      O(M) pattern hash, the expected runtime is O(N+M), with occasional extra checks for hash collisions.'
    key_points:
    - id: kp_1
