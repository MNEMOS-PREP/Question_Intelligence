  longest_increasing_subsequence__q1_debugging_lis_implementation:
    stem: You run an O(N log N) LIS routine that maintains a tails array and uses binary search, but on
      the input [3, 1, 2, 1, 2, 3] it returns length 2 instead of 4. What is likely wrong?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:longest_increasing_subsequence
      weight: 0.7
    - id: concept:binary_search
      weight: 0.15
    - id: concept:arrays
      weight: 0.15
    reference_answer: The most common bug is using the wrong bound in the binary search. In the patience-sorting
      LIS algorithm, tails[i] must store the smallest possible tail for a subsequence of length i+1, so
      when we process a new number we should replace the first element that is greater than or equal to
      it (lower_bound). If the code uses a strict ‘>’ check, equal values overwrite a later slot, preventing
      the algorithm from extending the sequence. In the array [3,1,2,1,2,3], the second ‘2’ should replace
      the tail of length-2 subsequence, allowing a length-4 LIS (1,2,2,3). Changing the binary search
      to return the first index with value ≥ key fixes the result.
    key_points:
    - id: kp_1
      statement: The binary search is updating the tails array with ‘>’ instead of ‘>=’, causing equal
        values to replace earlier entries incorrectly.
      required: true
    - id: kp_2
      statement: Because of the wrong comparison, the algorithm treats the second ‘2’ as not extending
        the subsequence, limiting the length.
      required: true
    - id: kp_3
      statement: Fixing the comparison to use lower_bound (first element ≥ key) restores the correct length
        4.
      required: false
    hint_ladder:
    - Think about how you update the tails array when you find a position with binary search.
    - Recall the invariant that tails[i] is the smallest possible tail of an increasing subsequence of
      length i+1.
    provenance: generated
