  dp_on_grids__item_1:
    stem: You have an N×M grid where some cells are blocked. In an interview you are asked to count the
      number of ways to go from the top-left to the bottom-right moving only right or down. How would
      you formulate the DP and what is its time and space complexity?
    modality: verbal
    round_types:
    - dsa_verbal
