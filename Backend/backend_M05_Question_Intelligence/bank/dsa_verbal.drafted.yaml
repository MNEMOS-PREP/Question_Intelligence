  knapsack__q1:
    stem: You have a set of 12 items each with weight and value, and a knapsack capacity of 30. Explain
      how you would solve the 0/1 knapsack problem using dynamic programming, and discuss the time and
      space complexity of your approach.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:knapsack
      weight: 0.7
    - id: concept:dynamic_programming
      weight: 0.15
    reference_answer: 'To solve 0/1 knapsack with DP we create a table dp where dp[i][w] stores the maximum
      value achievable using the first i items within weight w. The base case dp[0][w] = 0 for all w.
      For each item i we fill the row using the recurrence: if the item''s weight exceeds w, dp[i][w]
      = dp[i-1][w]; otherwise dp[i][w] = max(dp[i-1][w], dp[i-1][w-weight_i] + value_i). We iterate i
      from 1 to n and w from 0 to capacity. This fills an (n+1)×(C+1) table, giving O(n·C) time and O(n·C)
      space. By updating the table in place with a one-dimensional array and iterating w backwards, we
      can cut space to O(C) while keeping the same time complexity.'
    key_points:
    - id: kp_1
      statement: Describes building a DP table dp[i][w] where i indexes items and w indexes weight up
        to capacity.
      required: true
    - id: kp_2
