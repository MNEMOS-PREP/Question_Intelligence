  queues__q1:
    stem: You need to implement a circular queue using a fixed-size array for a real-time sensor buffer;
      what are the key steps and edge cases you must handle to ensure enqueue and dequeue remain O(1)?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:queues
      weight: 0.7
    - id: concept:arrays
      weight: 0.15
    reference_answer: 'To build a circular queue on a static array, keep two pointers: front points to
      the element to dequeue, rear points to the next free slot for enqueue. Both move forward modulo
      the array size, so when they reach the end they wrap to zero. The tricky part is distinguishing
      empty from full; you can either store a size counter or reserve one array cell and consider the
      queue full when (rear + 1) % N == front. Enqueue checks the full condition, writes at rear, then
      rear = (rear + 1) % N. Dequeue checks empty, reads at front, then front = (front + 1) % N. All steps
      are simple arithmetic, so both operations are O(1).'
    key_points:
    - id: kp_1
      statement: Uses two indices (front and rear) that wrap around with modulo arithmetic.
      required: true
    - id: kp_2
      statement: Distinguishes empty vs full state, typically by keeping a count or leaving one slot unused.
      required: true
    - id: kp_3
      statement: Updates indices correctly after each enqueue/dequeue and checks bounds before operation.
      required: true
    - id: kp_4
      statement: Ensures both operations run in constant time without shifting elements.
      required: false
    hint_ladder:
    - Think about what information tells you the queue has no elements versus when it cannot accept more.
    - Modulo arithmetic is your friend for the wrap-around.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  queues__q2:
    stem: During a breadth-first search you notice the queue size growing to millions before the target
