    reference_answer: I would test n > 0 and then compute n & (n-1). For a power of two, the binary form
      has a single 1, and subtracting one turns that 1 into 0 and sets all lower bits to 1. AND-ing the
      original number with n-1 therefore yields zero only for powers of two. So the condition n > 0 &&
      (n & (n-1)) == 0 correctly identifies powers of two.
    key_points:
