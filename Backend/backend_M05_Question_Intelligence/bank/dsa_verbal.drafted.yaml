    time_budget_s: 180
    concepts:
    - id: concept:dp_on_grids
      weight: 0.7
    - id: concept:dynamic_programming
      weight: 0.15
    - id: concept:arrays
      weight: 0.15
    reference_answer: I would set up a DP table dp[i][j] representing the number of ways to reach cell
      (i, j) from (0,0). If a cell is blocked, dp[i][j] is zero. Otherwise the recurrence is dp[i][j]
      = dp[i-1][j] + dp[i][j-1] because we can only come from the cell above or the cell to the left.
      We initialise dp[0][0] = 1 if the start isn’t blocked, and fill the first row and column respecting
      blocked cells. Scanning the grid once gives O(N·M) time. The naïve table uses O(N·M) space, but
      we can compress it to a single row of size M, achieving O(M) space while still O(N·M) time.
    key_points:
