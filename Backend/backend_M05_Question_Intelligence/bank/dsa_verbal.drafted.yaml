  graphs_representation__q1:
    stem: In a social network you need to frequently add new users and friendships, and also list all
      friends of a given user. Which graph representation would you choose and why?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:graphs_representation
      weight: 0.7
    - id: concept:space_complexity
      weight: 0.15
    - id: concept:graph_traversal_bfs
      weight: 0.15
    reference_answer: I would pick an adjacency-list representation. Adding a new user is just adding
      an empty list, O(1), and inserting a friendship means appending the neighbour to each list, also
      O(1). Listing a user’s friends then costs O(k), where k is the number of friends, which is optimal.
      An adjacency matrix would need V × V entries, so for a sparse network it wastes a lot of memory
      and enumerating friends would be O(V). The list also works naturally with BFS or DFS when we need
      to explore a friend-of-friend graph. Hence adjacency list gives the best time-space trade-off for
      this scenario.
    key_points:
    - id: kp_1
      statement: Chooses adjacency list because it supports O(1) addition of vertices and edges and O(k)
        enumeration of a vertex's neighbours, where k is its degree.
      required: true
    - id: kp_2
      statement: Mentions that adjacency matrix would waste O(V^2) space for a sparse network and makes
        neighbour enumeration O(V).
      required: true
    - id: kp_3
      statement: Notes that adjacency list also allows easy traversal (BFS/DFS) of a user’s friend circle.
      required: false
    hint_ladder:
    - Think about how many edges you expect compared to the number of vertices.
    - Consider both the cost of adding edges and of iterating neighbours.
