  divide_and_conquer__q1:
    stem: You need to count inversions in an array of 10^5 integers. Explain how a divide-and-conquer
      approach works and why its time complexity is O(n log n).
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:divide_and_conquer
      weight: 0.7
    - id: concept:recurrence_relations
      weight: 0.15
    - id: concept:arrays
      weight: 0.15
    reference_answer: We split the array into two halves recursively until each sub-array has one element
      – a trivially sorted segment with zero inversions. During the merge step we have two sorted halves;
      while merging we count how many elements from the right half jump ahead of elements in the left
      half. Every time an element from the right is placed before a left element, it forms an inversion
      with all remaining elements in the left, so we add that count. This gives a recurrence T(n)=2T(n/2)+Θ(n)
      for the merge work. Solving it with the Master theorem (a=2, b=2, f(n)=Θ(n)) yields T(n)=Θ(n log
      n). Thus the algorithm runs in O(n log n) time and uses O(n) auxiliary space for the temporary buffer.
    key_points:
    - id: kp_1
      statement: Describes splitting the array recursively into halves until size 1.
      required: true
    - id: kp_2
      statement: Explains merging step counts cross-inversions by comparing left and right sorted halves.
      required: true
    - id: kp_3
      statement: Derives recurrence T(n)=2T(n/2)+O(n) and solves it to O(n log n) using Master theorem.
      required: true
    - id: kp_4
      statement: Mentions that extra O(n) space is used for temporary merge buffer.
      required: false
    hint_ladder:
