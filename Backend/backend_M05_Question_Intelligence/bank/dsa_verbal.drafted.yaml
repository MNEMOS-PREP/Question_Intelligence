  dynamic_programming__dp_advanced_scenario_1:
    stem: In a production service you notice a function that recomputes the number of ways to reach each
      node in a DAG for every incoming request, and the latency spikes as request volume grows. What DP
      technique would you apply to fix this and why?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: hard
    time_budget_s: 180
    concepts:
    - id: concept:dynamic_programming
      weight: 0.7
    - id: concept:graphs_representation
      weight: 0.15
    - id: concept:topological_sort
      weight: 0.15
    reference_answer: The latency issue stems from recomputing the number of paths for every request,
      even though the DAG structure doesn’t change. Since each node’s path count depends on its predecessors,
      the same sub-problems are solved repeatedly – classic overlapping subproblems. I would preprocess
      the DAG with a topological sort and then run a bottom-up DP, storing the number of ways to reach
      each node in an array (memoisation). After this one-time O(V+E) pass, any request can retrieve the
      answer instantly, or at worst traverse a small set of queried nodes, giving O(1) per query. The
      main trade-off is the extra O(V) memory for the cache and the need to recompute it only when the
      graph updates, but overall it cuts the per-request latency dramatically.
    key_points:
    - id: kp_1
      statement: Identifies that the problem has overlapping subproblems because each node's count is
        recomputed for every request.
