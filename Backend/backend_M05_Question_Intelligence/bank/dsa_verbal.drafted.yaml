    - id: concept:sliding_window
      weight: 0.7
    - id: concept:queues
      weight: 0.15
    - id: concept:time_complexity
      weight: 0.15
    reference_answer: I’d keep a deque of request timestamps. When a new request arrives, I push its timestamp
      onto the back. Then I pop timestamps from the front while they’re older than current_time minus
      10 seconds. The deque now contains exactly the requests in the last 10-second window; if its length
      exceeds the burst threshold I raise an alert. Each request is inserted and removed once, so the
      amortized cost per request is O(1) and memory is proportional to the window size.
