    concepts:
    - id: concept:edit_distance
      weight: 0.7
    - id: concept:dynamic_programming
      weight: 0.15
    - id: concept:space_complexity
      weight: 0.15
    reference_answer: A likely culprit is a bug in the DP initialization. If the first row or column is
      not set to 0…i or 0…j, every cell will be off by a constant, making the computed distance larger
      than it should be, so a correct password may be rejected. Another common issue is storing the distance
      in an 8-bit integer; for strings longer than 127 characters the value overflows and wraps around,
      again causing false mismatches. Finally, when optimizing space to two rows, forgetting to copy the
      current row to the previous one before the next iteration corrupts the recurrence. Debugging by
      printing the DP matrix for simple pairs like "abc" vs "abd" quickly reveals the problem, and adding
      proper unit tests fixes it.
    key_points:
    - id: kp_1
      statement: Points out that an off-by-one error in the DP base-case (initialising first row/column)
        can shift all distances.
      required: true
    - id: kp_2
