  tree_traversals__item_1:
    stem: You have a binary tree where each node stores an integer. If you perform a preorder traversal,
      what order of nodes will you visit relative to the root, left, and right sub-trees, and why does
      this order naturally correspond to a recursive implementation?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:tree_traversals
      weight: 0.7
    reference_answer: 'In preorder we always visit the current node before any of its children. So the
      sequence is: root, then the entire left subtree in preorder, then the right subtree in preorder.
      The recursive code reflects this because the function first processes the node, then calls itself
      on the left child, and after that returns and calls itself on the right child. The call stack naturally
      preserves this order, and an equivalent iterative version uses a stack that pushes the right child
      first so that the left child is processed next.'
    key_points:
    - id: kp_1
      statement: Visits the root first, then recursively traverses the left subtree, then the right subtree.
      required: true
    - id: kp_2
      statement: 'Explains that recursion follows the call stack: after processing a node, the function
        calls itself on the left child before the right, preserving the order.'
      required: true
    - id: kp_3
      statement: Mentions that the same order can be produced iteratively using a stack, pushing right
        child before left child.
      required: false
    hint_ladder:
    - Think about what the function does before making any recursive calls.
    - Consider the order in which you would push children onto a stack for an iterative version.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  tree_traversals__item_2:
    stem: During a production incident you notice that a depth-first search on a very deep binary tree
      is causing a stack overflow. Which tree traversal would you switch to, and what trade-offs does
      it introduce in terms of memory usage and order of node processing?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 240
    concepts:
    - id: concept:tree_traversals
      weight: 0.7
    - id: concept:queues
      weight: 0.15
    - id: concept:stacks
      weight: 0.15
    reference_answer: The overflow comes from the recursive call stack of a depth-first traversal. Switching
      to a level-order traversal eliminates recursion; we use a queue to hold nodes of the current level.
      This uses memory proportional to the maximum width of the tree, which for a highly unbalanced tree
      is much smaller than the recursion depth that caused the overflow. The trade-off is that we lose
      the DFS order – nodes are visited breadth-first rather than root-left-right – which may affect algorithms
      that depend on preorder or postorder properties, but it solves the immediate stack-size problem.
    key_points:
    - id: kp_1
      statement: Suggest switching to level-order (breadth-first) traversal using a queue.
      required: true
    - id: kp_2
      statement: Explain that level-order uses O(width) memory, which for a balanced tree is O(n) in the
        worst case but typically far less than recursion depth for a skewed tree.
      required: true
    - id: kp_3
      statement: Contrast that the node processing order changes from depth-first (root-left-right) to
        visiting nodes level by level, which may affect algorithms that rely on DFS ordering.
      required: false
    hint_ladder:
    - What traversal can be implemented without recursion?
    - Consider the data structure that naturally processes items in FIFO order.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  binary_search_trees__bst_deletion_balance_tradeoff:
    stem: You need to delete a node with two children from a BST in a time-critical service; explain the
      two standard replacement strategies and their impact on tree balance and subsequent operation costs.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:binary_search_trees
      weight: 0.7
    - id: concept:tree_traversals
      weight: 0.15
    - id: concept:balanced_trees
      weight: 0.15
    reference_answer: When deleting a node with two children we replace it with either its inorder predecessor
      – the rightmost node in its left subtree – or its inorder successor – the leftmost node in its right
      subtree. Both preserve the BST ordering because the replacement is the next smaller or larger key.
      After swapping, we delete the predecessor/successor, which now has at most one child, so the actual
      removal is O(1). However, if we always pick the predecessor, the left side may shrink more often,
      and if the tree was already skewed, that side can become deeper, gradually unbalancing the tree.
      The same risk exists with the successor on the right side. Over many deletions this bias can turn
      a balanced BST into a near-linear chain, making lookups, inserts, and further deletes degrade to
      O(n). To avoid that, we either alternate the choice, use randomised BSTs, or periodically rebalance
      the tree with an AVL or Red-Black rotation scheme, restoring the logarithmic guarantees.
    key_points:
    - id: kp_1
      statement: Describes using the inorder predecessor (maximum in left subtree) as replacement.
      required: true
    - id: kp_2
      statement: Describes using the inorder successor (minimum in right subtree) as replacement.
      required: true
    - id: kp_3
      statement: Explains that both choices keep the BST property but may cause the tree to become unbalanced
        if the chosen subtree is deep.
      required: true
    - id: kp_4
      statement: Mentions that repeated deletions using one side can bias the tree, leading to degraded
        O(n) performance, and that rebalancing (e.g., AVL or Red-Black rotations) may be needed.
      required: false
    hint_ladder:
    - Recall the two nodes that are immediate neighbours of the deleted key in sorted order.
    - Think about what part of the tree actually gets removed after the swap.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  balanced_trees__q1:
    stem: You notice the AVL tree you maintain for a live leaderboard has become unbalanced after a series
      of insertions, causing search depth to increase. Explain why rotations restore balance and how many
      rotations are needed in the worst case for a single insertion.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:balanced_trees
      weight: 0.7
    - id: concept:binary_search_trees
      weight: 0.15
    reference_answer: In an AVL tree each node stores a balance factor – the height difference between
      its left and right subtrees – which must stay within –1 to +1. When we insert a key, only the nodes
      on the path from the root to the inserted node can have their heights changed, so at most one node
      will end up with a balance factor of ±2. A rotation (single or double) locally re-arranges the three
      involved nodes, preserving the in-order ordering, and restores the balance factor to the allowed
      range. Because the imbalance can only appear at the deepest unbalanced node, a single rotation (LL
      or RR case) or a double rotation (LR or RL case) suffices; thus the worst case for one insertion
      is two rotations. After the rotation the height of that subtree drops by at most one, keeping the
      overall tree height O(log n).
    key_points:
    - id: kp_1
      statement: A rotation restructures a local subtree while preserving the in-order sequence of keys.
      required: true
    - id: kp_2
      statement: After insertion, the tree may violate the AVL balance factor by at most 2, so at most
        one single or double rotation is required.
      required: true
    - id: kp_3
      statement: The worst-case height reduction after the necessary rotation(s) brings the height back
        within O(log n).
      required: false
    hint_ladder:
    - Recall the AVL balance factor limits and which nodes' heights change after insertion.
    - Think about the four classic cases (LL, RR, LR, RL) and how many rotations each needs.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  balanced_trees__q2:
    stem: During a code review you see a red-black tree implementation that uses colour flips and rotations
      after deletions. Why is deletion more complex than insertion in a red-black tree, and what is the
      worst-case number of colour changes and rotations required?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:balanced_trees
      weight: 0.7
    - id: concept:binary_search_trees
      weight: 0.15
    reference_answer: When we delete a node from a red-black tree, we might remove a black node, which
      reduces the black-height on one side of the tree and breaks the property that every path from a
      node to its leaves contains the same number of black nodes. To repair this, we propagate a “double-black”
      up the tree, performing colour flips at each step to rebalance the black count. This can involve
      up to O(log n) recolourings as we move toward the root, but the structural fix requires at most
      two rotations – either a single rotation when a sibling is red, or a double rotation when the sibling
      and its children are black and the far child is red. Thus deletion is more involved than insertion,
      which needs at most one colour change and one rotation, while deletion may need many colour flips
      but no more than two rotations in the worst case.
    key_points:
    - id: kp_1
      statement: Deletion may remove a black node, potentially violating the black-height property along
        the path to the root.
      required: true
    - id: kp_2
      statement: Fixing the violation may require a series of colour flips (re-coloring) and up to two
        rotations as the “double black” is pushed upward.
      required: true
    - id: kp_3
      statement: In the worst case, O(log n) colour changes but at most two rotations are performed.
      required: false
    hint_ladder:
    - Remember the five cases for fixing a double-black after deletion.
    - Compare the number of recolourings needed versus structural changes.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  tries__debugging_a_trie_autocomplete_issue:
    stem: Your live autocomplete service sometimes returns unrelated words for the prefix "app"; what
      common mistakes in a trie implementation could cause this behavior?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:tries
      weight: 0.7
    - id: concept:strings
      weight: 0.15
    - id: concept:space_complexity
      weight: 0.15
    reference_answer: A typical cause is an incorrect end-of-word flag. If internal nodes aren’t marked
      as word endings, the search may stop early and return whatever leaf it reaches, pulling in unrelated
      words. Another issue is mishandling child pointers – for example, treating a missing child as an
      empty node and continuing the search, which can walk down a wrong branch. Also, when deleting words,
      if you don’t prune nodes that become useless, stale paths remain and may still be visited for a
      prefix, causing spurious suggestions. Finally, inconsistent case handling can mix words that shouldn’t
      match. Fixing these points usually restores correct autocomplete results.
    key_points:
    - id: kp_1
      statement: Missing or incorrect end-of-word marker causes non-terminal nodes to be treated as complete
        words.
      required: true
    - id: kp_2
      statement: Improper handling of null/undefined child pointers can lead to traversing wrong branches.
      required: true
    - id: kp_3
      statement: Failure to prune empty branches after deletions may leave stale paths that match the
        prefix.
      required: false
    - id: kp_4
      statement: Using case-insensitive comparison inconsistently can mix unrelated entries.
      required: false
    hint_ladder:
    - Think about node termination flags and child traversal.
    - Consider what happens when you delete or update nodes.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  tries__trie_vs_hash_map_for_dictionary_lookup:
    stem: Compare using a trie with a hash map for storing a large English dictionary in terms of lookup
      speed, memory usage, and support for prefix queries.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:tries
      weight: 0.7
    - id: concept:arrays
      weight: 0.15
    - id: concept:strings
      weight: 0.15
    reference_answer: A trie searches character by character, so lookup cost is O(L) where L is the length
      of the query, and prefix searches stop as soon as the prefix node is reached, giving O(P) for a
      prefix of length P. A hash map, on the other hand, hashes the entire word and gives average O(1)
      lookup for exact matches, but it cannot answer prefix queries without scanning keys or building
      extra indexes. In memory, a trie stores a node for each character, leading to high overhead especially
      when many nodes have few children; a hash map stores only full keys, usually using less memory if
      the hash function is efficient. However, hash maps benefit from better cache locality because entries
      are in contiguous buckets, while tries suffer pointer chasing. So, tries excel when you need fast
      prefix operations despite higher space, whereas hash maps are preferable for pure exact-match lookups
      with tighter memory constraints.
    key_points:
    - id: kp_1
      statement: Tries give O(L) lookup where L is word length, independent of dictionary size, and naturally
        support prefix search in O(P) time.
      required: true
    - id: kp_2
      statement: Hash maps provide average O(1) lookup for full words but cannot handle prefix queries
        without extra work.
      required: true
    - id: kp_3
      statement: Tries consume more memory due to per-character node overhead, especially with sparse
        branching, while hash maps store only whole keys and values, often using less space with a good
