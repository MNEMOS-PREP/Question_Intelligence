  union_find__q1:
    stem: In a social network you notice that after repeatedly merging friend groups, the find operation
      is still taking noticeably longer than expected. What could be causing this slowdown and how would
      you fix it?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:union_find
      weight: 0.7
    - id: concept:amortized_analysis
      weight: 0.15
    reference_answer: If find is getting slower it usually means the trees are getting deep. That happens
      when we don't compress paths during find, so each find walks up a long chain of parents. Without
      compression the amortized cost rises to O(log n) or even O(n) in the worst case. The fix is to implement
      path compression – make every node on the find path point directly to the root – and ideally combine
      it with union by rank or size, which always attaches the smaller tree under the larger. With both
      heuristics the amortized time per operation drops to almost constant, inverse-Ackermann, and the
      slowdown disappears.
    key_points:
    - id: kp_1
      statement: Identifies that path compression is missing or not applied during find, leading to tall
        trees.
      required: true
    - id: kp_2
      statement: Explains that without path compression the amortized cost degrades from near-constant
        to O(log n) or worse.
      required: true
    - id: kp_3
      statement: Suggests adding path compression (or both path compression and union by rank) to restore
        inverse-Ackermann amortized time.
      required: true
    - id: kp_4
      statement: Mentions that the union heuristic (e.g., union by size/rank) also helps keep trees shallow.
      required: false
    hint_ladder:
    - Think about what each find does to the parent pointers.
    - What extra step can you take while walking up to the root?
