  graph_traversal_dfs__dfs_order_impact_on_connected_components:
    stem: You have a huge sparse graph stored as an adjacency list. Explain how a single DFS run can be
      used to list all connected components, and why the order in which you start DFS matters for the
      component count you report.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:graph_traversal_dfs
      weight: 0.7
    reference_answer: To find all connected components, we keep a visited array initialized to false.
      We loop over every vertex; if a vertex is unvisited we start a DFS from it. The DFS marks all vertices
      reachable from that start as visited – that whole set is one component, so we increment a component
      counter. We then continue the outer loop; every time we meet another unvisited vertex we start a
      new DFS and count another component. The order in which we pick the next unvisited vertex only affects
      which component is reported first, not the total count. Because we visit each vertex and edge once,
      the algorithm runs in O(V+E) time and uses O(V) extra space for the visited flags and recursion
      stack.
    key_points:
    - id: kp_1
      statement: Describes iterating over all vertices, launching a DFS from any vertex that is still
        unvisited, and marking all reachable vertices as one component.
      required: true
    - id: kp_2
      statement: States that each time a new unvisited vertex is found, a new component counter is incremented.
      required: true
    - id: kp_3
      statement: Notes that the order of the outer loop (which vertex you pick next) does not change the
        number of components, only the order in which they are discovered.
      required: false
    - id: kp_4
      statement: Mentions the overall complexity O(V+E) time and O(V) auxiliary space for the visited
        array and recursion stack.
      required: false
    hint_ladder:
    - What do you do when you encounter a vertex that has never been visited?
    - How does the outer loop interact with the DFS calls?
