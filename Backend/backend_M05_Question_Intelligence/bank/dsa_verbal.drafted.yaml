  two_pointers__q2:
    stem: In a linked list you suspect there is a cycle. Explain how the fast-slow two-pointer (Floyd’s)
      algorithm detects the cycle and what the pointers’ positions tell you after detection.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:two_pointers
      weight: 0.7
    - id: concept:linked_lists
      weight: 0.15
    - id: concept:space_complexity
      weight: 0.15
    reference_answer: We start both pointers at the head; slow advances one node per loop, fast advances
      two. If the list has no loop, fast will reach null and we stop. If there is a loop, fast will eventually
      lap slow and they meet inside the cycle. That meeting proves a cycle exists. To find the entry node,
      we move one pointer back to the head while keeping the other at the meeting point, then advance
      both one step each iteration; they will meet at the cycle’s start because the distance from head
      to start equals the distance from meeting point to start around the loop. Throughout, we only store
      two pointers, so the space overhead is constant.
    key_points:
    - id: kp_1
      statement: Initialises slow pointer at head moving one step and fast pointer at head moving two
        steps each iteration.
      required: true
    - id: kp_2
      statement: If fast ever meets slow, a cycle exists.
      required: true
    - id: kp_3
      statement: After meeting, resetting one pointer to head and moving both one step at a time makes
        them meet at the cycle start.
      required: true
    - id: kp_4
      statement: The algorithm uses O(1) extra space.
      required: false
    hint_ladder:
