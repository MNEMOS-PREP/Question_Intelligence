      If you iterate over all previously placed queens or scan the whole board for column and diagonal
      conflicts, each recursive call does O(N) work, which explodes for N=12. A standard fix is to maintain
      three auxiliary structures: a boolean array for columns, one for the main diagonal (row-col constant),
      and one for the anti-diagonal (row+col constant). With these, you can check safety in O(1) time.
      An even faster variant uses bit masks for the three arrays and bitwise AND/OR to test and set bits,
      cutting the constant factor dramatically. The algorithm’s theoretical O(N!) bound remains, but the
      per-node work drops from linear to constant, making N=12 solve in milliseconds.'
    key_points:
