  fenwick_trees__bit_01:
    stem: You have an array of 10^6 integers that receives point updates and prefix sum queries online.
      Explain why a Fenwick Tree is suitable and how you would implement both operations.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:fenwick_trees
      weight: 0.7
    - id: concept:arrays
      weight: 0.15
    - id: concept:prefix_sums
      weight: 0.15
    reference_answer: A Fenwick Tree, or BIT, stores cumulative information in a 1-based array. At position
      i we keep the sum of the last LSB(i) elements, so the tree implicitly represents prefix sums. To
      add a value at index p we update tree[p] and then move to p += p & -p, repeating until we exceed
      n; each step merges the update into larger ranges, giving O(log n) time. To query the sum of the
      first k elements we start with ans = 0 and repeatedly add tree[k] then set k -= k & -k, climbing
      down the tree, also O(log n). The structure needs only n+1 integers, so memory is linear, and it
      handles a million-size array easily without the extra constants of a segment tree.
    key_points:
    - id: kp_1
      statement: Describes the BIT structure as a 1-based array where each index stores the sum of a range
        defined by its least-significant set bit.
      required: true
    - id: kp_2
      statement: Shows point-update runs in O(log n) by walking up using i += i & -i.
      required: true
    - id: kp_3
      statement: Shows prefix-sum query runs in O(log n) by walking down using i -= i & -i.
      required: true
    - id: kp_4
      statement: Mentions memory usage is O(n) and no need for segment tree overhead.
      required: false
    hint_ladder:
    - Recall how the least-significant set bit determines the range a node covers.
    - Think about moving upward for updates and downward for queries.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  fenwick_trees__bit_02:
    stem: During a code-review you notice a function that builds a Fenwick Tree by repeatedly calling
      the point-update routine for each element. What is the time-complexity issue and how would you improve
      the build to O(n)?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: hard
    time_budget_s: 180
    concepts:
    - id: concept:fenwick_trees
      weight: 0.7
    - id: concept:amortized_analysis
      weight: 0.15
    - id: concept:arrays
      weight: 0.15
    reference_answer: Calling the update routine for every element gives O(n log n) because each update
      climbs O(log n) levels. You can build the BIT in linear time by first copying the raw array into
      a 1-based BIT array. Then, for i from 1 to n, compute j = i + (i & -i); if j ≤ n, add BIT[i] to
      BIT[j]. This propagates each element’s contribution to the next responsible node exactly once, so
      the total work is Θ(n). The method uses the same LSB logic as updates but performs it in a single
      pass, turning the build into O(n).
    key_points:
    - id: kp_1
      statement: Identifies that naïvely calling update n times costs O(n log n).
      required: true
    - id: kp_2
      statement: 'Explains the linear-time construction: copy the original array into BIT and then for
        each i add BIT[i] to BIT[i + LSB(i)] if that index exists.'
      required: true
    - id: kp_3
      statement: Shows that each element is moved at most once, giving overall O(n) work.
      required: true
    - id: kp_4
      statement: Mentions this is an amortized-analysis view of the build process.
      required: false
    hint_ladder:
    - What does the update loop actually do to the internal array?
    - Can you push those contributions forward in one sweep?
