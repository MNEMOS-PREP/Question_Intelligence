    - id: concept:dynamic_programming
      weight: 0.15
    reference_answer: 'The recursive backtracking version tries every subset, giving a 2^n search tree.
      Many branches recompute the same sub-problem: reaching the same index with the same remaining capacity.
      By adding memoisation – a hash map keyed by (i, remaining) – we store the boolean result for each
      state. When the recursion reaches a previously seen state we return the cached answer instead of
      exploring again. This collapses the exponential tree to at most n × C distinct states, so the worst-case
      runtime becomes O(n·C) with O(n·C) memory. Additional pruning, like cutting off branches when the
      current sum already exceeds the target or when the remaining items cannot fill the gap, can further
      speed it up.'
    key_points:
