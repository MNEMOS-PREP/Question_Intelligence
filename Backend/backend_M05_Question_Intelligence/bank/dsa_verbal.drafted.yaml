  shortest_paths__q1_debugnegativecycle:
    stem: You run Bellman-Ford on a directed graph and after |V|-1 relaxations the distances still change.
      What does this indicate, and how would you identify the vertices involved in the problem?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:shortest_paths
      weight: 0.7
    - id: concept:graphs_representation
      weight: 0.15
    - id: concept:dynamic_programming
      weight: 0.15
    reference_answer: If distances still improve after |V|-1 passes, Bellman-Ford has detected a negative-weight
      cycle reachable from the source. The algorithm guarantees that any further relaxation must be due
      to such a cycle. To locate the cycle, run one more full relaxation pass and record any vertex whose
      distance gets updated; these vertices lie on or can reach the cycle. Starting from any of them,
      follow the predecessor pointers for |V| steps to ensure you’re inside the cycle, then continue until
      you revisit a vertex, which gives the cycle’s nodes. Note that cycles not reachable from the source
      won’t be reported, so the source’s reachability matters.
    key_points:
    - id: kp_1
      statement: A change after |V|-1 iterations means the graph contains a negative-weight cycle reachable
        from the source.
      required: true
    - id: kp_2
      statement: To find vertices in the cycle, one can run another pass and mark any vertex whose distance
        relaxes, then follow predecessor links to trace the cycle.
      required: true
    - id: kp_3
      statement: If the cycle is not reachable from the source, Bellman-Ford will not report it, so reachability
        must be considered.
      required: false
    hint_ladder:
    - Think about what Bellman-Ford guarantees after |V|-1 iterations.
    - Consider a second pass to capture which vertices still change.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
