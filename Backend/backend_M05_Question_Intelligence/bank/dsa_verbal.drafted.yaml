  modular_arithmetic__fermat_application_debug:
    stem: During a coding interview you notice your solution for computing modular inverses using Fermat's
      little theorem fails when the modulus is 8. Explain why and how to fix it.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:modular_arithmetic
      weight: 0.7
    - id: concept:number_theory
      weight: 0.15
    reference_answer: Fermat's little theorem states that a^(p-1) ≡ 1 (mod p) when p is prime, so the
      inverse of a is a^(p-2) mod p. With modulus 8, which is not prime, this property breaks; for example
      3^6 mod 8 = 1, but 3^6 ≠ 1 for all a, and 3^6 does not give the inverse of 3. The fix is to compute
      the modular inverse with the extended Euclidean algorithm, which finds x such that a·x + m·y = gcd(a,m).
      When gcd is 1, x is the inverse modulo m. This works for any composite modulus as long as a and
      m are coprime.
    key_points:
    - id: kp_1
      statement: Points out Fermat's little theorem requires the modulus to be prime.
      required: true
    - id: kp_2
      statement: Shows that 8 is composite, so a^(m-2) mod m does not give the inverse for all a coprime
        to 8.
      required: true
    - id: kp_3
      statement: Proposes using the extended Euclidean algorithm to compute the inverse for any modulus
        where a and m are coprime.
      required: true
    - id: kp_4
      statement: Mentions that for prime moduli the FLT method works and is O(log m).
      required: false
    hint_ladder:
    - Recall the condition under which Fermat's little theorem holds.
    - What algorithm finds coefficients for Bézout's identity?
