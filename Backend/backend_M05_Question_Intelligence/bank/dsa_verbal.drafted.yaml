  backtracking__q1:
    stem: You need to generate all subsets of a set of size N using backtracking. Explain how you would
      prune the search space if you only want subsets whose sum is exactly K.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:backtracking
      weight: 0.7
    - id: concept:combinatorics
      weight: 0.15
    - id: concept:recursion
      weight: 0.15
    reference_answer: 'I would start with a recursive function that takes the current index, the current
      subset, and the current sum. At each call I have two branches: include the element at the index
      or skip it. Before recursing on the include branch I add the element to the running sum; if that
      sum exceeds K I stop that branch immediately – that’s the prune. If the sum equals K I record the
      subset as a valid answer, but I still backtrack because later elements might also be excluded to
      form other subsets. The exclude branch simply recurses without changing the sum. This way the recursion
      explores the subset tree but cuts off any path that can’t possibly reach the target sum, reducing
      the average work compared to the full 2^N enumeration. The worst-case complexity remains O(2^N)
      when no pruning occurs.'
    key_points:
    - id: kp_1
      statement: 'Describes the recursive decision tree: at each index choose include or exclude the element.'
      required: true
    - id: kp_2
      statement: Shows that you keep a running sum and stop recursing when the sum exceeds K (pruning).
      required: true
    - id: kp_3
      statement: Mentions that when the running sum equals K you can record the current subset and still
        backtrack to find other solutions.
      required: false
    - id: kp_4
      statement: Notes the time complexity in the worst case is O(2^N) but pruning can reduce it for many
        inputs.
      required: false
    hint_ladder:
    - Think about what information you can maintain as you go deeper in the recursion.
    - When does a branch become hopeless for reaching the target sum?
