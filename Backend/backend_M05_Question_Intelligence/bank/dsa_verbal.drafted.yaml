  prefix_sums__item_2:
    stem: During a code-review you notice a function that repeatedly computes the sum of the first k elements
      of an array inside a loop, leading to O(N²) time. How can you refactor it using prefix sums, and
      what trade-offs does this introduce?
    modality: verbal
    round_types:
