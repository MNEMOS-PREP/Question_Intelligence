      the deeper one, and path compression flattens the structure on each find. This gives inverse-Ackermann
      amortized time, which is effectively constant even for 10,000 vertices. The implementation is simple
      – just three integer arrays – and uses O(n) memory, which is trivial for this size. The only real
      trade-off is recursion depth if you write find recursively; an iterative loop avoids possible stack
      overflow, but both give the same asymptotic performance.'
