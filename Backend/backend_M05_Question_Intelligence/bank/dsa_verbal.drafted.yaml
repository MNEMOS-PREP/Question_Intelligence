  greedy__greedy_correctness_via_matroid_property:
    stem: In a graph you need to build a minimum-cost spanning tree. Explain why Kruskal’s algorithm,
      which repeatedly adds the cheapest edge that doesn’t create a cycle, is guaranteed to produce the
      optimal tree.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:greedy
      weight: 0.7
    - id: concept:minimum_spanning_tree
      weight: 0.15
    - id: concept:heaps
      weight: 0.15
    reference_answer: 'Kruskal’s algorithm works because of the cut property: for any cut in the graph,
      the minimum-weight edge crossing that cut must be part of some minimum spanning tree. When the algorithm
      picks the cheapest edge that connects two different components, it is exactly such a minimum-weight
      crossing edge, so adding it cannot prevent an optimal solution. If an optimal MST omitted this edge,
      it would contain a heavier edge linking the same two components; swapping the heavier edge with
      the greedy one yields another spanning tree with no greater total weight. Repeating this exchange
      shows that the forest built by Kruskal can be extended to an MST, and when all vertices are connected
      the result is the minimum-cost spanning tree.'
    key_points:
    - id: kp_1
      statement: 'Identifies the cut property: the cheapest edge crossing any cut belongs to some MST.'
      required: true
    - id: kp_2
      statement: 'Uses an exchange argument: if a cheaper edge is omitted, swapping it with a heavier
        edge in the current tree yields another spanning tree of lower or equal weight.'
      required: true
    - id: kp_3
      statement: Notes that Kruskal maintains a forest, adding edges only when they connect two different
        components, which preserves acyclicity.
      required: false
    hint_ladder:
    - Recall the cut property of MSTs and how it relates to the edge you are about to add.
    - Consider what would happen if the optimal tree used a different, heavier edge across the same cut.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  interval_scheduling__q1:
    stem: You have a list of meeting requests with start and end times; the conference room can host only
      one meeting at a time. How would you select the maximum number of non-overlapping meetings, and
      why does your method guarantee optimality?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: hard
    time_budget_s: 180
    concepts:
    - id: concept:interval_scheduling
      weight: 0.7
    - id: concept:greedy
      weight: 0.15
    - id: concept:sorting
      weight: 0.15
    reference_answer: First, I would sort all meeting intervals by their end time. Then I scan the sorted
      list, keeping track of the end time of the last meeting I accepted. For each interval, if its start
      time is ≥ that end time, I add it to my schedule and update the end marker. This greedy choice works
      because an optimal solution can always be transformed to one that picks the earliest-finishing meeting
      among those that start earliest, without reducing the total count. By repeatedly applying this exchange
      argument, the algorithm yields the maximum possible number of non-overlapping meetings. The sort
      dominates the runtime, giving O(N log N) time and O(1) extra space.
    key_points:
    - id: kp_1
      statement: Sort the intervals by their finishing times in ascending order.
      required: true
    - id: kp_2
      statement: Iterate once, picking an interval only if its start time is after or equal to the end
        time of the last chosen interval.
      required: true
    - id: kp_3
      statement: Explain that picking the earliest-finishing compatible interval leaves the most room
        for the remaining meetings, which is the exchange argument proving optimality.
      required: true
    - id: kp_4
      statement: State the overall time complexity O(N log N) for sorting plus O(N) for the scan.
      required: false
    hint_ladder:
    - Think about which meeting leaves the most time for the rest of the day.
    - What property of the chosen interval lets you swap it with any optimal solution’s first interval?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  interval_scheduling__q2:
    stem: During a live video-streaming service you notice that the server sometimes runs out of buffer
      space when many streams overlap. You have the start and end timestamps of each stream. How would
      you compute the maximum number of concurrent streams in O(N log N) time, and what data structure
      helps you achieve it?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:interval_scheduling
      weight: 0.7
    - id: concept:heaps
      weight: 0.15
    - id: concept:sorting
      weight: 0.15
    reference_answer: 'I would separate all timestamps into two lists: one for starts and one for ends,
      then sort each list. Using two pointers, I walk through the start list; each time I encounter a
      start I increment a current-streams counter, and each time the next end is earlier than the next
      start I decrement the counter. The maximum value the counter reaches is the peak concurrency. This
      works because the sorted order lets us process events chronologically, and the two-pointer sweep
      is linear after sorting, giving O(N log N) time overall. A min-heap of end times can be used similarly:
      for each start we push its end, and we pop while the smallest end is ≤ the current start; the heap
      size’s maximum is the answer.'
    key_points:
    - id: kp_1
      statement: 'Create two arrays: one of all start times, one of all end times, and sort both.'
      required: true
    - id: kp_2
      statement: Traverse the two arrays with two pointers, incrementing a counter on a start and decrementing
        on an end, tracking the peak count.
      required: true
    - id: kp_3
      statement: Alternatively, push end times into a min-heap while iterating sorted starts, popping
        when the earliest end ≤ current start, and keep the heap size’s maximum.
      required: false
    - id: kp_4
      statement: Explain that the algorithm runs in O(N log N) because of the sorting (or heap operations)
        and O(N) additional work.
      required: false
    hint_ladder:
    - Treat each start as “+1” and each end as “-1” in a timeline.
    - What structure lets you quickly discard streams that have already finished when you see a new start?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  trees__q1:
    stem: You notice a binary tree where each node stores the size of its subtree; during an insertion
      you need to update these sizes. Explain why updating only the nodes on the path from the root to
      the inserted node is sufficient, and state the time complexity.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:trees
      weight: 0.7
    reference_answer: When we insert a new node, only the subtrees that contain that node grow, so only
      the ancestors on the root-to-node path need their stored size incremented. We start at the inserted
      node, move up to its parent, grand-parent, and so on, adding one to each size field. No other node’s
      subtree count changes because its structure is unchanged. Traversing that path touches h nodes,
      where h is the tree height, giving O(h) time. In a balanced binary tree h = O(log n), while in the
      worst case of a completely skewed tree h = O(n).
    key_points:
    - id: kp_1
      statement: Only ancestors of the inserted node have their subtree sizes changed because other subtrees
        remain untouched.
      required: true
    - id: kp_2
      statement: The update proceeds by walking up the path from the inserted node to the root, incrementing
        each stored size by one.
      required: true
    - id: kp_3
      statement: The time complexity is O(h), where h is the height of the tree; in a balanced tree this
        is O(log n).
      required: true
    - id: kp_4
      statement: If the tree is skewed, the worst-case complexity degrades to O(n).
      required: false
    hint_ladder:
    - Think about which parts of the tree are structurally altered by the insertion.
    - Relate the number of nodes you touch to the height of the tree.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  trees__q2:
    stem: During a depth-first traversal of an n-ary tree you accidentally revisit some nodes, causing
      an infinite loop. What could cause this, and how would you fix the traversal to guarantee each node
      is visited exactly once?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:trees
      weight: 0.7
    - id: concept:graph_traversal_dfs
      weight: 0.15
    - id: concept:recursion
      weight: 0.15
    reference_answer: The infinite loop happens because the DFS is walking back up to a node’s parent
      and then down again, essentially treating the structure as a graph with cycles. To stop revisiting,
      we either avoid following parent pointers altogether or keep a visited flag for each node. Before
      recursing into a child we check if it’s already marked; if so we skip it. This guarantees each node
      is processed once, turning the traversal into a true tree DFS with linear O(n) time and a recursion
      depth equal to the tree height.
    key_points:
    - id: kp_1
      statement: The loop occurs because the tree is being treated as a general graph without marking
        visited nodes, allowing back-edges (e.g., parent pointers) to be followed repeatedly.
      required: true
    - id: kp_2
      statement: Introduce a visited set (or a boolean flag in each node) and check it before recursing
        into a child.
      required: true
    - id: kp_3
      statement: Alternatively, ensure the recursion only follows child pointers and never traverses the
        parent link.
      required: false
    - id: kp_4
      statement: With the visited check, the DFS runs in O(n) time and O(h) recursion stack, where h is
        the tree height.
      required: false
    hint_ladder:
    - What extra information can you store on a node to remember that you have already processed it?
    - Consider how a tree differs from a general graph in terms of edges.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
