  divide_and_conquer__q2:
    stem: During a code-review you notice a recursive solution for the closest-pair-of-points problem
      that runs in O(n²). Suggest a divide-and-conquer modification and discuss the trade-offs compared
      to the naïve approach.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:divide_and_conquer
      weight: 0.7
    - id: concept:balanced_trees
      weight: 0.15
    - id: concept:recursion
      weight: 0.15
    reference_answer: The classic divide-and-conquer algorithm first sorts all points by their x-coordinate.
      It then recursively finds the closest pair in the left half and the right half, each of size roughly
      n/2. Let δ be the smaller of those two distances. In the merge step we consider only points whose
      x-coordinate lies within δ of the dividing line, forming a vertical strip. Those points are sorted
      by y-coordinate, and for each point we compare it with the next up to seven points in the strip
      – a property that follows from geometry. This merge work is linear, so the recurrence is T(n)=2T(n/2)+Θ(n),
      which solves to Θ(n log n). Compared with the naïve O(n²) double loop, the divide-and-conquer version
      needs extra O(n) auxiliary space for the sorted lists and incurs the cost of the initial sort, but
      it dramatically reduces runtime for large n.
    key_points:
    - id: kp_1
      statement: Proposes sorting points by x-coordinate and recursively solving left and right halves.
      required: true
    - id: kp_2
      statement: Describes merging step that examines a strip of width 2δ and uses sorting by y-coordinate
        to limit checks to at most 7 neighbours.
