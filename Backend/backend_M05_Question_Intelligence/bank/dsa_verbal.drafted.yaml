  segment_trees__q1:
    stem: In a live leaderboard you need to support point updates to a player's score and queries for
      the total score of players ranked between positions L and R; how would you use a segment tree with
      lazy propagation to handle both efficiently?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:segment_trees
      weight: 0.7
    - id: concept:divide_and_conquer
      weight: 0.15
    - id: concept:arrays
      weight: 0.15
    reference_answer: 'We would build a segment tree over the array of player scores, where each leaf
      stores a single score and each internal node stores the sum of its children. For a point update
      we treat it as a range update of length one: we descend the tree, applying any pending lazy tags,
      update the leaf, and then recompute sums while unwinding. For a range-sum query we start at the
      root and recursively visit only those children whose intervals intersect [L, R]; before using a
      child’s stored sum we push down its lazy tag so that any deferred updates are reflected. Both operations
      touch at most O(log n) nodes, giving O(log n) time, and the tree uses O(n) space.'
    key_points:
    - id: kp_1
      statement: Describes building the tree where each leaf holds a player's score and internal nodes
        store the sum of their segment.
      required: true
    - id: kp_2
      statement: Explains that a point update is a range update of size one, propagated down to the leaf,
        updating ancestors' sums.
      required: true
    - id: kp_3
      statement: Shows that a range-sum query traverses O(log n) nodes, using lazy tags to ensure pending
        updates are applied before reading child sums.
      required: true
    - id: kp_4
      statement: Mentions the overall time complexity per operation is O(log n) and space is O(n).
      required: false
    hint_ladder:
