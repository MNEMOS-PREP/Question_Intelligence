      weight: 0.7
    - id: concept:amortized_analysis
      weight: 0.15
    - id: concept:arrays
      weight: 0.15
    reference_answer: 'I’d first build a prefix-sum array in a single pass: pref[i] = pref[i-1] + arr[i-1].
      Then, instead of looping over the first k elements each time, I just return pref[k] (or pref[k]-pref[0]
      for 0-based) inside the outer loop. This changes the overall complexity from O(N²) to O(N) because
      the heavy work is done once. The downside is we need O(N) extra memory for the prefix array and
      we pay an upfront O(N) cost, but the amortized cost per query becomes constant, which is a net win
      for large N.'
