    concepts:
    - id: concept:linked_lists
      weight: 0.7
    reference_answer: 'The most common cause is that when you prepend a node you forget to link the new
      node to the existing list. If you create a node and then set head = newNode without first doing
      newNode.next = oldHead, the old list becomes unreachable, so traversal skips those nodes. The fix
      is simple: store the current head in a temporary, set newNode.next = temp, then update head = newNode.
      After this change, every node remains linked and a full traversal will visit all inserted elements.'
    key_points:
    - id: kp_1
      statement: The bug is likely due to not updating the new node's next pointer to the previous head.
