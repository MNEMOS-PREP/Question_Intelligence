    reference_answer: 'I would keep all pending tasks in a max-heap, where the key is the task’s priority.
      The heap is stored in an array, so the highest-priority task is always at index 0. When a new task
      arrives I push it onto the heap: I place it at the end of the array and bubble it up, which takes
      O(log n) time. When I need to serve the next task I pop the root: I swap the root with the last
      element, remove the last element, and then heapify down to restore the heap property, also O(log
      n). Both operations are logarithmic, and the heap gives constant-time access to the top element,
      which is ideal for a priority-queue workload.'
    key_points:
