items:
  variables_and_types__q1:
    stem: In Java, you have an int variable a = 2000000000 and you add 1000000000 to it. What happens,
      and why does the result differ from your expectation?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:variables_and_types
      weight: 0.7
    reference_answer: When you add 1,000,000,000 to 2,000,000,000, the mathematical sum is 3,000,000,000,
      which is larger than the maximum value an int can store (2,147,483,647). Because int is a 32-bit
      signed type, the operation overflows and wraps around using two's-complement, yielding a negative
      result (-1294967296). The JVM does not raise an error; it silently wraps. If you cast either operand
      to long, the addition is performed in 64-bit, giving the correct 3,000,000,000.
    key_points:
    - id: kp_1
      statement: The addition overflows because int is a 32-bit signed type with max value 2,147,483,647.
      required: true
    - id: kp_2
      statement: Overflow wraps around to a negative number due to two's-complement representation.
      required: true
    - id: kp_3
      statement: Casting one operand to long before the addition prevents overflow.
      required: false
    hint_ladder:
    - Think about the range of the int type.
    - Consider what happens when a value exceeds that range.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  variables_and_types__q2:
    stem: You need to store the size of a dynamic array that may grow up to 10^9 elements. Which primitive
      type would you choose for the length field in C++, and what are the trade-offs?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 240
    concepts:
    - id: concept:variables_and_types
      weight: 0.7
    - id: concept:arrays
      weight: 0.15
    reference_answer: For an array that might reach a billion elements, you should store its length in
      size_t (or unsigned long long on a typical 64-bit system). size_t is defined to be big enough to
      index any object in memory, usually 64 bits, so it comfortably exceeds 10^9. A signed 32-bit int
      would only go up to about 2.1 × 10^9 and could overflow if the array grows further, leading to undefined
      behavior. The extra memory cost of an 8-byte unsigned type is minimal compared to the safety it
      gives, and it also matches the type returned by the standard library’s size() methods.
    key_points:
    - id: kp_1
      statement: size_t (or unsigned long long on 64-bit) is appropriate because it can represent values
        up to at least 2^64-1, covering 10^9.
      required: true
    - id: kp_2
      statement: Using a signed 32-bit int would overflow at around 2.1×10^9, so it is unsafe for future
        growth beyond that.
      required: true
    - id: kp_3
      statement: Choosing a larger unsigned type adds negligible memory overhead (still 8 bytes on 64-bit)
        but avoids undefined behavior from overflow.
      required: false
    hint_ladder:
    - Consider the maximum value each integer type can represent.
    - Think about memory usage versus range.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  control_flow__q1:
    stem: You need to find the first duplicate element in an array of integers while scanning it only
      once. Which control-flow construct would you use and why?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:control_flow
      weight: 0.7
    reference_answer: I would iterate over the array with a for loop because we need to examine each element
      in order. Inside the loop I would have an if statement that checks whether the current value already
      exists in a hash set that stores the numbers we have seen so far. If the check is true, I immediately
      break out of the loop (or return the element) because we have found the first duplicate. If not,
      I insert the value into the set and continue. This combination of a loop for traversal and an if-condition
      for detection lets us stop as soon as the condition is satisfied, giving O(n) time and O(n) extra
      space.
    key_points:
    - id: kp_1
      statement: Uses a loop (for/while) to iterate through the array.
      required: true
    - id: kp_2
      statement: Inside the loop, uses an if-else (or if) to check whether the current element is already
        in a set.
      required: true
    - id: kp_3
      statement: Breaks out of the loop (or returns) as soon as a duplicate is found, demonstrating early
        termination.
      required: true
    - id: kp_4
      statement: Mentions that the set provides O(1) average lookup, keeping overall time O(n).
      required: false
    hint_ladder:
    - Think about early exit when a condition is met.
    - You may need a data structure to track what you have seen.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  control_flow__q2:
    stem: Imagine you are debugging a program that unexpectedly runs forever. The only loop in the code
      is a while loop that increments a counter until it reaches a target value. What typical control-flow
      mistake could cause the infinite run?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:control_flow
      weight: 0.7
    reference_answer: The most likely control-flow error is that the while condition never becomes false
      because the counter isn’t moving toward the target as expected. A typical cause is using the wrong
      relational operator – for example writing while (i <= n) and then incrementing i inside the loop,
      but the loop body also contains a statement that resets i or the increment skips the exact value,
      so i never exceeds n. In short, the loop condition and the update are mismatched, causing the loop
      to run forever. The fix is to verify the operator (< vs <=) and ensure the increment reliably moves
      i toward the bound.
    key_points:
    - id: kp_1
      statement: Identifies that the loop condition may never become false because the counter is not
        updated correctly.
      required: true
    - id: kp_2
      statement: 'Points out a common mistake: using the wrong relational operator (e.g., <= instead of
        <) together with an increment that skips the terminating value.'
      required: true
    - id: kp_3
      statement: Suggests checking that the increment actually moves the counter toward the target and
        that the condition reflects the intended bound.
      required: false
    - id: kp_4
      statement: Mentions that placing the increment inside the loop body versus the loop header can also
        cause the condition to stay unchanged.
      required: false
    hint_ladder:
    - Consider the loop condition and the update statement.
    - Think about off-by-one errors.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  functions_and_scope__q1:
    stem: In a recursive function that computes the nth Fibonacci number, why does each recursive call
      have its own copy of the local variable `n`, and what would happen if `n` were mistakenly declared
      as a global variable?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:functions_and_scope
      weight: 0.7
    reference_answer: When you call a recursive function, the runtime pushes an activation record onto
      the call stack. That record contains the function's parameters and local variables, so each invocation
      gets its own copy of `n`. As the recursion goes deeper, each frame holds the `n` value for that
      level, and when the function returns, the frame is popped, restoring the previous `n`. If you declared
      `n` as a global variable, every call would share the same memory location. Updating `n` in one call
      would affect all other pending calls, breaking the independence of each step. The result would be
      wrong Fibonacci numbers, and in many cases the recursion would never reach its base case because
      the global `n` keeps changing, leading to a stack overflow.
    key_points:
    - id: kp_1
      statement: Each call gets its own `n` because function parameters are stored on the call stack as
        part of the activation record.
      required: true
    - id: kp_2
      statement: If `n` were global, all recursive calls would read and write the same variable, causing
        incorrect results and likely infinite recursion.
      required: true
    - id: kp_3
      statement: The call stack unwinds, restoring each caller's `n` value, which is why recursion works
        correctly with local scope.
      required: false
    hint_ladder:
    - Think about where parameters are stored during a function call.
    - What does ‘global’ mean for variable visibility across calls?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  functions_and_scope__q2:
    stem: During a code review you notice a function that modifies a passed-in array but also returns
      a new array; the caller uses the returned value and later accesses the original array. What scope-related
      bugs could arise, and how would you redesign the function?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:functions_and_scope
      weight: 0.7
    - id: concept:arrays
      weight: 0.15
    reference_answer: 'The problem is that the array is passed by reference, so when the function changes
      it, the caller’s original variable sees those changes. If the caller later reads the original array
      assuming it’s unchanged, they’ll get unexpected values, leading to bugs that are hard to trace.
      The clean fix is to avoid side-effects: either work on a copy of the input and return that, or,
      if in-place modification is intended, make that explicit in the API—e.g., name the function `sortInPlace`
      and document that it mutates its argument. This way the caller knows whether to keep the original
      or use the returned array, eliminating scope-related surprises.'
    key_points:
    - id: kp_1
      statement: Modifying the passed-in array creates side-effects because the caller still holds a reference
        to that same memory.
      required: true
    - id: kp_2
      statement: If the caller expects the original array unchanged, the side-effect can cause logical
        errors or data corruption later.
      required: true
    - id: kp_3
      statement: A better design is to either (a) make the function pure by not mutating the input and
        only returning a new array, or (b) clearly document the mutation and perhaps rename the function
        to indicate it works in-place.
      required: false
    hint_ladder:
    - Remember how Java/Python handle passing mutable objects.
    - What does ‘pure function’ mean in terms of side-effects?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  pointers_and_references__q1:
    stem: In C++, you have a function that takes a pointer to an int and sets the value to 0. If you call
      it with a null pointer, what happens at runtime and how would you safely guard against it?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:pointers_and_references
      weight: 0.7
    reference_answer: 'When you pass a null pointer and the function dereferences it, the program invokes
      undefined behavior; on most systems it crashes with a segmentation fault. To avoid that, you should
      first check if the pointer equals nullptr (or NULL) and return early or signal an error. A common
      pattern is: if (!p) return; *p = 0;. Alternatively, you could redesign the API to take an int& so
      the caller must provide a valid object, eliminating the null-pointer risk.'
    key_points:
    - id: kp_1
      statement: Dereferencing a null pointer leads to undefined behavior, often a crash (segmentation
        fault).
      required: true
    - id: kp_2
      statement: A safe guard is to test if the pointer is nullptr before dereferencing.
      required: true
    - id: kp_3
      statement: Optionally, the function could return a bool indicating success or take a reference instead
        of a pointer.
      required: false
    hint_ladder:
    - Think about dereferencing a null pointer.
    - Consider adding a check before using the pointer.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  pointers_and_references__q2:
    stem: During a debugging session you notice that two different variables in a linked-list implementation
      point to the same node unexpectedly. Explain how aliasing with pointers can cause this and what
      practice prevents accidental sharing.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 240
    concepts:
    - id: concept:pointers_and_references
      weight: 0.7
    - id: concept:linked_lists
      weight: 0.15
    reference_answer: When you write something like `Node* a = head; Node* b = a;` you are not creating
      a new node; you are just copying the address, so `a` and `b` become aliases of the same node. Any
      change through one pointer instantly changes what the other sees, which can corrupt the list – for
      example, deleting through `a` leaves `b` dangling, or inserting a new node via `b` may create an
      unintended cycle. The usual safeguard is to avoid shallow copies of list nodes; instead allocate
      a fresh node and copy the payload (deep copy), or use ownership-aware smart pointers (unique_ptr)
      so that only one pointer can own a node at a time.
    key_points:
    - id: kp_1
      statement: Assigning one pointer to another creates an alias; both variables refer to the same memory
        location.
      required: true
    - id: kp_2
      statement: If a node is unintentionally shared, modifications through one alias affect the other,
        leading to bugs like cycles or lost nodes.
      required: true
    - id: kp_3
      statement: Prevent this by performing a deep copy of the node (allocating a new node and copying
        its data) or by using smart pointers with clear ownership semantics.
      required: false
    hint_ladder:
    - Recall that assigning one pointer to another copies the address, not the object.
    - Think about deep vs shallow copy.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  space_complexity__q1:
    stem: When you implement quicksort on an array of size N, does the algorithm require O(N) extra space,
      and why is it still considered an in-place sort?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:space_complexity
      weight: 0.7
    - id: concept:arrays
      weight: 0.15
    reference_answer: Quicksort is classified as an in-place algorithm because it sorts the elements by
      rearranging them inside the original array; it never allocates another array of size N. The only
      extra memory it needs is the recursion stack. On average, the depth of recursive calls is O(log
      N), so the auxiliary space is O(log N). In the worst case, when the pivot choices are poor and the
      recursion becomes linear, the stack can grow to O(N), but even then no extra array is created. Hence
      quicksort’s extra space is sub-linear, which satisfies the definition of an in-place sort.
    key_points:
    - id: kp_1
      statement: Quicksort uses only O(log N) extra space for the recursion stack in its average case.
      required: true
    - id: kp_2
      statement: No extra arrays or data structures proportional to N are allocated, so it is called in-place.
      required: true
    - id: kp_3
      statement: In the worst case (already sorted input) the recursion depth can become O(N), increasing
        space usage.
      required: false
    - id: kp_4
      statement: The partition step itself works within the original array without additional memory.
      required: false
    hint_ladder:
    - Think about what part of quicksort uses additional memory.
    - Recall the difference between recursive call stack space and auxiliary data structures.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  amortized_analysis__q1:
    stem: You have a binary counter implemented with an array of bits that you increment repeatedly; each
      increment flips some trailing 1s to 0 and a 0 to 1. What is the amortised time per increment and
      why?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:amortized_analysis
      weight: 0.7
    - id: concept:arrays
      weight: 0.15
    - id: concept:bit_manipulation
      weight: 0.15
    reference_answer: When we increment a binary counter, we start at the least-significant bit and flip
      1s to 0 until we hit a 0, which we turn to 1. The i-th bit (0-based) changes state every 2^i increments,
      so over N increments it flips at most N/2^i times. Summing over all bits gives Σ_{i=0}^{log N} N/2^i
      = 2N, i.e., O(N) total flips. Dividing by N gives an amortised cost of O(1) per increment. Occasionally
      an increment may flip many bits, costing O(log N), but such expensive steps are rare enough that
      the average stays constant.
    key_points:
    - id: kp_1
      statement: Each bit flips from 0 to 1 at most once every 2^k increments, where k is its position.
      required: true
    - id: kp_2
      statement: Summing the flips over all bits for N increments yields O(N) total work.
      required: true
    - id: kp_3
      statement: Therefore the amortised cost per increment is O(1).
      required: true
    - id: kp_4
      statement: The worst-case cost of a single increment can be O(log N) when many trailing 1s are flipped.
      required: false
    hint_ladder:
    - Think about how many times each bit changes over many increments.
    - Total work over N increments divided by N gives the amortised cost.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  recurrence_relations__q1:
    stem: You have a recursive function that splits an array of size n into three equal parts and recursively
      processes each part, with O(n) work to combine the results. What is its time complexity using the
      Master Theorem?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:recurrence_relations
      weight: 0.7
    - id: concept:divide_and_conquer
      weight: 0.15
    - id: concept:arrays
      weight: 0.15
    reference_answer: The recurrence is T(n) = 3 T(n/3) + Θ(n). Here a = 3, b = 3, so log_b a = log_3
      3 = 1, giving n^{log_b a} = n. The combine cost f(n) is also Θ(n), which matches the n^{log_b a}
      term. This is the second case of the Master Theorem, yielding T(n) = Θ(n log n). Hence the algorithm
      runs in n log n time.
    key_points:
    - id: kp_1
      statement: Identifies a = 3, b = 3, and f(n) = Θ(n).
      required: true
    - id: kp_2
      statement: Computes n^{log_b a} = n^{log_3 3} = n.
      required: true
    - id: kp_3
      statement: Compares f(n) with n^{log_b a} and concludes they are Θ-equal, so case 2 of the Master
        Theorem applies.
      required: true
    - id: kp_4
      statement: States the overall recurrence solves to Θ(n log n).
      required: true
    hint_ladder:
    - Write the recurrence in the form T(n) = a T(n/b) + f(n).
    - Compare f(n) with n^{log_b a} to pick the correct Master case.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  recurrence_relations__q2:
    stem: During a code review you notice a recursive binary-search implementation that makes two recursive
      calls instead of one. The recurrence is T(n)=2T(n/2)+O(1). Explain why this is inefficient and state
      its asymptotic running time.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:recurrence_relations
      weight: 0.7
    - id: concept:binary_search
      weight: 0.15
    - id: concept:recursion
      weight: 0.15
    reference_answer: The recurrence is T(n)=2T(n/2)+Θ(1). Here a=2, b=2, so log_b a =1 and n^{log_b a}=n.
      Since the non-recursive work is constant, we fall into Master case 1, giving T(n)=Θ(n). That means
      the function runs linear time, whereas a proper binary search does Θ(log n). The extra recursive
      call destroys the logarithmic divide-and-conquer advantage, making the implementation inefficient.
    key_points:
    - id: kp_1
      statement: Writes the recurrence T(n)=2T(n/2)+Θ(1).
      required: true
    - id: kp_2
      statement: Shows that n^{log_b a}=n^{log_2 2}=n, so by Master case 1 the solution is Θ(n).
      required: true
    - id: kp_3
      statement: Points out that optimal binary search should be Θ(log n), so making two calls doubles
        work and loses the logarithmic advantage.
      required: true
    - id: kp_4
      statement: 'Mentions the fix: keep only one recursive call after comparing the middle element.'
      required: false
    hint_ladder:
    - Identify a and b in the recurrence and compute n^{log_b a}.
    - Recall the optimal time for binary search.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  arrays__q1:
    stem: You have an array of size N that you need to insert an element at the beginning repeatedly.
      In an interview, how would you explain the time complexity of this operation and why a dynamic array
      may not be ideal here?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:arrays
      weight: 0.7
    reference_answer: When you insert at the front of a plain array you have to move every existing element
      one slot to the right to keep the data contiguous. That shift is O(N) for a single insert. If you
      do this N times, the total work becomes O(N²). Even though a dynamic array can grow automatically,
      it still stores elements in a contiguous block, so the shifting cost doesn’t disappear. The only
      way to get constant-time front insertions is to use a structure that doesn’t require shifting, such
      as a singly linked list, where you just adjust the head pointer.
    key_points:
    - id: kp_1
      statement: Inserting at index 0 of a contiguous array requires shifting all existing elements one
        position to the right.
      required: true
    - id: kp_2
      statement: Therefore each insertion costs O(N) time, leading to O(N²) for N repeated insertions.
      required: true
    - id: kp_3
      statement: A dynamic array (like vector) still stores elements contiguously, so the shift cost remains
        the same.
      required: false
    - id: kp_4
      statement: Using a linked list would give O(1) insertion at the front.
      required: false
    hint_ladder:
    - Think about what must happen to the existing elements when you add a new one at index 0.
    - Consider the difference between contiguous storage and pointer-based storage.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  arrays__q2:
    stem: During a coding test you notice the solution uses a sliding-window over an integer array to
      find the longest subarray with sum ≤ K. Explain why the sliding-window works here and what the underlying
      array property is.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 240
    concepts:
    - id: concept:arrays
      weight: 0.7
    - id: concept:sliding_window
      weight: 0.15
    - id: concept:time_complexity
      weight: 0.15
    reference_answer: The sliding-window works because the array consists of non-negative integers. When
      you extend the right end, the sum can only stay the same or increase, never drop, so you can safely
      keep expanding until you exceed K. At that point you move the left end forward, subtracting elements,
      which reduces the sum. Because each element is added and removed at most once, the total work is
      linear, O(N). This relies on the monotonic increase of the sum; with negative numbers the sum could
      decrease after adding an element and the window would no longer be valid.
    key_points:
    - id: kp_1
      statement: The window can be moved because all numbers are non-negative, so expanding the window
        never decreases the sum.
      required: true
    - id: kp_2
      statement: When the sum exceeds K, shrinking from the left reduces the sum while preserving order,
        keeping the algorithm O(N).
      required: true
    - id: kp_3
      statement: If the array contained negative numbers the monotonic property would break and the technique
        would fail.
      required: false
    - id: kp_4
      statement: The algorithm maintains the best length seen so far as it slides.
      required: false
    hint_ladder:
    - What happens to the sum when you add a non-negative element?
    - Why can you safely move the left pointer only when the sum is too large?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
