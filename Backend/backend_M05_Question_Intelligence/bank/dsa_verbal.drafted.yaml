  graph_traversal_dfs__dfs_vs_bfs_in_detecting_cycles_in_an_und:
    stem: In an interview you are given an undirected graph and asked to detect whether it contains a
      cycle. Which traversal would you choose, DFS or BFS, and why does that choice make cycle detection
      straightforward?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:graph_traversal_dfs
      weight: 0.7
    reference_answer: I would use DFS. While exploring, each time we move to an unvisited neighbor we
      record the current node as its parent. If we encounter a neighbor that is already visited and is
      not the parent, that edge is a back-edge and proves a cycle exists. The parent check prevents the
      trivial edge back to where we came from from being mis-identified as a cycle. BFS can also work
      by checking visited neighbors that aren't the parent, but the back-edge notion in DFS makes the
      logic cleaner. Both traversals run in O(V+E) time and use O(V) extra space for the visited array
      and recursion stack or queue.
    key_points:
    - id: kp_1
      statement: Chooses DFS because back-edges in the DFS tree directly indicate a cycle in an undirected
        graph.
      required: true
    - id: kp_2
      statement: Explains that during DFS we keep track of the parent node to avoid mistaking the immediate
        edge back to the parent for a cycle.
      required: true
    - id: kp_3
      statement: Mentions that BFS can also detect cycles but requires checking if a visited neighbor
        is not the parent, which is less natural than the back-edge test in DFS.
      required: false
    - id: kp_4
      statement: States the overall time complexity is O(V+E) and space is O(V) for the recursion/queue.
      required: false
    hint_ladder:
    - Think about what extra information DFS naturally gives you about the edge you are traversing.
    - How do you differentiate the edge you came from versus a true cross edge?
