  bit_manipulation__q2:
    stem: In a system that stores user permissions as a 32-bit mask, you notice a bug where revoking a
      permission sometimes leaves other bits unchanged. How would you correctly clear a specific permission
      bit using bitwise operators?
    modality: verbal
