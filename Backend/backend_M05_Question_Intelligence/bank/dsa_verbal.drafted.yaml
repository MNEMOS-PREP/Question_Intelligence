    reference_answer: First order the eight distinct tasks; there are 8! permutations. To allocate them
      to four distinct employees with each receiving at least one, we place three separators in the seven
      gaps between consecutive tasks. Choosing three gaps out of seven gives C(7,3) possibilities, and
      each choice uniquely defines which consecutive tasks go to each employee because order matters.
      Hence the total number of distributions is 8! × C(7,3) = 40,320 × 35 = 1,411,200.
