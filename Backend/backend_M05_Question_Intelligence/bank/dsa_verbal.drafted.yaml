  string_matching__q1:
    stem: You have a large text of length N and need to find all occurrences of a pattern of length M
      using KMP. Explain why KMP runs in O(N+M) time and what the failure function represents.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:string_matching
      weight: 0.7
    - id: concept:strings
      weight: 0.15
    reference_answer: KMP first builds a failure (or prefix) table for the pattern. For each position
      i it records the length of the longest proper prefix that matches a suffix ending at i, which tells
      us how far we can shift the pattern without re-examining characters. Building this table scans the
      pattern once, so O(M). In the search phase we compare characters of the text and pattern; when a
      mismatch occurs we jump the pattern index to the failure value instead of resetting to zero. This
      jump never moves the text pointer backward, so each text character is compared at most twice. Hence
      the matching runs in O(N). Adding the O(M) preprocessing gives a total O(N+M) time bound.
    key_points:
    - id: kp_1
      statement: The failure function stores the length of the longest proper prefix of the pattern that
        is also a suffix for each prefix.
      required: true
    - id: kp_2
      statement: During the scan, the algorithm never moves the text index backwards, ensuring each character
        is examined at most twice.
      required: true
    - id: kp_3
      statement: Computing the failure function itself takes O(M) time by iterating once over the pattern.
      required: false
    - id: kp_4
      statement: Overall time is O(N+M) because the matching phase is linear in N and the preprocessing
        phase is linear in M.
      required: true
