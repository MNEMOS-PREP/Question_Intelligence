  segment_trees__q2:
    stem: During a code-review you notice a segment-tree implementation that rebuilds the entire tree
      after every update instead of using lazy propagation. What are the performance implications, and
      why is lazy propagation the preferred technique?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: hard
    time_budget_s: 180
    concepts:
    - id: concept:segment_trees
      weight: 0.7
    - id: concept:time_complexity
      weight: 0.15
    - id: concept:space_complexity
      weight: 0.15
    reference_answer: Rebuilding the whole segment tree after each update forces you to touch every node,
      which is O(n) work per update. If you have m updates, the total time becomes O(m·n), which quickly
      blows up even for moderate n. Lazy propagation, on the other hand, stores a pending update flag
      at each node; an update only modifies O(log n) nodes and defers the rest until a query needs the
      exact values. This keeps each operation at O(log n) and the overall memory overhead at O(n) for
      the tree plus another O(n) array of lazy tags. Hence, lazy propagation preserves the logarithmic
      performance guarantee and avoids the quadratic blow-up of the naive rebuild method.
    key_points:
    - id: kp_1
      statement: States that rebuilding the whole tree costs O(n) per update, turning a sequence of m
        updates into O(m·n) time.
      required: true
    - id: kp_2
      statement: Notes that lazy propagation limits each update to O(log n) by deferring work to future
        queries.
      required: true
    - id: kp_3
      statement: Points out that the extra memory for lazy tags is only O(n), negligible compared to rebuilding
        cost.
      required: false
    - id: kp_4
      statement: Highlights that in the worst case (e.g., many range updates) the naive rebuild approach
        can cause time-outs, while lazy propagation maintains logarithmic guarantees.
      required: true
    hint_ladder:
    - Compare the cost of a single update in both approaches.
    - Consider worst-case scenarios with many updates.
