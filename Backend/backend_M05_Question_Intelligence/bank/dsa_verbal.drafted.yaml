  modular_arithmetic__modexp_scenario:
    stem: In a cryptographic library you need to compute (1234567^987654) mod 1000000007 quickly; how
      would you do it and why is it efficient?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:modular_arithmetic
      weight: 0.7
    - id: concept:number_theory
      weight: 0.15
    reference_answer: I would use binary exponentiation, also called exponentiation by squaring. Start
      with result = 1, base = 1234567 mod 1,000,000,007. While the exponent is non-zero, if the current
      exponent bit is 1 multiply result by base and take mod; then square the base and take mod, shift
      the exponent right. This performs at most 2·log₂(987654) modular multiplications, so the overall
      time is O(log exponent). Because we reduce modulo after every multiplication, the numbers never
      grow beyond the modulus, avoiding overflow and keeping the computation fast.
    key_points:
    - id: kp_1
      statement: Describes binary exponentiation (exponentiation by squaring) that repeatedly squares
        the base and multiplies when the current exponent bit is 1.
      required: true
    - id: kp_2
      statement: Mentions taking the modulus after each multiplication to keep intermediate values within
        range and avoid overflow.
      required: true
    - id: kp_3
      statement: States the time complexity is O(log exponent) multiplications.
      required: false
    - id: kp_4
      statement: Notes that this method works because (a·b) mod m = [(a mod m)·(b mod m)] mod m.
      required: false
    hint_ladder:
    - Think about how you can use the binary representation of the exponent.
    - Remember the property (a·b) mod m = [(a mod m)·(b mod m)] mod m.
