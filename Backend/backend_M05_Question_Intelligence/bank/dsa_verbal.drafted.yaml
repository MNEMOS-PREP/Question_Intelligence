  edit_distance__q1:
    stem: Suppose you have two strings, "kitten" and "sitting". In an interview you are asked to compute
      the minimum number of single-character insertions, deletions or substitutions to convert the first
      into the second. How would you approach this problem and what is the answer?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:edit_distance
      weight: 0.7
    - id: concept:dynamic_programming
      weight: 0.15
    - id: concept:strings
      weight: 0.15
    reference_answer: I would use the standard dynamic-programming solution. Create a table dp of size
      (|kitten|+1)×(|sitting|+1). dp[i][j] holds the edit distance between the first i characters of "kitten"
      and the first j characters of "sitting". Initialise dp[i][0]=i and dp[0][j]=j. For each cell, if
      the characters are equal we copy dp[i-1][j-1]; otherwise we take 1 plus the minimum of deletion
      (dp[i-1][j]), insertion (dp[i][j-1]) and substitution (dp[i-1][j-1]). Filling the table gives dp[6][7]=3,
      meaning three operations (substitute k→s, substitute e→i, insert g). The algorithm runs in O(m·n)
      time and can be reduced to O(min(m,n)) space with a rolling array.
    key_points:
    - id: kp_1
      statement: Describes the classic DP formulation with a (m+1)×(n+1) table where dp[i][j] stores edit
        distance between prefixes of lengths i and j.
      required: true
    - id: kp_2
      statement: 'States the recurrence: if characters match dp[i][j]=dp[i-1][j-1]; else dp[i][j]=1+min(dp[i-1][j],
        dp[i][j-1], dp[i-1][j-1]).'
      required: true
    - id: kp_3
      statement: Computes the final value for "kitten" (len 6) and "sitting" (len 7) as 3.
      required: true
    - id: kp_4
      statement: Mentions O(m·n) time and O(m·n) (or O(min(m,n)) with rolling array) space.
      required: false
    hint_ladder:
    - Recall the DP table is built row by row using previous row/column values.
    - What operation does each of the three min terms correspond to?
