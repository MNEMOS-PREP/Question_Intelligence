  binary_search__q1:
    stem: You notice a function that should return the index of a target in a sorted array is sometimes
      returning -1 even though the target is present. What could be going wrong in the binary search implementation?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:binary_search
      weight: 0.7
    - id: concept:arrays
      weight: 0.15
    reference_answer: The most common cause is an off-by-one error when moving the low and high pointers.
      If you set low = mid + 1 after a comparison but compute mid as (low + high)/2 without guarding against
      overflow, you might skip the target index. Also, if the loop condition is while(low <= high) but
      you update high = mid - 1 incorrectly, the search space can shrink past the target. Another subtle
      bug is integer overflow in mid calculation; using mid = low + (high - low)/2 avoids that. Finally,
      ensure the array is actually sorted, because binary search assumes a monotonic order. Fixing these
      pointer updates and mid computation usually resolves the -1 returns.
    key_points:
    - id: kp_1
      statement: The low/high pointers may be updated incorrectly, causing the search space to skip the
        target.
      required: true
    - id: kp_2
      statement: Using integer overflow or wrong mid calculation (e.g., (low+high)/2) can lead to infinite
        loops or missed indices.
      required: true
    - id: kp_3
      statement: Not handling the case when low exceeds high properly results in premature termination
        with -1.
      required: false
    - id: kp_4
      statement: Ensuring the array is truly sorted in non-decreasing order is a prerequisite for binary
        search correctness.
      required: false
    hint_ladder:
    - Think about the loop termination condition and how mid is computed.
    - Consider off-by-one errors when updating low and high.
