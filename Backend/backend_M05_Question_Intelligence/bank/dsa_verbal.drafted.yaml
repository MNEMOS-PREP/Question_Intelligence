  graph_traversal_bfs__bfs_debug_scenario:
    stem: In a game map represented as a 2D grid, you run BFS from the player’s start cell to find the
      nearest health pack, but the algorithm keeps visiting the same cell repeatedly. What could be wrong
      and how would you fix it?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:graph_traversal_bfs
      weight: 0.7
    - id: concept:queues
      weight: 0.15
    - id: concept:graphs_representation
      weight: 0.15
    reference_answer: 'The problem is that BFS isn’t marking cells as visited when they are put into the
      queue. Because each neighbour checks the grid independently, the same cell can be enqueued from
      multiple directions, so the algorithm keeps pulling it out and re-adding it, leading to repeated
      visits or an infinite loop. The fix is simple: maintain a visited boolean array (or set) and set
      visited[row][col] = true at the moment you enqueue the cell. This ensures each cell is processed
      only once, restores the linear O(V+E) time, and the search will correctly return the distance to
      the nearest health pack.'
    key_points:
    - id: kp_1
      statement: The likely bug is that the visited-set (or visited array) is not being updated when a
        cell is enqueued.
      required: true
    - id: kp_2
      statement: Fix by marking a cell as visited at the time of enqueue, not when it is dequeued.
      required: true
    - id: kp_3
      statement: Explain that BFS uses a queue, so without proper visited tracking the same cell can be
        enqueued from multiple neighbours, causing an infinite loop or exponential blow-up.
      required: false
    - id: kp_4
      statement: Mention that the time complexity returns to O(V+E) once the visited check is correct.
      required: false
    hint_ladder:
    - Think about what BFS uses to avoid revisiting nodes.
    - Consider the data structure that marks visited cells.
