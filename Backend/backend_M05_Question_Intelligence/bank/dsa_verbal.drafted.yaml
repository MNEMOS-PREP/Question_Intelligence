  two_pointers__q1:
    stem: You have a sorted array of integers that may contain duplicates. How would you use two pointers
      to find the first and last position of a given target value in O(n) time, and why does this work?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:two_pointers
      weight: 0.7
    - id: concept:arrays
      weight: 0.15
    - id: concept:binary_search
      weight: 0.15
    reference_answer: I’d start with two indices, i = 0 and j = n-1. While i ≤ j, I check the element
      at i; if it’s less than the target I increment i, otherwise I stop because i now points at the first
      possible target. Similarly, I move j backwards while arr[j] > target, stopping when arr[j] ≤ target.
      After these two scans, i is at the first occurrence and j at the last occurrence of the target,
      provided i ≤ j. If i > j, the value isn’t present. Because each element is examined at most once,
      the total work is O(n) and we only need O(1) extra space.
    key_points:
    - id: kp_1
      statement: Initialises left pointer at start and right pointer at end of array.
      required: true
    - id: kp_2
      statement: Moves left pointer forward until it points to the target or passes the right pointer.
      required: true
    - id: kp_3
      statement: Moves right pointer backward until it points to the target or crosses the left pointer.
      required: true
    - id: kp_4
      statement: If pointers cross without finding the target, reports that the target is absent.
      required: false
    hint_ladder:
    - Think about moving one pointer from the left until you can’t go further without skipping the target.
    - Do a symmetric scan from the right side.
