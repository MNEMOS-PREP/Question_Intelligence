  longest_increasing_subsequence__q2_tradeoff_dp_vs_patience:
    stem: A recruiter asks you to compare the classic O(N^2) DP solution for LIS with the O(N log N) patience-sorting
      method in terms of time, space, and ease of reconstruction of the actual subsequence.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:longest_increasing_subsequence
      weight: 0.7
    - id: concept:dynamic_programming
      weight: 0.15
    - id: concept:binary_search
      weight: 0.15
    reference_answer: The DP approach computes dp[i] = 1 + max{dp[j] | j<i and a[j] < a[i]}, giving O(N^2)
      time and O(N) space. Because we store the index of the predecessor that gave the max, we can reconstruct
      the LIS by following those links, which is straightforward. The patience-sorting method maintains
      a tails array and uses binary search, achieving O(N log N) time with the same O(N) auxiliary space
      for tails and a parent array. However, reconstruction is not automatic; we must keep an extra array
      of predecessors and the index of the last element of the longest pile, then walk back. So DP is
      easier to implement and to retrieve the sequence, while the O(N log N) version wins on speed for
      large inputs but adds a small bookkeeping overhead.
    key_points:
    - id: kp_1
      statement: DP runs in O(N^2) time, O(N) space, and naturally provides predecessor pointers for easy
        reconstruction.
      required: true
    - id: kp_2
      statement: Patience sorting runs in O(N log N) time, O(N) space, but needs extra bookkeeping (parent
        indices) to rebuild the sequence.
      required: true
    - id: kp_3
      statement: Both use linear extra space; the DP method is simpler to code, while the O(N log N) method
        is preferred for large N where performance matters.
      required: false
    hint_ladder:
    - Recall what each algorithm stores for every element.
    - Think about how you would backtrack the subsequence in each approach.
