    reference_answer: The most common hidden cost is the dynamic array that backs the binary heap. If
      the heap keeps growing and the resize policy is to increase capacity by a small factor, each resize
      copies the whole array, which is O(n) and can show up as a spike in insert latency. I would first
      log the heap size before each insert and watch for frequent growth events. If I see many resizes,
      I’d either pre-allocate a larger buffer or change the growth factor to something like 2×, which
      makes the amortized cost of inserts stay O(log n). I’d also profile the insert routine to ensure
      the extra time isn’t coming from cache misses or excessive swaps due to many equal priorities. Fixing
      the resize strategy or switching to a more cache-friendly implementation restores the expected logarithmic
      performance.
    key_points:
