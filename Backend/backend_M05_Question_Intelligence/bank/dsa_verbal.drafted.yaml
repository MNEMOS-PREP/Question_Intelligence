  prefix_sums__item_1:
    stem: 'You have an array of daily sales for the last year and need to answer many queries of the form:
      total sales from day L to day R inclusive. How would you preprocess the data and answer each query
      efficiently?'
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:prefix_sums
      weight: 0.7
    - id: concept:arrays
      weight: 0.15
    reference_answer: I would create a prefix-sum array of length N+1, initializing pref[0] = 0. While
      scanning the original sales array once, I set pref[i] = pref[i-1] + sales[i-1]. After this O(N)
      preprocessing, any range query [L,R] can be answered instantly by returning pref[R] – pref[L-1],
      which is O(1). This uses O(N) extra space. If the sales data were mutable, we’d need to rebuild
      or switch to a Fenwick or segment tree, but for static queries this is optimal.
    key_points:
    - id: kp_1
      statement: Build a prefix-sum array where pref[i] = sum of first i elements (1-based).
      required: true
    - id: kp_2
      statement: Answer a query [L,R] as pref[R] - pref[L-1] in O(1) time.
      required: true
    - id: kp_3
      statement: Preprocessing takes O(N) time and O(N) extra space.
      required: false
    - id: kp_4
      statement: Mention that updates to the original array would require recomputation or a different
        structure.
      required: false
