  topological_sort__q1:
    stem: You have a set of courses with prerequisites forming a directed graph; a student tells you they
      detected a cycle and can't finish. Explain how you would use topological sort to detect the cycle
      and what the algorithm’s outcome tells you.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:topological_sort
      weight: 0.7
    - id: concept:graph_traversal_bfs
      weight: 0.15
    - id: concept:graphs_representation
      weight: 0.15
    reference_answer: To detect a cycle we can run Kahn's topological sort. First compute indegrees for
      all courses, then repeatedly pick any course with indegree zero, add it to the order and decrement
      indegrees of its neighbours. If the graph is acyclic we will eventually process every vertex, producing
      a full ordering. However, if at some step there is no vertex with indegree zero while some vertices
      are still unprocessed, the remaining vertices form a cycle, meaning the student cannot finish those
      courses. Thus, a completed ordering signals no cycle, and an early stop signals a cycle.
    key_points:
    - id: kp_1
      statement: 'Describes Kahn''s algorithm: repeatedly remove nodes with indegree zero.'
      required: true
    - id: kp_2
      statement: States that if at any point no zero-indegree node exists while vertices remain, a cycle
        exists.
      required: true
    - id: kp_3
      statement: Mentions that a successful topological order (all vertices processed) implies the graph
        is acyclic.
      required: false
    hint_ladder:
    - Think about what Kahn's algorithm does when it cannot find a node with indegree 0.
    - Relate the number of processed vertices to the total number of courses.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  topological_sort__q2:
    stem: In a build system, tasks depend on each other and you need to schedule them efficiently. Compare
      using a DFS-based topological sort versus Kahn’s algorithm in terms of space usage, recursion risk,
      and ease of detecting cycles.
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:topological_sort
      weight: 0.7
    - id: concept:graph_traversal_dfs
      weight: 0.15
    - id: concept:queues
      weight: 0.15
    reference_answer: 'A DFS-based topological sort performs a depth-first search, pushing nodes onto
      a stack when the recursion unwinds. It needs O(V) space for the recursion stack (or an explicit
      stack) and uses three colour states to spot back edges, so a cycle is found when a back edge appears.
      Kahn’s algorithm, on the other hand, keeps an indegree array and a queue of zero-indegree vertices;
      it also uses O(V) space but avoids deep recursion, making it safer for very large or deep graphs.
      Cycle detection in Kahn’s is implicit: if the queue empties while vertices remain, a cycle exists.
      Both produce a valid ordering, but DFS gives a reverse-postorder and can be easier to implement
      if recursion is acceptable, while Kahn’s is iterative and often preferred for its straightforward
      cycle check and lower risk of stack overflow.'
    key_points:
    - id: kp_1
      statement: DFS version uses recursion (or explicit stack) and marks nodes as visited, on-stack,
        and finished to detect back edges.
      required: true
    - id: kp_2
      statement: DFS needs O(V) extra space for recursion stack; Kahn’s uses a queue and indegree array,
        also O(V) but no deep recursion.
      required: true
    - id: kp_3
      statement: Cycle detection in DFS is natural via back-edge detection; Kahn’s detects a cycle when
        the queue becomes empty before all vertices are processed.
      required: false
    - id: kp_4
      statement: DFS gives a reverse post-order directly, while Kahn’s produces a forward order; both
        are valid topological orders.
      required: false
    hint_ladder:
    - Consider what data structures each algorithm maintains during execution.
    - Think about what happens when the graph is deep versus when many nodes have zero indegree.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
