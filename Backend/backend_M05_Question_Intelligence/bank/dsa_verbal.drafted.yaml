    reference_answer: Generating every substring with two loops produces about n·(n+1)/2 substrings, so
      the time is Θ(n^2) and if you keep them in a list the space is also Θ(n^2). If the goal is just
      the longest repeated substring, you don’t need to materialise all of them. One practical improvement
      is to use a sliding window of increasing length and store each window’s hash in a hash set; when
      a collision occurs you’ve found a repeated substring of that length. You can binary-search the length
      and use a rolling hash (Rabin-Karp) to check each length in O(n) time, giving O(n log n) overall,
      or use suffix-array based methods for O(n). This cuts both time and space dramatically, keeping
      only O(n) auxiliary space.
    key_points:
