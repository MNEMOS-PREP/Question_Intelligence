  number_theory__q2:
    stem: Why does the product of the greatest common divisor and the least common multiple of two positive
      integers equal the product of the numbers themselves?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: intro
    time_budget_s: 150
    concepts:
    - id: concept:number_theory
      weight: 0.7
    - id: concept:modular_arithmetic
      weight: 0.15
    reference_answer: 'Write a and b in prime-factor form: a = ∏p p^{α_p}, b = ∏p p^{β_p}. The GCD takes
      the lower exponent for each prime, min(α_p,β_p), while the LCM takes the higher, max(α_p,β_p). When
      you multiply them, the exponents add: min+max = α_p+β_p, so gcd·lcm = ∏p p^{α_p+β_p} = (∏p p^{α_p})(∏p
      p^{β_p}) = a·b. Hence the product of GCD and LCM always equals the product of the two numbers.'
    key_points:
    - id: kp_1
      statement: 'Writes each number as a product of prime powers: a = ∏p p^{α_p}, b = ∏p p^{β_p}.'
      required: true
    - id: kp_2
      statement: Shows that gcd(a,b) = ∏p p^{min(α_p,β_p)} and lcm(a,b) = ∏p p^{max(α_p,β_p)}.
      required: true
    - id: kp_3
      statement: Multiplying gcd and lcm gives ∏p p^{min+max} = ∏p p^{α_p+β_p} = a·b.
      required: true
    - id: kp_4
      statement: Notes that the identity holds for any pair of positive integers, independent of their
        specific values.
      required: false
    hint_ladder:
    - Express both numbers via their prime factorisation.
    - Recall how GCD and LCM pick min and max exponents.
