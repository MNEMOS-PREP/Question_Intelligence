  strongly_connected_components__scc_01:
    stem: In a large directed graph representing web pages, you run Kosaraju's algorithm and notice the
      first DFS finishes in a different order than the second pass. Why does the finishing-time order
      matter for correctly identifying strongly connected components?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:strongly_connected_components
      weight: 0.7
    - id: concept:graph_traversal_dfs
      weight: 0.15
    - id: concept:graphs_representation
      weight: 0.15
    reference_answer: Kosaraju relies on the fact that the condensation of a directed graph is a DAG.
      The first DFS on the original graph records finishing times; vertices that finish later belong to
      source SCCs in the DAG. When we reverse the graph and process vertices in decreasing finishing-time
      order, each DFS is confined to exactly one SCC because there are no outgoing edges to unvisited
      components in the transpose. This guarantees that we collect all vertices of an SCC before we ever
      start exploring another. If we ignored the order, a DFS could walk across component boundaries and
      incorrectly merge distinct SCCs, breaking the algorithm.
    key_points:
    - id: kp_1
      statement: Finishing times give a reverse topological order of the condensation DAG, ensuring that
        the second DFS explores each SCC completely before reaching another.
      required: true
    - id: kp_2
      statement: The first pass on the original graph records when each vertex's recursion ends, which
        is later used to order vertices for the second pass on the transpose.
      required: true
    - id: kp_3
      statement: If vertices are processed in arbitrary order in the second pass, a DFS could cross component
        boundaries and merge separate SCCs.
      required: true
    hint_ladder:
    - Think about what the transpose does to edge directions.
    - Why does a source component in the original graph become a sink in the transpose?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  strongly_connected_components__scc_02:
    stem: During a live system you observe that after adding a new directed edge, the number of strongly
      connected components drops from 12 to 9. What is happening in the graph, and how would you efficiently
      update the SCC decomposition without recomputing from scratch?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:strongly_connected_components
      weight: 0.7
    - id: concept:graph_traversal_dfs
      weight: 0.15
    - id: concept:amortized_analysis
      weight: 0.15
    reference_answer: Adding the edge introduces a new directed path that links two or more previously
      disjoint SCCs, so they collapse into a single component, reducing the count. To update efficiently,
      we look at the tail of the edge and run a forward DFS in the original graph to find all vertices
      that become reachable, and a backward DFS from the head to find all vertices that can now reach
      it. The intersection of these two reachability sets forms the merged SCC. By maintaining the condensation
      DAG and using a union-find on its nodes, we can merge the affected components in almost linear time
      overall, giving an amortized cost far lower than recomputing Kosaraju or Tarjan from scratch.
    key_points:
    - id: kp_1
      statement: The new edge creates a path that connects previously separate SCCs, merging them into
        a larger component.
      required: true
    - id: kp_2
      statement: An incremental SCC algorithm can update the decomposition by exploring only the vertices
        reachable from the edge’s tail and those that can reach its head.
      required: true
    - id: kp_3
      statement: Using a union-find structure on the condensation DAG or a dynamic DFS/BFS from the affected
        vertices gives amortized near-linear update time.
      required: true
    hint_ladder:
    - Consider reachability both forward from the source and backward from the destination of the new
      edge.
    - What structure represents SCCs compactly and supports quick merges?
