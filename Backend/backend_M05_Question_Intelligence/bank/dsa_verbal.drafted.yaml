  monotonic_stack__q1:
    stem: You are given an array of daily temperatures and need to output, for each day, how many days
      you must wait until a warmer temperature; the naive O(N²) solution is too slow. How does a monotonic
      stack solve this in linear time?
    modality: verbal
    round_types:
    - dsa_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:monotonic_stack
      weight: 0.7
    - id: concept:arrays
      weight: 0.15
    - id: concept:amortized_analysis
      weight: 0.15
    reference_answer: We iterate the temperature array once, keeping a stack that stores indices of days
      whose next warmer day hasn't been found yet. The stack is kept monotonic decreasing – the temperatures
      at those indices are in non-increasing order. For each new day i, while the stack isn’t empty and
      temp[i] > temp[stack.top()], we pop the top index j and set answer[j] = i - j because i is the first
      warmer day for j. After processing all pops we push i onto the stack. Because each index is pushed
      once and popped once, the total work is linear, O(N), and we use O(N) extra space for the stack
      and answer array. Days that never see a warmer temperature remain with the default value, e.g.,
      0.
    key_points:
