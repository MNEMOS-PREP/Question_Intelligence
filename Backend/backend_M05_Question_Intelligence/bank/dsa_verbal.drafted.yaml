    reference_answer: I would choose counting sort. First, allocate a frequency array of size 5,000 initialized
      to zero. Scan the input once, incrementing the count for each value – that’s O(n). Then iterate
      over the frequency array, outputting each value the number of times it appears, which is another
      O(k) pass. Since k = 5,000 is tiny compared to n = 10 million, the overall time is O(n + k) ≈ O(n).
      The extra space is the frequency array, O(k), plus the output array, so overall O(k) auxiliary space.
      This gives a linear-time, stable sort perfectly suited to the given constraints.
    key_points:
