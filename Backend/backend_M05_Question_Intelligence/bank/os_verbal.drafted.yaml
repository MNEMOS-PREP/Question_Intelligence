    reference_answer: Even though getpid() simply returns a value, it is still a system call, so the CPU
      must trap to kernel mode, switch stacks, and execute the dispatcher. The kernel then reads the process’s
      task_struct to fetch the PID, which may involve acquiring a spinlock to protect the structure and
      can cause a cache line bounce on multi-core systems. Each trap also flushes the TLB entry for the
      user-mode page tables. If the program calls getpid() thousands of times per second, these overheads
      add up, leading to the slowdown. Caching the PID after the first call avoids the repeated traps.
    key_points:
    - id: kp_1
      statement: Notes that getpid() still requires a trap to kernel mode, incurring a mode switch overhead.
      required: true
    - id: kp_2
      statement: Mentions that the kernel may need to acquire a lock or read a per-process data structure,
        which can cause cache misses or contention.
      required: false
    - id: kp_3
      statement: Points out that if the call is inside a tight loop, the cumulative cost of many traps
        and possible TLB flushes becomes noticeable.
      required: true
    - id: kp_4
      statement: Suggests alternatives such as caching the PID in user space or using gettid() only when
        necessary.
      required: false
    hint_ladder:
    - Recall what a system call actually does to the CPU state.
    - Consider what data structures the kernel must touch for getpid.
