  memory_management__q1:
    stem: In a long-running server you notice its memory usage keeps growing even after requests finish;
      what could be causing heap fragmentation and how would you detect and mitigate it?
    modality: verbal
    round_types:
    - os_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:memory_management
      weight: 0.7
    reference_answer: 'The growth is likely due to external fragmentation: the server repeatedly allocates
      objects of different sizes, frees them, and leaves many small holes that cannot satisfy larger future
      allocations, so malloc keeps requesting more pages from the OS. You can spot this by checking heap
      statistics with tools like valgrind''s massif, malloc_info, or by printing the free-list distribution;
      a high ratio of free blocks to total free memory indicates fragmentation. To mitigate, you can switch
      to a memory pool or slab allocator that reuses fixed-size chunks, or redesign the code to allocate
      objects of similar size and batch-free them, which reduces the number of size classes and keeps
      the heap more compact.'
    key_points:
    - id: kp_1
      statement: Describes how repeated allocations and deallocations of varying sizes can leave small
        free blocks that are unusable for larger requests (external fragmentation).
      required: true
    - id: kp_2
      statement: Mentions tools or techniques to observe fragmentation, e.g., heap profiling, malloc_info,
        or looking at free-list statistics.
      required: true
    - id: kp_3
      statement: Proposes mitigation strategies such as using memory pools, slab allocators, or allocating
        objects of uniform size.
      required: false
    - id: kp_4
      statement: Notes that internal fragmentation can also arise from over-allocation due to alignment
        or size classes.
      required: false
    hint_ladder:
    - Think about what malloc does when it cannot find a suitably sized free block.
    - What observability does Linux give you about the heap?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  memory_management__q2:
    stem: Your OS uses a simple bump-pointer allocator for the stack; a recursive function suddenly crashes
      with a segmentation fault. Explain why stack allocation can fail and how it differs from heap allocation
      in this scenario.
    modality: verbal
    round_types:
    - os_verbal
    difficulty_band: intro
    time_budget_s: 150
    concepts:
    - id: concept:memory_management
      weight: 0.7
    - id: concept:pointers_and_references
      weight: 0.15
    reference_answer: A bump-pointer stack allocator simply moves a pointer down the pre-reserved stack
      region for each call. The stack size is fixed at process start, and the OS places a guard page at
      its end. When the recursive function calls itself many times, the pointer eventually crosses into
      the guard page, which is unmapped, so the CPU raises a segmentation fault. Unlike the heap, which
      grows on demand via malloc and can return NULL on failure, the stack cannot expand beyond its limit;
      it overflows instead of returning an error. Thus the crash is a stack overflow, not a heap allocation
      failure.
    key_points:
    - id: kp_1
      statement: Explains that the stack grows downward (or upward) in a contiguous region and has a fixed
        size limit; deep recursion can exceed this limit causing a stack overflow.
      required: true
    - id: kp_2
      statement: Contrasts with heap allocation, which obtains memory from a much larger pool managed
        by malloc and can fail with NULL rather than a fault.
      required: true
    - id: kp_3
      statement: Mentions that the segmentation fault occurs because the CPU tries to write to an unmapped
        page beyond the stack guard page.
      required: false
    hint_ladder:
    - Recall what a guard page does for a process's stack.
    - How does malloc behave when it cannot allocate more memory?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  virtual_memory__vm_01:
    stem: In a production server you notice that the RSS of a critical process keeps growing even though
      its working set should be stable; what could be happening in the virtual memory subsystem?
    modality: verbal
    round_types:
    - os_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:virtual_memory
      weight: 0.7
    - id: concept:page_replacement
      weight: 0.15
    - id: concept:memory_management
      weight: 0.15
    reference_answer: When RSS climbs unexpectedly, the process is likely incurring many page faults.
      The OS may have swapped out pages that the process still accesses, so each fault brings a page back,
      increasing resident memory. An aggressive replacement policy like Clock or a mis-tuned LRU can cause
      this. Additionally, mechanisms such as transparent huge pages or copy-on-write can cause pages to
      be materialised, inflating RSS. Checking the fault count via /proc/<pid>/stat or vmstat and looking
      at smaps will reveal a high major-fault rate and swap-in activity, confirming the virtual-memory
      behaviour.
    key_points:
    - id: kp_1
      statement: Explains that the process may be experiencing page faults due to aggressive swapping
        or a working-set expansion caused by memory-intensive operations.
      required: true
    - id: kp_2
      statement: Describes how the OS may be using a page-replacement algorithm (e.g., LRU or Clock) that
        evicts pages still needed, causing repeated faults and RSS growth.
      required: true
    - id: kp_3
      statement: Mentions that transparent huge pages or copy-on-write mappings can inflate RSS when pages
        are materialized.
      required: false
    - id: kp_4
      statement: Suggests checking /proc/<pid>/smaps or vmstat to confirm the fault rate and swap activity.
      required: false
    hint_ladder:
    - Think about what RSS measures and how pages become resident.
    - What OS actions can cause a stable working set to appear larger?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  virtual_memory__vm_02:
    stem: Your team wants to reduce the latency of a latency-sensitive service by pinning its memory;
      explain why simply allocating a large contiguous virtual region may not achieve the intended performance
      benefit.
    modality: verbal
    round_types:
    - os_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:virtual_memory
      weight: 0.7
    - id: concept:context_switching
      weight: 0.15
    - id: concept:memory_management
      weight: 0.15
    reference_answer: Allocating a huge contiguous virtual block does not guarantee contiguous physical
      memory. The MMU still walks page tables, and each page may be scattered across different frames,
      leading to TLB misses and cache line inefficiency. Moreover, on NUMA systems the pages could be
      placed on a remote node, so latency stays high unless you use NUMA-aware policies or allocate huge
      pages. Even if you pin the virtual region with mlock, the OS can swap or migrate pages unless you
      also request huge pages and set the appropriate numa node. Finally, frequent context switches flush
      the TLB, so the process must stay on the same core to keep the translation cache warm.
    key_points:
    - id: kp_1
      statement: States that virtual addresses are translated via page tables, so a large contiguous virtual
        region may be backed by non-contiguous physical pages, causing TLB misses.
      required: true
    - id: kp_2
      statement: Notes that without NUMA-aware allocation, the pages may reside on remote memory nodes,
        increasing access latency despite pinning.
      required: true
    - id: kp_3
      statement: Mentions that the OS can still swap out or migrate pages unless mlock/hugepages and NUMA
        policies are used.
      required: false
    - id: kp_4
      statement: Highlights that context switches can flush TLB entries, so the benefit of pinning is
        lost unless the process stays on the same core.
      required: false
    hint_ladder:
    - Consider the difference between virtual contiguity and physical contiguity.
    - What hardware structures are affected by page-level mapping?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  paging_and_segmentation__q1:
    stem: Your OS uses paging with a single-level page table. A process suddenly experiences a huge increase
      in page faults after a new feature is deployed. What could be causing this, and how would you diagnose
      it?
    modality: verbal
    round_types:
    - os_verbal
    difficulty_band: core
    time_budget_s: 150
    concepts:
    - id: concept:paging_and_segmentation
      weight: 0.7
    - id: concept:page_replacement
      weight: 0.15
    - id: concept:memory_management
      weight: 0.15
    reference_answer: The spike in faults usually means the new feature is touching memory regions that
      weren’t previously in the process’s working set. I would first look at the fault log or use perf
      to see which virtual addresses are faulting. If they belong to newly allocated buffers, the working
      set has grown and the current page replacement policy may be evicting useful pages too aggressively.
      I’d verify the allocation pattern – maybe the code is scanning a large array linearly, causing many
      cold pages. Depending on the finding, I could increase the allocated RAM, tune the replacement algorithm
      (e.g., switch from FIFO to LRU), or add prefetching. If the faults are on addresses that should
      be mapped, I’d suspect a bug like an off-by-one index that walks off the end of a buffer.
    key_points:
    - id: kp_1
      statement: Identifies that the new feature likely changes the program's working set, causing accesses
        to pages that were previously unused.
      required: true
    - id: kp_2
      statement: Mentions checking the page fault rate and the specific virtual addresses causing faults
        via tools like /proc/pid/numa_maps or perf.
      required: true
    - id: kp_3
      statement: Suggests possible remedies such as increasing the working set size, adjusting the page
        replacement algorithm, or pre-loading critical pages.
      required: false
    - id: kp_4
      statement: Notes that a bug like an off-by-one error could be causing accesses to unmapped regions,
        leading to excessive faults.
      required: false
    hint_ladder:
    - Think about the relationship between virtual address patterns and page table entries.
    - Consider what the OS does when a page is not in memory.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  paging_and_segmentation__q2:
    stem: In a system that supports both paging and segmentation, a programmer complains that a segmentation
      fault occurs even though the address is within the segment limits. What mechanisms could let this
      happen?
    modality: verbal
    round_types:
    - os_verbal
    difficulty_band: hard
    time_budget_s: 180
    concepts:
    - id: concept:paging_and_segmentation
      weight: 0.7
    - id: concept:virtual_memory
      weight: 0.15
    - id: concept:memory_management
      weight: 0.15
    reference_answer: Even if the offset is inside the segment’s limit, the MMU first adds the segment
      base to get a linear address, then looks up that address in the page table. If the linear address
      lands in a page that is not present or has protection bits that deny the requested operation, the
      hardware raises a segmentation fault. So a common cause is that the segment is correctly defined
      but the page containing the address is unmapped or read-only. Additionally, a stale TLB entry for
      the segment or page can cause the CPU to use an old translation that points to an invalid page,
      also triggering a fault. Finally, sometimes the segment limit is set in units of pages while the
      programmer assumes bytes, causing the offset to appear valid while the resulting linear address
      is out of bounds.
    key_points:
    - id: kp_1
      statement: Explains that the segment’s base address is added to the offset before paging, so the
        resulting linear address may fall outside a valid page.
      required: true
    - id: kp_2
      statement: Mentions that protection bits in the page table (e.g., read/write/execute) can cause
        a fault even if the segment permits the access.
      required: true
    - id: kp_3
      statement: Notes that a stale TLB entry for the segment or page can cause a mismatch, leading to
        a fault.
      required: false
    - id: kp_4
      statement: Points out that a mis-configured segment limit (e.g., limit in bytes vs. pages) could
        be the root cause.
      required: false
    hint_ladder:
    - Recall the order in which the MMU translates addresses.
    - Think about protection bits and TLB behavior.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  page_replacement__q1:
    stem: Your web server process suddenly starts swapping heavily and response time spikes; you suspect
      a page-replacement issue. How would you determine which algorithm is currently in use and what its
      impact is on the observed thrashing?
    modality: verbal
    round_types:
    - os_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:page_replacement
      weight: 0.7
    - id: concept:virtual_memory
      weight: 0.15
    - id: concept:memory_management
      weight: 0.15
    reference_answer: 'I would first look at the page-fault rate using tools like vmstat or /proc/vmstat;
      a very high fault count that spikes when the server load rises hints at thrashing. Then I’d examine
      the pattern of faults: if the same set of pages keep being evicted and re-loaded in a round-robin
      fashion, that’s characteristic of FIFO. If faults occur on pages that were just used, that points
      to an LRU-like behavior. On Linux you can read /sys/devices/system/cpu/present or the "swap" stats
      to see which algorithm the kernel is using, or run a short reference trace with ‘perf record’ and
      compare it to known FIFO/LRU traces. Once I confirm the algorithm, I can argue that FIFO’s lack
      of recency awareness is causing the hot pages to be swapped out, leading to thrashing, and that
      moving to an LRU or working-set replacement would keep those hot pages resident and restore response
      times.'
    key_points:
    - id: kp_1
      statement: Describes checking page fault rate and the pattern of page references (e.g., FIFO shows
        cyclic faults, LRU shows faults on recently used pages).
      required: true
    - id: kp_2
      statement: Explains that a high fault rate with repeatedly re-accessed pages indicates FIFO or sub-optimal
        algorithm causing thrashing.
      required: true
    - id: kp_3
      statement: Mentions using /proc/pid/stat or performance counters to see the current replacement
        policy or to simulate it with a trace.
      required: false
    - id: kp_4
      statement: Suggests that switching to LRU or a working-set algorithm would reduce thrashing by keeping
        hot pages resident.
      required: false
    hint_ladder:
    - Think about observable metrics and how different algorithms treat page faults.
    - Consider a simple experiment you could run without modifying the kernel.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  page_replacement__q2:
    stem: During a design review you must choose a page-replacement policy for an embedded real-time system
      with limited RAM; what trade-offs would you discuss between FIFO, LRU, and the optimal algorithm?
    modality: verbal
    round_types:
    - os_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:page_replacement
      weight: 0.7
    - id: concept:process_scheduling
      weight: 0.15
    - id: concept:memory_management
      weight: 0.15
    reference_answer: I would start by saying FIFO is the cheapest to implement – a simple circular buffer
      gives O(1) eviction, which is great for a hard-real-time guarantee, but it can suffer Belady’s anomaly
      and may evict pages that will be needed soon, causing unpredictable miss rates. LRU offers a much
      higher hit ratio because it keeps the most recently used pages, but tracking recency needs extra
      data structures – a stack, timestamps, or a hardware reference bit – which adds overhead and can
      increase worst-case page-fault latency, something a real-time system may not tolerate. The optimal
      algorithm gives the best possible miss rate by evicting the page that will be used farthest in the
      future, but it requires clairvoyance, so it’s only a theoretical bound. In this embedded context,
      I would recommend a FIFO or a low-overhead approximation of LRU such as the clock algorithm, because
      they give deterministic behavior and fit the limited RAM budget, while acknowledging the trade-off
      of a slightly higher miss rate compared to true LRU.
    key_points:
    - id: kp_1
      statement: States that FIFO is simple O(1) to implement with a queue but can suffer Belady’s anomaly,
        leading to unpredictable miss rates.
      required: true
    - id: kp_2
      statement: Explains LRU gives better hit ratio by tracking recent use, but needs extra hardware
        or software (e.g., counters or stack) increasing overhead and worst-case latency.
      required: true
    - id: kp_3
      statement: Mentions optimal replacement is unattainable in practice because it needs future reference
        knowledge, but serves as a benchmark.
      required: true
    - id: kp_4
      statement: 'Relates the real-time constraint: deterministic execution time favors FIFO or a approximated
        LRU (clock) over true LRU.'
      required: false
    hint_ladder:
    - Focus on implementation cost, predictability, and worst-case latency.
    - Recall that optimal is theoretical and requires future knowledge.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  file_systems__q1:
    stem: In a Linux system you notice that creating many small files in a directory makes listing it
      sluggish; what does the underlying file system structure have to do with this behavior?
    modality: verbal
    round_types:
    - os_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:file_systems
      weight: 0.7
    reference_answer: A directory in Unix-like systems is just a special file that contains a list of
      (name, inode) pairs. In older file systems like ext2 each entry is appended to the end, so to find
      a name the kernel scans the list sequentially – O(n) time. When you have thousands of tiny files,
      that linear scan for every ls or open call becomes noticeable, making the directory appear sluggish.
      Newer file systems such as ext4, XFS or Btrfs replace the flat list with a hashed B-tree or other
      indexed structure, giving near constant-time lookups and preventing the slowdown. Hence the performance
      issue is directly tied to how the directory’s metadata is organized.
    key_points:
    - id: kp_1
      statement: Directories are essentially files that map file names to inode numbers.
      required: true
    - id: kp_2
      statement: Older file systems (e.g., ext2) store directory entries in a simple linear list, so lookup
        is O(n).
      required: true
    - id: kp_3
      statement: When many small files exist, the linear scan becomes costly, causing slow ls.
      required: true
    - id: kp_4
      statement: Modern file systems (e.g., ext4, XFS) use hashed B-trees or other indexing to achieve
        near O(1) lookup, mitigating the problem.
      required: false
    hint_ladder:
    - Think about how directories are stored and searched.
    - Consider the difference between linear and hashed directory implementations.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  file_systems__q2:
    stem: Your application crashes after a power loss; you discover the file system uses journaling. Explain
      why journaling helps and what scenario could still cause corruption.
    modality: verbal
    round_types:
    - os_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:file_systems
      weight: 0.7
    reference_answer: 'Journaling works by first recording the intended changes—usually the metadata updates—in
      a separate log area. Only after the log entry is safely on disk does the file system apply the changes
      to the main structures. If power is lost, on reboot the FS scans the journal: completed transactions
      are replayed, incomplete ones are ignored, bringing the metadata back to a consistent state. However,
      most journaling modes (write-back) do not journal the actual file data, only the metadata. So if
      the crash occurs after data blocks have been written but before their corresponding metadata entry
      is committed, the file may contain stale or partially written data, leading to corruption despite
      a clean journal replay. Ordered or data-journaling modes mitigate this by ensuring data is flushed
      before its metadata is logged.'
    key_points:
    - id: kp_1
      statement: Journaling writes intent (metadata changes) to a dedicated log before applying them to
        the main file system structures.
      required: true
    - id: kp_2
      statement: After a crash, the system replays the journal, replaying committed transactions and discarding
        incomplete ones, restoring consistency.
      required: true
    - id: kp_3
      statement: Data blocks themselves may not be journaled in write-back mode, so if a power loss occurs
        after data is written but before its metadata is committed, the file can become corrupted.
      required: true
    - id: kp_4
      statement: Full-data (ordered) journaling reduces this risk by ensuring data is flushed before its
        metadata is logged.
      required: false
    hint_ladder:
    - Recall the two phases of a journaled write.
    - Think about what is not protected by the journal.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
