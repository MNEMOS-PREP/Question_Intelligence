      the class-weight parameter was reset, leading to a model that’s now biased toward the majority.
      To debug, I’d first pull the latest data statistics and compare minority-class prevalence and feature
      means to the training set. Then I’d run the current model on a fresh, stratified validation set
      to see if the drop is reproducible. I’d also check the pipeline logs to ensure resampling and scaling
      are still applied. If the issue is a drift, I’d retrain with recent balanced data or adjust thresholds,
      and set up ongoing class-wise metric monitoring.
