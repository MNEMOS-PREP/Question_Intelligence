  regularisation__q2:
    stem: During a Kaggle competition you applied L1 regularisation to a logistic regression model and
      observed many coefficients become exactly zero. Why does L1 produce sparsity, and when might that
      be advantageous over L2?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:regularisation
      weight: 0.7
    - id: concept:logistic_regression
      weight: 0.15
    - id: concept:feature_engineering
      weight: 0.15
    reference_answer: L1 regularisation adds the absolute value of each weight to the loss, producing
      a diamond-shaped constraint region with corners at the axes. Because the optimisation can reduce
      loss by moving to those corners, many weights are driven exactly to zero, giving a sparse model.
      This acts as built-in feature selection, which is handy when you have thousands of predictors, want
      a simpler, more interpretable model, or need to reduce inference cost. In contrast, L2 shrinks weights
      smoothly but rarely makes them zero, so it retains all features even if some are noisy.
    key_points:
    - id: kp_1
      statement: States that L1 adds a penalty equal to the absolute value of weights, creating a kink
        at zero that encourages coefficients to hit exactly zero.
      required: true
    - id: kp_2
      statement: Explains that sparsity performs implicit feature selection, reducing model size and improving
        interpretability.
      required: true
    - id: kp_3
      statement: Mentions scenarios such as high-dimensional data or when deployment resources are limited
        where L1 is preferable.
      required: false
    - id: kp_4
      statement: Notes that L2 keeps all features but shrinks them, so it may retain noisy predictors.
      required: false
    hint_ladder:
    - Recall the shape of the L1 penalty geometry compared to L2.
    - Think about what happens when many features are irrelevant or costly to compute.
