  feature_engineering__q2:
    stem: During a Kaggle competition you built a gradient-boosted tree model and observed that scaling
      numeric features (standardisation) improved its performance. Why does scaling affect tree-based
      models, and is it always advisable?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:feature_engineering
      weight: 0.7
    - id: concept:decision_trees
      weight: 0.15
    - id: concept:gradient_descent
      weight: 0.15
    reference_answer: Pure decision-tree splits look only at orderings of values, so multiplying a numeric
      feature by a constant does not affect where the optimal split lies – the algorithm is scale-invariant.
      However, many modern gradient-boosted frameworks (like XGBoost or LightGBM) add regularisation terms
      on leaf weights that are optimised with gradient descent; these terms depend on the scale of the
      feature values. When features have vastly different ranges, the gradient steps can be dominated
      by large-scale features, hurting convergence. In such cases standardising numeric columns can lead
      to smoother training and slightly better performance. That said, scaling is not a blanket requirement
      for tree-based models; it only matters for implementations that blend tree learning with gradient-based
      optimisation or when you combine trees with linear models.
    key_points:
    - id: kp_1
      statement: Tree algorithms are invariant to monotonic transformations, so pure scaling should not
        change split decisions.
      required: true
    - id: kp_2
      statement: Scaling can help when the implementation uses gradient-based leaf-weight optimisation
        or regularisation that depends on feature magnitudes.
      required: true
    - id: kp_3
      statement: Therefore scaling is not universally required; it is only beneficial for certain implementations
        or when features are combined with linear components.
      required: false
    hint_ladder:
    - Recall how tree splits are chosen.
    - Think about interaction with regularisation or early-stopping.
