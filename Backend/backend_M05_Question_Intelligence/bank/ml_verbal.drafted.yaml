  regression_metrics__q2:
    stem: A stakeholder asks you to compare MAE and MSE for a sales-forecasting model. How would you explain
      the practical differences and when you’d prefer one metric over the other?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: intro
    time_budget_s: 150
    concepts:
    - id: concept:regression_metrics
      weight: 0.7
    reference_answer: Mean Absolute Error (MAE) is the average of the absolute differences between predicted
      and actual values, so each error contributes linearly and the result is in the same units as the
      target, making it easy to interpret. Mean Squared Error (MSE) squares each error before averaging,
      which amplifies larger mistakes; it’s more sensitive to outliers and penalises big deviations heavily.
      If the business can tolerate occasional large errors, MAE is preferable because it’s robust. If
      large errors are very costly—say, stock-outs or over-production—MSE (or its square root, RMSE) highlights
      those risks and is more appropriate.
    key_points:
    - id: kp_1
      statement: Explains that MAE measures average absolute error, giving equal weight to all errors.
      required: true
    - id: kp_2
      statement: Explains that MSE squares errors, penalising larger deviations more heavily.
      required: true
    - id: kp_3
      statement: Notes that MSE is more sensitive to outliers, making it useful when large errors are
        especially costly.
      required: false
    - id: kp_4
      statement: Mentions that MAE is easier to interpret in the original units and is robust to outliers.
      required: false
    hint_ladder:
    - Consider how each metric treats a single large mistake versus many small ones.
    - Think about the business impact of occasional big forecast errors.
