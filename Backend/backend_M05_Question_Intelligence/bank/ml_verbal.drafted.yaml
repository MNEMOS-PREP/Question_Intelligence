  cross_validation__item_1:
    stem: You have a small, imbalanced dataset for a binary classification problem. Explain why plain
      k-fold cross-validation might give misleading performance estimates and how you would adjust the
      procedure.
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:cross_validation
      weight: 0.7
    - id: concept:class_imbalance
      weight: 0.15
    - id: concept:data_leakage
      weight: 0.15
    reference_answer: With an imbalanced binary dataset, a random k-fold split can put most minority samples
      in a few folds, leaving other folds with almost no positives. That makes the measured accuracy swing
      wildly and hides poor recall. The remedy is to use stratified k-fold, which forces each fold to
      keep the original class proportion, so every validation set contains a representative minority sample.
      Also, any preprocessing that uses the whole data—like scaling or feature selection—must be performed
      inside the training part of each fold to avoid data leakage. Finally, report metrics such as precision,
      recall, F1-score or AUROC, which reflect performance on the minority class better than plain accuracy.
    key_points:
    - id: kp_1
      statement: Mentions that each fold may contain very few minority-class examples, causing high variance
        in metrics.
      required: true
    - id: kp_2
      statement: Describes using stratified k-fold to preserve class distribution in every split.
      required: true
    - id: kp_3
      statement: Notes that leaking information through preprocessing done before splitting can further
        bias results.
      required: false
    - id: kp_4
      statement: Suggests evaluating with metrics suited to imbalance (e.g., F1, AUROC) rather than accuracy.
      required: false
    hint_ladder:
    - Think about what each fold’s class distribution looks like.
    - Consider the order of preprocessing relative to the split.
