  data_leakage__q2_impact_metrics_leakage:
    stem: During a Kaggle competition you achieve 0.98 AUC on the hold-out set, but later discover your
      pipeline leaked the label. Explain why such leakage inflates evaluation metrics and what the practical
      consequences are.
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:data_leakage
      weight: 0.7
    - id: concept:classification_metrics
      weight: 0.15
    reference_answer: When label leakage occurs, the model receives features that are directly derived
      from or highly correlated with the target, so it can almost perfectly rank positive versus negative
      instances. This pushes the AUC to near 1, making the metric look excellent even though the model
      hasn't learned any genuine patterns. Consequently, the reported performance is misleading; once
      the model is deployed on clean, non-leaked data, its predictive power drops dramatically, potentially
      causing wrong forecasts or decisions. The practical impact is wasted engineering effort, possible
      financial loss, and damage to stakeholder confidence. Detecting and removing leakage is essential
      to obtain a realistic evaluation.
    key_points:
    - id: kp_1
      statement: Leakage gives the model access to information that correlates perfectly with the label,
        so it can separate classes almost flawlessly, driving AUC close to 1.
      required: true
    - id: kp_2
      statement: The inflated metric hides the model's true ability to generalise to unseen, clean data.
      required: true
    - id: kp_3
      statement: In production the model will perform far worse, leading to poor business decisions or
        loss of trust.
      required: true
    - id: kp_4
      statement: Detecting leakage early saves time and resources by prompting a redesign of the feature
        pipeline.
      required: false
    hint_ladder:
    - Recall what AUC measures and what the model actually sees.
    - Think about deployment versus competition environment.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
