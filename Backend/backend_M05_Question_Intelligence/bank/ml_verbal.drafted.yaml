  regularisation__q1:
    stem: You notice your linear regression model's training error is much lower than its validation error.
      How does adding an L2 regularisation term help, and what trade-off does it introduce?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:regularisation
      weight: 0.7
    - id: concept:bias_variance_tradeoff
      weight: 0.15
    - id: concept:linear_regression
      weight: 0.15
    reference_answer: 'Adding an L2 term means we minimise the loss plus λ times the sum of squared weights.
      The penalty shrinks all coefficients toward zero, preventing any single feature from dominating
      and thus reducing model variance. As λ grows, the model becomes smoother and less sensitive to training
      noise, which raises bias but lowers over-fitting, so validation error improves. In effect, λ lets
      us balance bias and variance: a small λ keeps the model flexible, a large λ forces it toward a simpler,
      higher-bias solution.'
    key_points:
    - id: kp_1
      statement: Explains that L2 adds a penalty proportional to the sum of squared weights, discouraging
        large coefficients.
      required: true
    - id: kp_2
      statement: Describes how the penalty reduces variance (overfitting) at the cost of increasing bias.
      required: true
    - id: kp_3
      statement: Mentions that the regularisation strength λ controls the bias-variance trade-off.
      required: false
    - id: kp_4
      statement: Notes that weight decay is equivalent to L2 regularisation in gradient-descent training.
      required: false
    hint_ladder:
