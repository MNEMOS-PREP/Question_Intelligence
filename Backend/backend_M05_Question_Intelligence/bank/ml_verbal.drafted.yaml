  dimensionality_reduction__q1:
    stem: You have a high-dimensional dataset of 10,000 features for a classification task, but training
      is too slow. Explain how you would use PCA to speed up training and what you must watch out for
      regarding model performance.
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:dimensionality_reduction
      weight: 0.7
    - id: concept:feature_engineering
      weight: 0.15
    - id: concept:overfitting
      weight: 0.15
    reference_answer: I would first standardise the features because PCA is sensitive to scale. Then I
      would compute the covariance matrix and extract eigenvectors, selecting the top components that
      explain, say, 95% of variance. Projecting the data onto these components reduces dimensionality
      dramatically, cutting training time. However, I must verify that the discarded variance does not
      contain discriminative information – I would compare validation accuracy before and after PCA. If
      accuracy drops, I might retain more components or use a supervised technique like LDA. Also, I would
      ensure the PCA transformation is fitted only on the training split to avoid data leakage.
    key_points:
    - id: kp_1
      statement: Mentions standardising features before applying PCA.
      required: true
    - id: kp_2
      statement: Describes selecting components based on explained variance (e.g., 95%).
      required: true
    - id: kp_3
      statement: Notes the need to evaluate impact on validation accuracy.
      required: true
    - id: kp_4
      statement: Warns about fitting PCA only on training data to prevent data leakage.
      required: true
    hint_ladder:
    - Think about scaling and the covariance matrix.
    - What could go wrong if you compute PCA on the whole dataset?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  dimensionality_reduction__q2:
    stem: During a clustering project you visualise the data with t-SNE and see two tight groups, yet
      the silhouette score is low. What could be causing this discrepancy and how would you resolve it?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:dimensionality_reduction
      weight: 0.7
    - id: concept:clustering
      weight: 0.15
    reference_answer: t-SNE is a non-linear embedding that prioritises local structure, so it can show
      apparent clusters even when the high-dimensional space is not well separated. A low silhouette score
      indicates that, in the original space, points are not clearly assigned to distinct clusters. The
      mismatch may arise from using t-SNE with a perplexity that exaggerates local neighbourhoods or from
      high noise dimensions. To resolve it, I would first evaluate clustering on the original features
      using a metric like silhouette or Davies-Bouldin, possibly after reducing dimensions with a linear
      method such as PCA to denoise. I might also tune t-SNE parameters (perplexity, learning rate) and
      compare with other embeddings like UMAP to ensure the visual pattern reflects true cluster structure.
    key_points:
    - id: kp_1
      statement: Explains that t-SNE preserves local structure and can create visual clusters even when
        global separation is weak.
      required: true
    - id: kp_2
      statement: Links low silhouette score to poor separation in the original space.
      required: true
    - id: kp_3
      statement: Suggests evaluating clustering on original or PCA-reduced data before trusting the t-SNE
        plot.
      required: true
    - id: kp_4
      statement: Mentions tuning t-SNE parameters or trying alternative embeddings like UMAP.
      required: false
    hint_ladder:
    - What does t-SNE optimise versus what silhouette measures?
    - Consider preprocessing before visualisation.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
