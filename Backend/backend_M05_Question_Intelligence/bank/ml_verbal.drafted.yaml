  bias_variance_tradeoff__q2:
    stem: In a Kaggle competition you try a deep tree and get a training RMSE of 2.5 but a test RMSE of
      7.2. Explain the bias-variance trade-off behind this result and why a bagging ensemble might help.
    modality: verbal
    round_types:
