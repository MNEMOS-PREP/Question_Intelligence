items:
  ml_problem_framing__q1:
    stem: You have a dataset of house features and prices; the business wants to predict future prices.
      How would you frame this ML problem, and what key decisions does that framing dictate?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:ml_problem_framing
      weight: 0.7
    reference_answer: I would treat this as a supervised regression problem because the goal is to predict
      a numeric value – the house price – from known features. That means we need a labelled dataset where
      each row includes the price. I would choose a regression-oriented model such as linear regression
      or a tree-based regressor, and use a loss like mean squared error. Since we care about how well
      the model will work on unseen houses, I would set aside a validation set or use k-fold cross-validation
      to estimate performance. Finally, I’d plan for feature engineering – encoding categorical variables
      like neighbourhood, scaling area, and possibly creating interaction terms – before training the
      model.
    key_points:
    - id: kp_1
      statement: Identifies the task as a supervised regression problem.
      required: true
    - id: kp_2
      statement: Mentions that the target variable is continuous (price) and that a loss function like
        MSE will be used.
      required: true
    - id: kp_3
      statement: Notes that a train-test split or cross-validation is needed to evaluate generalisation.
      required: false
    - id: kp_4
      statement: States that feature engineering (e.g., handling categorical location data) will be part
        of the pipeline.
      required: false
    hint_ladder:
    - Think about the nature of the target variable.
    - What evaluation strategy ensures the model will work on new data?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  ml_problem_framing__q2:
    stem: A retailer has millions of transaction logs but no labels; they want to discover customer segments.
      From a problem-framing perspective, what type of ML task is this and what considerations guide your
      approach?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:ml_problem_framing
      weight: 0.7
    - id: concept:clustering
      weight: 0.15
    reference_answer: Since the data have no labels, the problem is an unsupervised learning task – we’re
      looking for natural groupings of customers, i.e., clustering. The objective is to represent each
      transaction by features (frequency, monetary value, product categories) and then apply a similarity
      measure and a clustering algorithm such as K-means or DBSCAN. Because there’s no ground-truth label,
      we evaluate the result with internal metrics like silhouette score or by checking whether the discovered
      segments align with business insights (e.g., high-value vs occasional shoppers). The framing also
      tells us we must preprocess the data (normalisation, handling sparsity) before clustering.
    key_points:
    - id: kp_1
      statement: Classifies the task as unsupervised learning, specifically clustering.
      required: true
    - id: kp_2
      statement: Explains that there is no target variable, so the goal is to find structure in the feature
        space.
      required: true
    - id: kp_3
      statement: Mentions the need to choose a similarity metric and a clustering algorithm (e.g., K-means,
        hierarchical).
      required: false
    - id: kp_4
      statement: Highlights evaluation challenges, such as using silhouette score or business validation
        rather than traditional accuracy.
      required: false
    hint_ladder:
    - What’s missing that would make this a supervised problem?
    - Which family of algorithms works without explicit labels?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  probability_for_ml__q1_bayes_interpretation:
    stem: Suppose a medical test for a disease is 99% sensitive and 95% specific, and the disease prevalence
      is 1%. If a patient tests positive, what is the probability they actually have the disease?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:probability_for_ml
      weight: 0.7
    reference_answer: Using Bayes theorem, the posterior probability P(Disease|Positive) = (0.99 × 0.01)
      / [(0.99 × 0.01) + (0.05 × 0.99)] ≈ 0.0099 / 0.0594 ≈ 0.166, or about 16.6%. So even with a test
      that is 99% sensitive and 95% specific, a positive result only implies roughly a 17% chance of actually
      having the disease because the disease is rare.
    key_points:
    - id: kp_1
      statement: Computes the posterior probability as (sensitivity × prevalence) / [(sensitivity × prevalence)
        + (1-specificity) × (1-prevalence)]
      required: true
    - id: kp_2
      statement: Arrives at approximately 17% chance that the patient truly has the disease
      required: true
    - id: kp_3
      statement: Highlights why a highly accurate test can still give many false positives when prevalence
        is low
      required: false
    hint_ladder:
    - Apply Bayes theorem using sensitivity, specificity, and prevalence.
    - Remember specificity relates to true negatives.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  probability_for_ml__q2_mle_parameter_estimation:
    stem: You have a dataset of independent coin flips that resulted in 7 heads out of 10 tosses. Using
      maximum likelihood estimation, what is the estimated probability of heads, and how would you explain
      the intuition behind this estimate?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 240
    concepts:
    - id: concept:probability_for_ml
      weight: 0.7
    - id: concept:linear_regression
      weight: 0.15
    reference_answer: 'The likelihood of observing 7 heads and 3 tails given a head probability p is L(p)=p⁷(1-p)³.
      Maximising this, we take the log-likelihood, differentiate: d/dp [7 log p + 3 log(1-p)] = 7/p –
      3/(1-p). Setting to zero yields 7(1-p)=3p, so p̂=7/10=0.7. This estimate equals the empirical frequency
      of heads, which makes sense because the MLE selects the parameter that makes the observed data most
      likely.'
    key_points:
    - id: kp_1
      statement: The likelihood L(p) = p^7 (1-p)^3 for 7 heads and 3 tails.
      required: true
    - id: kp_2
      statement: Taking the log, differentiating, and solving gives p̂ = 7/10 = 0.7 as the MLE.
      required: true
    - id: kp_3
      statement: Intuitively, the MLE chooses the parameter that makes the observed data most probable,
        which for a Bernoulli is simply the observed frequency of heads.
      required: false
    hint_ladder:
    - Write the likelihood function for a Bernoulli parameter p.
    - Take the derivative with respect to p and set it to zero.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  linear_algebra_for_ml__q1:
    stem: If you have two feature vectors **a** and **b**, why does their dot product tell you about the
      similarity of the corresponding data points?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: intro
    time_budget_s: 150
    concepts:
    - id: concept:linear_algebra_for_ml
      weight: 0.7
    reference_answer: The dot product of two vectors a and b is defined as |a|·|b|·cosθ, where θ is the
      angle between them. Because the cosine ranges from -1 to 1, the dot product is large and positive
      when the vectors point in roughly the same direction (small θ), indicating high similarity. If they
      are orthogonal (θ = 90°), the cosine is zero and the dot product is zero, meaning no linear similarity.
      A negative value means they point opposite each other. Since the magnitude factors can dominate,
      we usually normalise the vectors to unit length; then the dot product directly equals cosθ, giving
      a clean similarity score between -1 and 1.
    key_points:
    - id: kp_1
      statement: Explains that the dot product equals the product of magnitudes times the cosine of the
        angle between the vectors.
      required: true
    - id: kp_2
      statement: States that a larger positive dot product means a smaller angle, i.e., higher similarity,
        while a zero or negative value indicates orthogonal or opposite directions.
      required: true
    - id: kp_3
      statement: Mentions that scaling either vector scales the dot product proportionally, so normalization
        is often applied before using it as a similarity measure.
      required: false
    hint_ladder:
    - Think about the geometric interpretation of the dot product.
    - Consider what happens when the vectors are orthogonal or point in the same direction.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  linear_algebra_for_ml__q2:
    stem: During training a linear regression model, you notice the weight matrix is singular. What does
      that imply about the data, and how would you fix it?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:linear_algebra_for_ml
      weight: 0.7
    - id: concept:regularisation
      weight: 0.15
    - id: concept:dimensionality_reduction
      weight: 0.15
    reference_answer: A singular weight matrix arises because the normal-equation matrix XᵀX is not full
      rank – some columns of the design matrix are linear combinations of others. Consequently the least-squares
      solution is not unique and the inverse required for OLS does not exist, causing numerical instability.
      To resolve this you can drop or combine the collinear features, or introduce regularisation such
      as ridge regression, which adds λI to XᵀX and makes it invertible. Another approach is to apply
      dimensionality reduction (e.g., PCA) to obtain a set of independent components before fitting the
      model.
    key_points:
    - id: kp_1
      statement: States that a singular weight matrix means the design matrix X'X is not full rank, i.e.,
        columns are linearly dependent.
      required: true
    - id: kp_2
      statement: Describes that this leads to infinite solutions for the normal equations, making ordinary
        least squares unstable.
      required: true
    - id: kp_3
      statement: Proposes remedies such as removing redundant features, applying regularisation (e.g.,
        ridge regression), or using dimensionality reduction like PCA.
      required: true
    - id: kp_4
      statement: Optionally mentions checking for duplicate or constant columns as a quick fix.
      required: false
    hint_ladder:
    - Recall the condition for a matrix to be invertible.
    - Think about the relationship between columns of the design matrix.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  loss_functions__q1:
    stem: When training a binary classifier, why is cross-entropy loss generally preferred over mean-squared
      error, and what does its shape imply for gradient-based optimization?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:loss_functions
      weight: 0.7
    - id: concept:logistic_regression
      weight: 0.15
    reference_answer: Cross-entropy loss measures the negative log-likelihood of the true class, so it
      heavily penalises predictions that are both confident and wrong, which aligns with the goal of a
      probabilistic classifier. Its gradient with respect to the logit is simply (p − y), where p is the
      predicted probability and y the label, giving a steady signal even when predictions are far from
      the target. In contrast, mean-squared error treats the output as a regression target; when combined
      with a sigmoid it multiplies the error by the sigmoid derivative, which can become very small near
      the extremes, slowing learning. Hence cross-entropy leads to faster, more stable convergence for
      binary logistic models.
    key_points:
    - id: kp_1
      statement: Cross-entropy penalises confident wrong predictions much more than MSE, encouraging probability-calibrated
        outputs.
      required: true
    - id: kp_2
      statement: Its derivative with respect to the logits is proportional to (prediction – label), leading
        to smoother, non-vanishing gradients.
      required: true
    - id: kp_3
      statement: MSE can cause vanishing gradients when using a sigmoid output because the derivative
        includes the sigmoid derivative squared.
      required: false
    hint_ladder:
    - Think about how each loss reacts to a prediction of 0.99 when the true label is 0.
    - Consider the form of the gradient for a sigmoid output.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  loss_functions__q2:
    stem: You notice that after a few epochs your model’s training loss keeps dropping but validation
      loss starts rising sharply. How could the choice of loss function be contributing to this over-fitting
      symptom?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 240
    concepts:
    - id: concept:loss_functions
      weight: 0.7
    - id: concept:regularisation
      weight: 0.15
    - id: concept:overfitting
      weight: 0.15
    reference_answer: When you minimise a pure loss like MSE or cross-entropy, the optimizer focuses solely
      on reducing error on the training set, so it can increase model complexity to fit noise, which shows
      up as a rising validation loss. If the loss is augmented with a regularisation component—say, L2
      weight decay—the objective also penalises large weight magnitudes, effectively constraining capacity
      and encouraging smoother solutions that generalise better. Moreover, using a loss that is highly
      sensitive to outliers, such as MSE on noisy labels, can force the model to chase rare extreme errors,
      further driving over-fitting. Adding regularisation or switching to a more robust loss helps keep
      validation loss from diverging.
    key_points:
    - id: kp_1
      statement: A loss without regularisation (e.g., plain MSE or cross-entropy) only measures fit to
        the training data, giving the optimizer freedom to memorize noise.
      required: true
    - id: kp_2
      statement: Adding a regularisation term (L2 or L1) to the loss penalises large weights, limiting
        model capacity and helping validation loss stay stable.
      required: true
    - id: kp_3
      statement: Choosing a loss that is overly sensitive to outliers, such as MSE on noisy targets, can
        push the model to fit rare extreme points, worsening generalisation.
      required: false
    hint_ladder:
    - What term can you add to the loss to discourage large weights?
    - Which loss is known to be sensitive to outliers?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  gradient_descent__q1:
    stem: You notice the training loss keeps decreasing but the validation loss plateaus and then rises
      after a few epochs; what does this tell you about your gradient descent setup?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:gradient_descent
      weight: 0.7
    - id: concept:overfitting
      weight: 0.15
    reference_answer: When the training loss keeps falling but validation loss stops improving and then
      climbs, it signals that the model is starting to overfit. The optimizer is still finding directions
      that reduce error on the training set, but those directions do not generalise. Often this pattern
      appears when the learning rate is too large, causing the updates to bounce around the optimum and
      make the model chase noise. To fix it, you can lower the learning rate, use learning-rate decay,
      or add regularisation such as L2 or early stopping, which will keep the validation loss from rising.
    key_points:
    - id: kp_1
      statement: 'The model is beginning to overfit: it continues to fit training data while generalisation
        degrades.'
      required: true
    - id: kp_2
      statement: A learning rate that is too high can cause the optimizer to overshoot minima, leading
        to unstable validation loss.
      required: false
    - id: kp_3
      statement: Reducing the learning rate or adding regularisation can help the validation loss improve.
      required: true
    hint_ladder:
    - Think about what drives the gap between training and validation curves.
    - Consider the role of step size and when you might need to adjust it.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  gradient_descent__q2:
    stem: In a mini-batch gradient descent run, you accidentally shuffle the data once at the start and
      then keep the same batch ordering for every epoch. How could this affect convergence compared to
      proper reshuffling each epoch?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:gradient_descent
      weight: 0.7
    reference_answer: If you shuffle only once, each mini-batch contains the same subset of examples every
      epoch, so the gradient estimate becomes biased toward that ordering. The updates become highly correlated,
      reducing the stochastic noise that helps the optimizer escape shallow minima and plateaus. Consequently,
      convergence can be slower and may settle in a sub-optimal region. Regularly reshuffling each epoch
      restores the randomness, giving a more unbiased gradient estimate and typically faster, more robust
      convergence.
    key_points:
    - id: kp_1
      statement: Repeated batch ordering reduces gradient noise, making updates more correlated and potentially
        causing the optimizer to get stuck in poor local minima.
      required: true
    - id: kp_2
      statement: Lack of reshuffling can lead to slower convergence because the algorithm sees the same
        data pattern each epoch.
      required: false
    - id: kp_3
      statement: Proper reshuffling each epoch restores the stochastic property, improving exploration
        of the loss surface.
      required: true
    hint_ladder:
    - Recall why stochasticity is introduced in SGD.
    - Think about the gradient estimate bias when batches repeat.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  train_test_split__q1:
    stem: You notice that your model’s validation accuracy is consistently higher than its test accuracy.
      What could be causing this discrepancy and how would you fix it?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: intro
    time_budget_s: 120
    concepts:
    - id: concept:train_test_split
      weight: 0.7
    - id: concept:data_leakage
      weight: 0.15
    reference_answer: If validation accuracy is higher than test accuracy, it often means validation data
      has been contaminated. A common leak is fitting scalers, encoders, or feature selection on the full
      dataset before splitting, so the model indirectly sees information from the validation set. To fix
      it, you should split the data first, then fit any preprocessing only on the training portion and
      apply the same transformation to validation and test sets. Also ensure that no target-related features
      are included. By keeping the test set completely untouched until final evaluation, the discrepancy
      should disappear.
    key_points:
    - id: kp_1
      statement: Identifies that data leakage (e.g., using target information or scaling parameters from
        the whole dataset) can inflate validation performance.
      required: true
    - id: kp_2
      statement: Recommends re-splitting the data so that preprocessing is fit only on the training set
        and applied to validation and test separately.
      required: true
    - id: kp_3
      statement: Mentions that using a proper hold-out test set that is never touched during model development
        prevents the gap.
      required: false
    hint_ladder:
    - Think about what information might unintentionally flow from training to validation.
    - Consider how you split the data and any preprocessing steps.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  train_test_split__q2:
    stem: Explain why you would keep a separate validation set instead of using the test set for hyper-parameter
      tuning, and what risk you avoid by doing so.
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: intro
    time_budget_s: 120
    concepts:
    - id: concept:train_test_split
      weight: 0.7
    - id: concept:bias_variance_tradeoff
      weight: 0.15
    reference_answer: The test set is meant to give an unbiased estimate of how the model will perform
      on truly unseen data, so it must stay untouched until the very end. If you tune hyper-parameters
      on the test set, you start over-fitting to it, inflating performance and introducing optimistic
      bias. A separate validation set lets you experiment with model choices, regularisation, and architecture
      while keeping the test set pristine. This separation preserves a reliable estimate of generalisation
      and helps you gauge the bias-variance trade-off before committing to the final model.
    key_points:
    - id: kp_1
      statement: States that the test set should represent unseen data for final performance estimation.
      required: true
    - id: kp_2
      statement: Explains that using the test set for hyper-parameter tuning leads to optimistic bias
        because the model is indirectly fitted to it.
      required: true
    - id: kp_3
      statement: Mentions that a separate validation set allows unbiased tuning and helps assess bias-variance
        trade-off before final testing.
      required: false
    hint_ladder:
    - Recall the purpose of each data split.
    - Think about what happens when you repeatedly evaluate on the same set.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  overfitting__q1:
    stem: You train a decision-tree model and notice the training accuracy is 99% but validation accuracy
      drops to 70%; what is happening and how would you address it?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:overfitting
      weight: 0.7
    - id: concept:regularisation
      weight: 0.15
    - id: concept:cross_validation
      weight: 0.15
    reference_answer: 'The pattern you’re seeing is classic overfitting: the tree has learned the training
      set almost perfectly, including its noise, so it cannot generalise to unseen data, which is why
      validation accuracy is much lower. To fix it, you can simplify the tree – limit its maximum depth,
      require a minimum number of samples per leaf, or prune branches that don’t improve validation loss.
      Adding regularisation like cost-complexity pruning also helps. It’s good practice to evaluate the
      model with k-fold cross-validation so you’re not relying on a single split, and if possible, collect
      more data or engineer more robust features to improve generalisation.'
    key_points:
    - id: kp_1
      statement: 'Identifies the situation as overfitting: model captures noise in training data leading
        to high training but low validation performance.'
      required: true
    - id: kp_2
      statement: Mentions reducing model complexity (e.g., limiting depth, pruning) or adding regularisation
        as a remedy.
      required: true
    - id: kp_3
      statement: Suggests using cross-validation or a held-out test set to get a more reliable estimate
        of generalisation error.
      required: false
    - id: kp_4
      statement: Notes that gathering more data or feature engineering can also help mitigate overfitting.
      required: false
    hint_ladder:
    - Think about the gap between training and validation performance.
    - What levers does a decision-tree offer to control its capacity?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  overfitting__q2:
    stem: During a Kaggle competition you notice your model’s training loss keeps decreasing while the
      validation loss starts to increase after epoch 12; explain why this occurs and what steps you would
      take next.
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:overfitting
      weight: 0.7
    - id: concept:regularisation
      weight: 0.15
    reference_answer: 'What you’re observing is the textbook sign of overfitting: the model continues
      to fit the training data, so training loss keeps falling, but it starts to memorise noise, causing
      validation loss to rise after epoch 12. The quickest fix is to employ early stopping – monitor validation
      loss and halt training when it stops improving. You can also add regularisation such as L2 weight
      decay or dropout, or shrink the network’s depth/width to reduce capacity. Finally, verify that your
      validation split is clean and there’s no data leakage, because that can also distort the curves.'
    key_points:
    - id: kp_1
      statement: Describes the phenomenon as overfitting manifested by a diverging training and validation
        loss curve.
      required: true
    - id: kp_2
      statement: Proposes early stopping as a practical countermeasure, stopping training when validation
        loss stops improving.
      required: true
    - id: kp_3
      statement: Mentions adding regularisation (L2, dropout) or reducing model capacity as alternative
        remedies.
      required: false
    - id: kp_4
      statement: Suggests checking data leakage or re-splitting data if the pattern seems abnormal.
      required: false
    hint_ladder:
    - Look at the shape of the loss curves over epochs.
    - What techniques can you apply during training to prevent a model from memorising the training set?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  bias_variance_tradeoff__q1:
    stem: You notice your model's training error is low but validation error is high; what does this indicate
      about bias and variance, and how would you address it?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:bias_variance_tradeoff
      weight: 0.7
    - id: concept:overfitting
      weight: 0.15
    - id: concept:cross_validation
      weight: 0.15
    reference_answer: When training error is low but validation error spikes, the model is fitting noise
      in the training set – a classic high-variance situation. High bias would manifest as both errors
      being large and similar. To curb variance we can gather more data, prune the model, add regularisation,
      or switch to a less complex algorithm. Running k-fold cross-validation helps confirm that the gap
      persists across folds, reinforcing that variance, not bias, is the problem.
    key_points:
    - id: kp_1
      statement: Identifies low training error and high validation error as a sign of high variance (overfitting).
      required: true
    - id: kp_2
