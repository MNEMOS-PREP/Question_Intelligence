  data_leakage__q1_debug_timeseries_leakage:
    stem: You are building a model to predict next month's sales using past sales data, and you notice
      the validation RMSE is unrealistically low. What could be causing data leakage in this time-series
      setup, and how would you fix it?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:data_leakage
      weight: 0.7
    - id: concept:cross_validation
      weight: 0.15
    reference_answer: 'In a time-series problem, a random split mixes future observations into the training
      set, so the model sees data it shouldn''t have when predicting the next month. Also, engineered
      features such as a 3-month moving average that includes the month you are trying to predict directly
      leak the target into the inputs. The fix is to respect temporal order: use a chronological train-test
      split or walk-forward (rolling) validation, and ensure every feature is computed only from data
      available before the prediction point. After these changes, the validation RMSE will rise to a realistic
      level, reflecting true generalisation.'
    key_points:
    - id: kp_1
      statement: Using random train-test split on time-ordered data leaks future information into training.
      required: true
    - id: kp_2
      statement: Features like rolling averages that include the target month cause target leakage.
      required: true
    - id: kp_3
      statement: Switch to a chronological split or walk-forward validation to prevent leakage.
      required: true
    - id: kp_4
      statement: Re-engineer leaking features so they only use past information.
      required: false
    hint_ladder:
