  classification_metrics__q1_debugging_metrics_mismatch:
    stem: You trained a binary classifier and notice that the accuracy is 95% but the F1-score is only
      0.45; what could be causing this discrepancy and how would you investigate?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:classification_metrics
      weight: 0.7
    - id: concept:class_imbalance
      weight: 0.15
    reference_answer: A 95% accuracy with a low F1 usually signals a class-imbalance problem. If, say,
      90% of samples belong to the negative class, a model that predicts everything negative will still
      be 90% accurate, but precision and recall for the positive class will be near zero, dragging the
      F1 down to around 0.45. I would first look at the confusion matrix to see how many true positives
      we actually have and compare it with the class distribution. If imbalance is confirmed, I’d try
      techniques like oversampling the minority class, using class-weighted loss, or switching to a metric
      such as ROC-AUC that is less affected by skewed classes. This would give a clearer picture of the
      model’s real performance.
    key_points:
    - id: kp_1
      statement: Identifies that the data is highly imbalanced, with the majority class dominating accuracy.
      required: true
    - id: kp_2
      statement: Explains that precision and recall (hence F1) are sensitive to minority-class performance,
        unlike accuracy.
      required: true
    - id: kp_3
      statement: Suggests checking the confusion matrix and class distribution to confirm imbalance.
      required: false
    - id: kp_4
      statement: Recommends using resampling, class weighting, or alternative metrics (e.g., ROC-AUC)
        to get a more realistic assessment.
      required: false
    hint_ladder:
    - What does the confusion matrix reveal about true/false positives?
    - Think about how class distribution influences each metric.
