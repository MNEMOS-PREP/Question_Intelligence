  feature_engineering__q1:
    stem: You notice that a linear regression model’s training error is low but its test error is high
      after you one-hot encode a categorical variable with many levels. What could be going wrong and
      how would you fix it?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:feature_engineering
      weight: 0.7
    - id: concept:data_leakage
      weight: 0.15
    - id: concept:overfitting
      weight: 0.15
    reference_answer: 'When you one-hot encode a categorical variable with dozens or hundreds of distinct
      values, each level becomes its own binary column. This inflates the feature space dramatically,
      making the model highly flexible and prone to fit noise in the training data, which shows up as
      a low training error but a high test error – classic overfitting. To address it, you can reduce
      the dimensionality: group rare categories into an "Other" bucket, use target/mean encoding, or apply
      a technique like PCA on the sparse matrix. Adding regularisation such as L1 (which also performs
      feature selection) or L2 helps constrain the coefficients. Finally, make sure the encoder is fitted
      only on the training split so that no information leaks into the test set.'
    key_points:
    - id: kp_1
      statement: One-hot encoding many levels creates a high-dimensional sparse feature space, increasing
        variance and causing overfitting.
      required: true
    - id: kp_2
      statement: Possible remedies include dropping rare categories, using target/mean encoding, applying
        dimensionality reduction (e.g., PCA), or adding regularisation (L1/L2).
      required: true
    - id: kp_3
      statement: Ensuring the encoding is fitted only on training data avoids data leakage into the test
        set.
      required: false
    hint_ladder:
