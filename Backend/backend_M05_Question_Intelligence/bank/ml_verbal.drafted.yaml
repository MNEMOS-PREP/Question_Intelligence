    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  classification_metrics__q2_tradeoff_choosing_threshold:
    stem: In a medical diagnosis model you must decide the decision threshold; how does changing the threshold
      affect precision, recall, and the ROC-AUC, and what trade-offs would you consider?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:classification_metrics
      weight: 0.7
    - id: concept:class_imbalance
      weight: 0.15
    reference_answer: Changing the decision threshold slides the operating point along the ROC curve.
      If we lower the threshold we label more instances as positive, which raises recall because we catch
      more true disease cases, but precision drops because we also generate more false positives. Raising
      the threshold does the opposite – higher precision, lower recall. The ROC-AUC, however, is computed
      by integrating over all possible thresholds, so moving the threshold does not alter the AUC itself;
      it only changes where we are on the curve. In a medical setting the priority is often high recall
      to avoid missing patients, even if it means more unnecessary follow-ups, so I would pick a threshold
      that gives an acceptable balance, perhaps by maximizing F1 or by assigning explicit costs to false
      negatives versus false positives.
    key_points:
    - id: kp_1
      statement: Describes that lowering the threshold increases recall (more positives detected) but
        reduces precision (more false positives).
      required: true
    - id: kp_2
      statement: Notes that ROC-AUC is threshold-independent; moving the threshold moves you along the
        ROC curve but does not change the AUC value.
      required: true
    - id: kp_3
      statement: 'Explains the practical trade-off: in medicine you may prefer higher recall to catch
        disease cases, accepting lower precision and more follow-up tests.'
      required: false
    - id: kp_4
      statement: Mentions that the optimal threshold can be chosen by maximizing a metric like F1 or using
        a cost-sensitive analysis.
      required: false
    hint_ladder:
    - What happens to true-positive and false-positive rates when you move the threshold?
    - Recall the definition of ROC-AUC.
