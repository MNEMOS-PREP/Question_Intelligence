  decision_trees__q2:
    stem: During a production run, you see a sudden drop in the accuracy of a decision-tree model that
      was previously stable. The recent data includes a new minority class that appears rarely. What could
      be happening and how would you diagnose and fix it?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: hard
    time_budget_s: 180
    concepts:
    - id: concept:decision_trees
      weight: 0.7
    - id: concept:class_imbalance
      weight: 0.15
    - id: concept:bias_variance_tradeoff
      weight: 0.15
    reference_answer: The most likely cause is that the new rare class has shifted the class distribution,
      so the tree’s impurity criterion (Gini or entropy) now treats splits that favour the majority class
      as optimal. This leads to poor recall on the minority and an overall accuracy drop. First, I would
      examine the recent data’s class frequencies and plot a confusion matrix to see which class is mis-predicted.
      If the minority class is indeed suffering, I could rebalance the training set – either by oversampling
      the rare class, undersampling the majority, or assigning class weights in the impurity calculation.
      Another option is to switch to a metric-driven split like information gain with class-weighted entropy.
      After adjusting, I would retrain and validate the model, monitoring both overall accuracy and per-class
      recall to ensure the fix works.
    key_points:
    - id: kp_1
      statement: Identifies that the new minority class causes class imbalance, making impurity measures
        favor the majority class.
