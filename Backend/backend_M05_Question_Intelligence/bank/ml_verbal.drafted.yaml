  ensemble_methods__q1:
    stem: Imagine you trained a decision-tree classifier on a small noisy dataset and observed high variance.
      You then apply bagging with 100 trees. What effect does bagging have on bias and variance, and why?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: hard
    time_budget_s: 180
    concepts:
    - id: concept:ensemble_methods
      weight: 0.7
    - id: concept:bias_variance_tradeoff
      weight: 0.15
    reference_answer: Bagging does not substantially change the bias of a decision-tree base learner because
      each tree is still built on the same algorithm and depth, so the systematic error stays about the
      same. However, by training each tree on a different bootstrap sample and then averaging (or majority
      voting), the random fluctuations caused by the particular training set are averaged out. This reduces
      variance dramatically – the ensemble’s prediction variance drops roughly by a factor of 1 / N where
      N is the number of trees, assuming the trees are not perfectly correlated. Hence, bagging mainly
      combats over-fitting on noisy, small data by stabilising the model while leaving bias largely untouched.
    key_points:
    - id: kp_1
      statement: Bagging leaves bias roughly unchanged because each base learner is still a high-bias
        decision tree.
      required: true
    - id: kp_2
      statement: Bagging reduces variance by averaging predictions over many decorrelated trees.
      required: true
    - id: kp_3
      statement: The variance reduction comes from the law of large numbers and the fact that each tree
        sees a different bootstrap sample.
      required: false
    hint_ladder:
    - Think about what changes when you average many noisy estimates.
    - Recall the bias-variance decomposition for an ensemble.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  ensemble_methods__q2:
    stem: During production you notice that a gradient-boosted model’s AUC has dropped after a recent
      data-drift event, while a random-forest model remains stable. Explain why boosting is more sensitive
      to such drift and what you could do to mitigate it.
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:ensemble_methods
      weight: 0.7
    - id: concept:data_leakage
      weight: 0.15
    - id: concept:cross_validation
      weight: 0.15
    reference_answer: Boosting methods such as XGBoost fit each new tree on the residuals of the previous
      ensemble, essentially learning the exact error pattern of the training data. When the data distribution
      changes, those residuals become stale – the later trees are now correcting mistakes that no longer
      exist, and the model over-fits to an outdated pattern, so metrics like AUC fall. Random forests,
      by contrast, grow trees independently on bootstrap samples, so each tree captures a broader view
      of the data and is less dependent on a specific error distribution, making them more drift-tolerant.
      To mitigate the issue you can schedule regular retraining on recent data, employ a sliding-window
      or online boosting variant, add drift detection to switch models, and validate with cross-validation
      that respects temporal ordering.
    key_points:
    - id: kp_1
      statement: Boosting builds trees sequentially, each correcting errors of the previous model, so
        it tightly fits the training distribution.
      required: true
    - id: kp_2
      statement: When the underlying data distribution shifts, the residuals the later trees were trained
        on no longer represent the current errors, causing performance degradation.
      required: true
    - id: kp_3
      statement: Random forests train trees independently, so they are less tied to the exact error pattern
        and are more robust to drift.
      required: false
    - id: kp_4
      statement: Mitigation strategies include periodic retraining, using online/partial-fit boosting,
        or incorporating drift detection and model-selection pipelines.
      required: true
    hint_ladder:
    - Recall how residuals are used in gradient boosting.
    - Consider what part of the model is tied to the training distribution.
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  support_vector_machines__q1:
    stem: You train a linear SVM on a highly imbalanced dataset where the minority class is only 5% of
