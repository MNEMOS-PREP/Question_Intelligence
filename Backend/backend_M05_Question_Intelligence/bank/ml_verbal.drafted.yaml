  k_nearest_neighbours__q1:
    stem: In a dataset with many irrelevant features, you train a k-NN classifier and notice test accuracy
      drops as you increase k. Why does adding irrelevant dimensions hurt k-NN, and how would you mitigate
      it?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:k_nearest_neighbours
      weight: 0.7
    - id: concept:dimensionality_reduction
      weight: 0.15
    reference_answer: k-NN relies on Euclidean (or similar) distance, so in high-dimensional space the
      distance between any two points becomes almost the same – the curse of dimensionality. Irrelevant
      features add noise to those distances, making neighbours less meaningful. When you increase k, you
      average over more noisy neighbours, so accuracy drops. To fix it, you can first drop useless columns
      or apply dimensionality reduction like PCA or LDA, keeping the components that explain most variance.
      Normalising features is also essential so that a high-range irrelevant feature doesn’t dominate
      the distance metric.
    key_points:
    - id: kp_1
      statement: Explains that distance calculations become dominated by noise in high-dimensional space,
        causing the curse of dimensionality.
      required: true
    - id: kp_2
      statement: Describes that increasing k smooths predictions, further amplifying the effect of irrelevant
        features.
      required: false
    - id: kp_3
      statement: Suggests dimensionality reduction (e.g., PCA) or feature selection to retain only informative
        attributes.
      required: true
    - id: kp_4
      statement: Mentions scaling/normalising features before distance computation.
      required: false
    hint_ladder:
    - Think about how distance behaves when you add many random dimensions.
    - What preprocessing step can compress the feature space?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  k_nearest_neighbours__q2:
    stem: During cross-validation you notice that a k-NN model with k=1 overfits, while k=7 underfits.
      How would you choose an optimal k, and what trade-off are you balancing?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: intro
    time_budget_s: 180
    concepts:
    - id: concept:k_nearest_neighbours
      weight: 0.7
    - id: concept:cross_validation
      weight: 0.15
    - id: concept:bias_variance_tradeoff
      weight: 0.15
    reference_answer: k-NN suffers from a classic bias-variance trade-off. With k=1 the model memorises
      the training set – zero bias but huge variance, so it overfits. With a large k like 7 the model
      smooths too much – high bias, low variance, leading to under-fitting. The usual way to pick k is
      to run a grid search over a range (e.g., 1 to 20) and evaluate each using k-fold cross-validation,
      selecting the k that gives the lowest average validation error or highest accuracy. This balances
      bias and variance, and using an odd k helps avoid tie votes in binary problems.
    key_points:
    - id: kp_1
      statement: 'Identifies the bias-variance trade-off: small k gives low bias high variance, large
        k gives high bias low variance.'
      required: true
    - id: kp_2
      statement: Proposes using grid search with cross-validation to evaluate several k values and pick
        the one with highest validation accuracy (or lowest error).
      required: true
    - id: kp_3
      statement: Mentions that the chosen k should minimise validation error, not just training error.
      required: false
    - id: kp_4
      statement: May note that odd k avoids ties in binary classification.
      required: false
    hint_ladder:
    - Recall the effect of k on model flexibility.
    - What systematic method lets you compare many k values fairly?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  naive_bayes__q1:
    stem: You have a text classification task with highly imbalanced classes; you decide to use Multinomial
      Naive Bayes. What effect does class imbalance have on the classifier's predictions and how can you
      mitigate it?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:naive_bayes
      weight: 0.7
    - id: concept:class_imbalance
      weight: 0.15
    - id: concept:classification_metrics
      weight: 0.15
    reference_answer: In Naive Bayes the posterior is proportional to the class prior times the likelihood.
      When classes are imbalanced the prior for the minority class is tiny, so even if the document’s
      words fit that class well, the posterior often stays lower than the majority class. Consequently
      the model tends to predict the majority label and accuracy looks fine while recall for the minority
      suffers. To mitigate this you can set the priors manually, for example using a uniform prior or
      the inverse of class frequencies, which raises the minority posterior. Additionally you should evaluate
      with precision, recall or F1 rather than raw accuracy, and you may also apply oversampling/undersampling
      or class-weighting before training.
    key_points:
    - id: kp_1
      statement: Explains that Naive Bayes predicts the class with highest posterior probability, so minority
        classes get lower priors and are often mis-classified.
      required: true
    - id: kp_2
      statement: Mentions adjusting class priors (e.g., using balanced class prior or prior smoothing)
        to compensate for imbalance.
      required: true
    - id: kp_3
      statement: Suggests evaluation with metrics such as precision, recall or F1 rather than accuracy
        to detect the problem.
      required: false
    - id: kp_4
      statement: Notes that oversampling/undersampling or using a different loss weighting can also help.
      required: false
    hint_ladder:
    - Think about what part of the Bayes formula reflects how common a class is.
    - What metric would reveal poor performance on a rare class?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  naive_bayes__q2:
    stem: During a production run you notice the Naive Bayes spam filter suddenly starts labeling many
      legitimate emails as spam. What kind of data-leakage issue could cause this, and how would you debug
      it?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:naive_bayes
      weight: 0.7
    - id: concept:data_leakage
      weight: 0.15
    - id: concept:cross_validation
      weight: 0.15
    reference_answer: A common leakage in a Naive Bayes spam filter is that the training set contains
      features that are only available after an email is classified, such as a ‘spam-score’ column or
      timestamps that differ between train and live data. When the model is deployed, those features are
      missing or have different distributions, so the posterior probabilities become unreliable and many
      ham messages get high spam posteriors. To debug, I would first compare the feature matrix used in
      training with the one generated in production, looking for columns that are always zero or have
      shifted means. I’d also run the model on a recent hold-out set that follows the exact production
      pipeline; if performance drops, the culprit is likely a leaking feature. The fix is to remove that
      feature or recompute priors on live data, and then re-validate with proper cross-validation that
      respects the temporal split.
    key_points:
    - id: kp_1
      statement: Identifies that training data may have included future information, such as email headers
        that change after deployment, leading to leakage.
      required: true
    - id: kp_2
      statement: Describes checking the feature extraction pipeline for features that are only present
        in training (e.g., label-encoded target words).
      required: true
    - id: kp_3
      statement: Recommends reproducing the issue on a hold-out set that mimics production and verifying
        that the same preprocessing steps are applied.
      required: false
    - id: kp_4
      statement: Suggests fixing the pipeline by removing the leaking feature or recomputing priors on
        live data.
      required: false
    hint_ladder:
    - What could be different about the data you see at training time versus at inference time?
    - How would you verify the preprocessing steps are identical?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  clustering__q1:
    stem: You have a dataset of customer transactions and you run K-means with K=4; the clusters look
      reasonable but one cluster contains 70% of the points. What could be causing this imbalance and
      how would you address it?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:clustering
      weight: 0.7
    - id: concept:feature_engineering
      weight: 0.15
    - id: concept:dimensionality_reduction
      weight: 0.15
    reference_answer: If one cluster swallows most points, the most common cause is that the feature space
      isn’t properly scaled or that some dimensions dominate the Euclidean distance, so K-means keeps
      pulling points into that region. I would first standardise or normalise all numeric features, and
      possibly drop or transform outlier-heavy attributes. Running PCA to keep the principal components
      that capture most variance can also help the algorithm see the true structure. After preprocessing,
      I’d re-run K-means and check silhouette scores; if the imbalance persists, I might switch to a density-based
      method like DBSCAN, which can separate dense groups from sparse noise without assuming equal-sized
      clusters.
    key_points:
    - id: kp_1
      statement: Identifies that poor feature scaling or irrelevant features can cause one cluster to
        dominate.
      required: true
    - id: kp_2
      statement: Suggests scaling (e.g., StandardScaler) or applying dimensionality reduction (PCA) before
        clustering.
      required: true
    - id: kp_3
      statement: Mentions alternative algorithms (e.g., DBSCAN) that are less sensitive to cluster size.
      required: false
    - id: kp_4
      statement: Discusses evaluating cluster quality with silhouette score or within-cluster sum of squares.
      required: false
    hint_ladder:
    - Think about how K-means measures distance between points.
    - What preprocessing steps change the geometry of the data?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
    drafted_by: openai/gpt-oss-120b
    drafted_at: '2026-10-07'
  clustering__q2:
    stem: During production you notice that a hierarchical clustering service suddenly returns many tiny
      clusters for new data. What steps would you take to debug the issue?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:clustering
      weight: 0.7
    - id: concept:data_leakage
      weight: 0.15
    - id: concept:cross_validation
      weight: 0.15
    reference_answer: My first move would be to confirm that the same linkage (e.g., average) and distance
      metric (e.g., Euclidean) used during model building are still configured in production; a silent
      switch to single linkage can explode the dendrogram into many tiny clusters. Next, I’d audit the
      preprocessing steps – scaling, encoding, missing-value handling – to ensure the live pipeline mirrors
      the training pipeline; a missing scaler can change the geometry dramatically. I’d also examine the
      incoming batch for distribution shift or a surge of outliers that compress distances, perhaps by
      plotting pairwise distance histograms. Finally, I’d review recent commits for accidental feature
      additions or data-leakage bugs that could alter the distance matrix, rolling back any suspect change
      and re-testing on a held-out validation set.
    key_points:
    - id: kp_1
      statement: Checks whether the linkage method or distance metric was unintentionally changed.
      required: true
    - id: kp_2
      statement: Verifies that the preprocessing pipeline (e.g., scaling, encoding) applied to training
        data is identical for incoming data.
      required: true
    - id: kp_3
      statement: Looks for data drift or outliers in the new batch that could shrink inter-point distances.
      required: false
    - id: kp_4
      statement: Considers whether a recent code change introduced data leakage or altered the feature
        set.
      required: false
    hint_ladder:
    - What parts of the clustering pipeline are easy to forget when moving to production?
    - How can a change in data distribution affect hierarchical linkage?
    provenance: generated
    scored_use_approved: false
    theta_eligible: false
