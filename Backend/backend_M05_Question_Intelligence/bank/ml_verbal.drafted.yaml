  cross_validation__item_2:
    stem: During model development you notice training error decreasing while validation error stays flat
      after a few epochs. From a bias-variance viewpoint, what does this indicate about your current cross-validation
      setup, and what change would you make?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:cross_validation
      weight: 0.7
    - id: concept:bias_variance_tradeoff
      weight: 0.15
    - id: concept:overfitting
      weight: 0.15
    reference_answer: When the training loss keeps dropping but the validation loss plateaus, the model
      is fitting the training folds too closely – a classic high-variance situation. It often means the
      validation folds are too few or not representative enough, so the estimate is noisy and the model
      appears to over-fit. To get a better picture, you can increase the number of folds, say from 5-fold
      to 10-fold, which gives each validation set more data and reduces variance in the estimate. Alternatively,
      you could set aside a larger hold-out validation set. Of course, you could also address the variance
      directly by adding regularisation or simplifying the model, but the immediate cross-validation fix
      is to use more folds for a more reliable estimate.
    key_points:
    - id: kp_1
      statement: Identifies that low training error and unchanged validation error suggests high variance
        (overfitting) on the training folds.
      required: true
    - id: kp_2
      statement: Explains that the validation folds may be too small or not representative, causing optimistic
        training performance.
      required: false
    - id: kp_3
      statement: Recommends increasing the number of folds (e.g., from 5-fold to 10-fold) or using a hold-out
        validation set to get a more stable estimate.
      required: true
    - id: kp_4
      statement: Mentions regularisation or simplifying the model as alternative ways to reduce variance.
      required: false
    hint_ladder:
