  logistic_regression__q2:
    stem: During model development you decide to add L2 regularisation to a logistic regression that is
      over-fitting on a small text-classification dataset. Explain how the regularisation term changes
      the optimisation and what effect you expect on the learned coefficients.
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:logistic_regression
      weight: 0.7
    - id: concept:regularisation
      weight: 0.15
    - id: concept:gradient_descent
      weight: 0.15
    reference_answer: Adding L2 regularisation means the loss becomes the usual log-loss plus λ times
      the sum of squares of the weights. During gradient descent the update rule gains an extra term 2λw,
      which pushes every coefficient a little toward zero on each step. As a result the model prefers
      smaller weights, which reduces variance and helps it generalise better on unseen data, though it
      introduces a bit more bias. The strength of λ controls how aggressive this shrinkage is, so we normally
      pick it with cross-validation.
    key_points:
    - id: kp_1
      statement: Describes that L2 adds λ‖w‖² to the loss, penalising large weights.
      required: true
    - id: kp_2
      statement: States that the gradient now includes 2λw, pulling coefficients toward zero during each
        update.
      required: true
    - id: kp_3
      statement: Predicts that coefficients will shrink, reducing variance and improving generalisation,
        at the cost of a slight bias increase.
      required: true
    - id: kp_4
      statement: Notes that λ must be tuned, often via cross-validation, to balance bias-variance.
      required: false
    hint_ladder:
