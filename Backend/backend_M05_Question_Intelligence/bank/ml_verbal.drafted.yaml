    difficulty_band: hard
    time_budget_s: 240
    concepts:
    - id: concept:bias_variance_tradeoff
      weight: 0.7
    - id: concept:ensemble_methods
      weight: 0.15
    - id: concept:decision_trees
      weight: 0.15
    reference_answer: A deep decision tree captures almost all training patterns, giving it very low bias,
      but it also memorises noise, so its variance is high – reflected in the jump from 2.5 to 7.2 RMSE
      on unseen data. Bagging builds many such trees on different bootstrap samples and averages their
      outputs, which smooths out the fluctuations caused by variance while leaving the low bias largely
      intact. Consequently, the ensemble’s test error typically drops, narrowing the gap with training
      error.
    key_points:
