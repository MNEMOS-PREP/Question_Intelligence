  linear_regression__item_1:
    stem: You have a dataset with a single numeric feature and a target; after fitting an OLS line you
      notice the residuals fan out as the feature increases. What does this pattern indicate about the
      model assumptions, and what simple step could you take to improve the fit?
    modality: verbal
    round_types:
    - ml_verbal
    difficulty_band: core
    time_budget_s: 180
    concepts:
    - id: concept:linear_regression
      weight: 0.7
    - id: concept:regression_metrics
      weight: 0.15
    reference_answer: When the residuals spread out as the predictor grows, it signals heteroscedasticity
      – the error variance is not constant, violating a key OLS assumption. This means our confidence
      intervals and p-values may be unreliable. A quick fix is to transform the target, for example take
      log(y), which often stabilises variance, or alternatively fit a weighted least-squares model that
      gives less weight to points with larger residuals. Either approach helps restore the homoscedasticity
      assumption and improves the model’s reliability.
    key_points:
    - id: kp_1
      statement: Identifies heteroscedasticity – variance of errors increasing with the predictor.
      required: true
    - id: kp_2
      statement: Explains that OLS assumes constant variance (homoscedasticity) and that violation can
        bias standard errors.
      required: true
    - id: kp_3
      statement: Suggests a simple remedy such as applying a log transformation to the target or using
        weighted least squares.
      required: true
    hint_ladder:
    - Look at the shape of the residual plot.
    - Think about what OLS assumes about error variance.
