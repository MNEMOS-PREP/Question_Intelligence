      alone is therefore misleading. To see the real performance we should look at precision, recall or
      F1 for the minority class, or the ROC-AUC. To improve it we can give the SVM a higher penalty for
      misclassifying minority samples (the class_weight parameter), or resample the data – either oversample
      the minority with SMOTE or undersample the majority. Using stratified cross-validation ensures those
      metrics are reliable across folds.
    key_points:
    - id: kp_1
      statement: Recognises that high accuracy is misleading due to class imbalance and the model is likely
        predicting the majority class for almost all instances.
      required: true
    - id: kp_2
      statement: Mentions appropriate metrics such as precision, recall, F1-score or AUC-ROC to evaluate
        the minority class performance.
      required: true
    - id: kp_3
      statement: 'Suggests remedial actions: re-sampling (SMOTE or undersampling), class-weight adjustment
        in the SVM loss, or using a different decision threshold.'
