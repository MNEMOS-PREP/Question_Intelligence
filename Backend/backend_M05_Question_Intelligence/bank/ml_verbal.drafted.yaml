    reference_answer: 'To curb over-fitting you can restrict the tree’s complexity. The most direct knobs
      are max_depth, min_samples_split, min_samples_leaf or max_leaf_nodes – setting any of these stops
      the tree from growing indefinitely. Another approach is pruning: either stop splitting early (pre-pruning)
      by requiring a minimum impurity reduction, or grow the full tree then cut back branches that give
      little gain (post-pruning) using a validation set. Both methods raise bias but lower variance, which
      usually improves test accuracy. In practice you would run a few folds of cross-validation to choose
      the depth or pruning threshold that yields the best validation score.'
